/* Tri : les plus récentes d'abord */
function triDepenses(liste){
  return liste.slice().sort(function(a,b){
    if(a.date === b.date) return (b.cree||0) - (a.cree||0);
    return a.date < b.date ? 1 : -1;
  });
}
/* F5 : vert < 70 % · orange 70–99 % · rouge en dépassement */
function etatJauge(depense, affecte){
  if(affecte <= 0) return depense > 0 ? "rouge" : "neutre";
  var p = depense / affecte * 100;
  if(p > 100) return "rouge";
  if(p >= 70) return "orange";
  return "vert";
}
function couleurEtat(e){
  return e === "rouge" ? "var(--red)" : e === "orange" ? "var(--orange)"
       : e === "vert" ? "var(--green)" : e === "attente" ? "var(--bleu)" : "var(--muted)";
}
function classeEtat(e){
  return e === "rouge" ? "c-rouge" : e === "orange" ? "c-orange" : e === "vert" ? "c-vert"
       : e === "attente" ? "c-attente" : "c-neutre";
}

/* ==============================================================
   SPRINT 4 — ÉPARGNE VALORISÉE (F10)
   Dans le groupe Épargne & Investissement, on ne « dépense » pas :
   on met de côté. Rien n'y passe jamais au rouge.
   ============================================================== */
function estEpargne(r){
  return !!r && (r.groupe || "") === GROUPE_EPARGNE;
}
/* État d'une rubrique ou d'un groupe :
   épargne → vert dès l'objectif atteint, bleu d'attente avant, jamais de rouge
   ailleurs → vert < 70 % · orange 70–99 % · rouge en dépassement (F5, inchangé) */
function etatDe(depense, affecte, epargne){
  if(epargne){
    if(depense <= 0) return affecte > 0 ? "attente" : "neutre";
    return (depense >= affecte) ? "vert" : "attente";
  }
  return etatJauge(depense, affecte);
}
/* petite jauge : dépensé (ou mis de côté) / affecté */
function jaugeRub(depense, affecte, epargne, etatForce){
  var wrap = el("div", "jauge-r");
  var b = document.createElement("i");
  var base = Math.max(affecte, depense, 1);
  var p = Math.min(100, depense / base * 100);
  b.style.width = (depense > 0 ? Math.max(p, 3) : 0) + "%";
  b.style.background = couleurEtat(etatForce || etatDe(depense, affecte, epargne));
  wrap.appendChild(b);
  return wrap;
}
/* Phrase de droite sous une jauge d'épargne : jamais un reproche */
function motEpargne(mis, objectif){
  if(objectif <= 0) return mis > 0 ? "Tout est du gagné" : "Aucun objectif fixé";
  if(mis > objectif) return "Objectif dépassé de " + fmtF(mis - objectif) + " 🎉";
  if(mis === objectif && mis > 0) return "Objectif atteint 🎉";
  return "Encore " + fmtF(objectif - mis) + " à mettre de côté";
}
/* Total mis de côté sur le cycle en cours */
function totalEpargne(){
  return S.depenses.reduce(function(t, d){
    var r = rubriqueParId(d.rubrique);
    return t + (estEpargne(r) ? (Number(d.montant) || 0) : 0);
  }, 0);
}
/* Total mis de côté sur un cycle archivé */
function cycEpargne(c){
  var ids = {};
  c.rubriques.forEach(function(r){ if(estEpargne(r)) ids[r.id] = true; });
  return c.depenses.reduce(function(t, d){
    return t + (ids[d.rubrique] ? (Number(d.montant) || 0) : 0);
  }, 0);
}

/* ==============================================================
   SPRINT 4 — ASSISTANT DE LISSAGE (F9)
   Montant réel + périodicité → provision mensuelle.
   Ex. : 20 000 F par trimestre → 6 667 F par mois.
   ============================================================== */
function estPeriodicite(cle){
  for(var i = 0; i < PERIODICITES.length; i++){ if(PERIODICITES[i].cle === cle) return true; }
  return false;
}
function periodDe(cle){
  for(var i = 0; i < PERIODICITES.length; i++){ if(PERIODICITES[i].cle === cle) return PERIODICITES[i]; }
  return PERIODICITES[0];
}
function provisionRub(r){
  var reel = Number(r.montantReel) || 0;
  if(reel <= 0) return 0;
  return Math.round(reel / periodDe(r.periodicite).mois);
}
/* Rappel affiché sous le nom de la rubrique, quand un lissage est mémorisé */
function rappelLissage(r){
  var reel = Number(r.montantReel) || 0;
  if(reel <= 0) return "";
  var p = periodDe(r.periodicite);
  if(p.cle === "mensuel") return fmtF(reel) + " par mois";
  return fmtF(reel) + " " + p.par + " ≈ " + fmtF(provisionRub(r)) + "/mois";
}

/* ==============================================================
   SPRINT 3 — CYCLES BUDGÉTAIRES (F1)
   ============================================================== */

/* Le cycle en cours est-il arrivé à échéance ? */
function cycleAEcheance(){
  if(!S.onboarded || S.jourSalaire === null || S.jourSalaire === undefined) return false;
  var t = new Date(); t.setHours(0,0,0,0);
  return t.getTime() >= paieApres(S.cycleDebut || aujourdhui()).getTime();
}
function periodeCycle(c){
  return dateComplete(c.debut) + " → " + dateComplete(c.fin);
}
function cycleParId(id){
  for(var i = 0; i < S.cycles.length; i++){ if(S.cycles[i].id === id) return S.cycles[i]; }
  return null;
}
/* Photographie du cycle en cours, telle qu'elle sera archivée */
function instantaneCycle(){
  return {
    id: S.cycleId || uid(),
    debut: S.cycleDebut || aujourdhui(),
    fin: aujourdhui(),
    jourSalaire: S.jourSalaire,
    revenus: S.revenus.map(function(r){
      return completerRevenu({id: r.id, libelle: r.libelle, montant: Number(r.montant) || 0, date: r.date || null}, r);
    }),
    /* on garde les rubriques qui ont reçu un montant, porté une dépense, ou qui sont actives */
    rubriques: S.rubriques.filter(function(r){
      return r.active || (Number(r.montant) || 0) > 0 || depenseRub(r.id) > 0;
    }).map(function(r){
      return {id: r.id, nom: r.nom, icone: r.icone, couleur: r.couleur,
              groupe: r.groupe, montant: Number(r.montant) || 0};
    }),
    depenses: S.depenses.map(function(d){
      return completerDepense({id: d.id, rubrique: d.rubrique, montant: Number(d.montant) || 0,
              libelle: d.libelle || "", date: d.date, cree: d.cree || 0}, d);
    })
  };
}
/* --- calculs sur un cycle archivé --- */
function cycRevenus(c){
  return c.revenus.reduce(function(t,r){ return t + (Number(r.montant)||0); }, 0);
}
function cycReparti(c){
  return c.rubriques.reduce(function(t,r){ return t + (Number(r.montant)||0); }, 0);
}
function cycDepenseRub(c, id){
  return c.depenses.reduce(function(t,d){
    return t + (d.rubrique === id ? (Number(d.montant)||0) : 0);
  }, 0);
}
function cycDepense(c){
  return c.depenses.reduce(function(t,d){ return t + (Number(d.montant)||0); }, 0);
}

/* Préparer un nouveau cycle : revenus et répartition préremplis, modifiables */
function ouvrirNouveauCycle(){
  /* Sprint 6A — seuls les revenus réguliers sont préremplis ; les
     exceptionnels, les emprunts reçus et les ajustements repartent à zéro
     (ils ne sont pas reportés). La nature n'est recopiée que si elle avait
     été choisie : un champ absent reste absent. */
  var repris = S.revenus.filter(function(r){
    return natureDe(r) === "regulier" && !estAjustement(r);
  }).map(function(r){
    /* Sprint 7A — la ligne d'origine entière est passée (nature, type…). Une
       ligne du nouveau cycle est un nouveau revenu : sa propre proposition de
       mise de côté reste possible (6D), d'où le retrait de partProposee. */
    var o = completerRevenu({id: uid(), libelle: r.libelle, montant: Number(r.montant) || 0, date: null}, r);
    delete o.partProposee;
    delete o.pret;   /* Sprint 7C — un revenu du nouveau cycle n'est relié à aucun prêt */
    return o;
  });
  if(!repris.length) repris = [{id: uid(), libelle: "Salaire net", montant: 0, date: null}];
  brouillonCycle = {
    revenus: repris,
    montants: {},
    /* Sprint 5B — base de référence pour la répartition automatique
       proportionnelle si les revenus changent (F2bis).
       Sprint 6A — comparée aux seuls revenus repris, pour ne pas annoncer
       un « changement » qui ne vient que du non-report des exceptionnels. */
    montantsOrigine: {},
    totalOrigine: repris.reduce(function(t, r){ return t + (Number(r.montant) || 0); }, 0),
    derniereDecisionTotal: null,
    suggIgnorees: {},   /* Sprint 6A — suggestions de budget écartées sur cet écran */
    reelsFixes: {}      /* Sprint 6A — « Fixer » accepté : montantReel posé à la validation */
  };
  actives().forEach(function(r){
    brouillonCycle.montants[r.id] = Number(r.montant) || 0;
    brouillonCycle.montantsOrigine[r.id] = Number(r.montant) || 0;
  });
  proposerMensualites(brouillonCycle);   /* Sprint 7C — nouveaux emprunts ajoutés, dettes soldées retirées */
  aller("nouveauCycle");
}
/* Sprint 5B — recalcule les montants du brouillon proportionnellement au
   nouveau total de revenus, à partir des montants du cycle précédent :
   les charges fixes restent identiques, l'épargne suit le revenu au même
   pourcentage, le reste (vie courante, social & loisirs…) absorbe l'écart. */
function recalculerRepartitionAuto(){
  if(!brouillonCycle) return;
  var b = brouillonCycle;
  var oldTotal = b.totalOrigine, newTotal = brTotalRevenus();
  if(oldTotal <= 0 || newTotal <= 0) return;
  var act = actives();
  var fixTotal = 0, epTotal = 0, varTotal = 0;
  act.forEach(function(r){
    var m = Number(b.montantsOrigine[r.id]) || 0;
    if(r.groupe === "Fixes") fixTotal += m;
    else if(estEpargne(r)) varTotal += 0, epTotal += m;
    else varTotal += m;
  });
  var epNeuf = epTotal * (newTotal / oldTotal);
  var budgetVar = Math.max(0, newTotal - fixTotal - epNeuf);
  act.forEach(function(r){
    var mOld = Number(b.montantsOrigine[r.id]) || 0;
    if(r.groupe === "Fixes"){
      b.montants[r.id] = mOld;
    }else if(estEpargne(r)){
      b.montants[r.id] = Math.round(mOld * (newTotal / oldTotal));
    }else{
      b.montants[r.id] = varTotal > 0 ? Math.round(mOld / varTotal * budgetVar) : 0;
    }
  });
}
function brTotalRevenus(){
  if(!brouillonCycle) return 0;
  return brouillonCycle.revenus.reduce(function(t,r){ return t + (Number(r.montant)||0); }, 0);
}
function brTotalReparti(){
  if(!brouillonCycle) return 0;
  return actives().reduce(function(t,r){ return t + (Number(brouillonCycle.montants[r.id])||0); }, 0);
}
/* Clôture de l'ancien cycle, ouverture du nouveau */
function validerNouveauCycle(){
  if(!brouillonCycle) return;
  var b = brouillonCycle;
  S.cycles.unshift(instantaneCycle());       /* le plus récent en tête */
  S.cycleId = uid();
  S.cycleDebut = aujourdhui();
  S.revenus = b.revenus.map(function(r){
    /* Sprint 7A — ligne du brouillon entière : la nature ET le type suivent */
    return completerRevenu({id: uid(), libelle: r.libelle || "Revenu", montant: Number(r.montant) || 0, date: r.date || null}, r);
  });
  if(!S.revenus.length) S.revenus = [{id: uid(), libelle: "Salaire net", montant: 0, date: null}];
  S.rubriques.forEach(function(r){
    r.montant = r.active ? (Number(b.montants[r.id]) || 0) : 0;
    /* Sprint 6A — suggestion « Fixer » acceptée sur l'écran du nouveau cycle */
    if(r.active && b.reelsFixes && b.reelsFixes[r.id] && b.reelsFixes[r.id] === r.montant
       && (r.periodicite || "mensuel") === "mensuel") r.montantReel = r.montant;
  });
  S.epargneFelicitee = totalEpargne();       /* Sprint 4 — de quoi féliciter (F10) */
  S.depenses = [];
  creerEcheances(S.cycleDebut);              /* Sprint 6D — prévisions des échéances des charges fixes */
  S.revenus.forEach(enfilerPart);            /* Sprint 6D — part à proposer sur les revenus exceptionnels saisis */
  S.rappelSauvegarde = true;                 /* rappel doux à chaque clôture (F7) */
  /* Sprint 6A — les suggestions ignorées ne valent que pour un cycle */
  if(S.reglages && Array.isArray(S.reglages.suggestionsIgnorees) && S.reglages.suggestionsIgnorees.length){
    S.reglages.suggestionsIgnorees = [];
  }
  brouillonCycle = null;
  sauver();
  aller("dashboard");
  toast("Nouveau cycle démarré ✓");
}

/* ==============================================================
   SPRINT 3 — AFFICHAGE PAR GROUPES (F5)
   ============================================================== */
/* Groupes réellement représentés, dans l'ordre du cahier des charges.
   Les groupes vides ne sont jamais renvoyés. */
function groupesPresents(liste){
  var vus = [], out = [];
  liste.forEach(function(r){
    var g = r.groupe || "Autres";
    if(vus.indexOf(g) < 0) vus.push(g);
  });
  GROUPES.forEach(function(g){ if(vus.indexOf(g) >= 0) out.push(g); });
  vus.forEach(function(g){ if(out.indexOf(g) < 0) out.push(g); });
  return out;
}
function membresGroupe(liste, g){
  return liste.filter(function(r){ return (r.groupe || "Autres") === g; });
}
/* En-tête de groupe : nom + sous-total dépensé (ou mis de côté) / affecté.
   Sprint 4 — le groupe Épargne & Investissement suit la règle positive (F10). */
function enteteGroupe(nom, affecte, depense, epargne){
  var h = el("div", "grp " + classeGroupe(nom));   /* Sprint 7B — bandeau de 4 px et nom dans la couleur du groupe */
  var t = el("div", "grp-t");
  t.appendChild(el("span", "grp-nom", nom));
  t.appendChild(el("span", "grp-mont", fmtF(depense) + " / " + fmtF(affecte)));
  h.appendChild(t);
  h.appendChild(jaugeRub(depense, affecte, epargne));
  if(epargne){

    l.style.marginTop = "5px";
    h.appendChild(l);
  }
  return h;
}

function sauvegarderDonnees(){
  var ok = false;
  try{
    var texte = JSON.stringify(S, null, 2);
    var blob = new Blob([texte], {type: "application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "mondjai-sauvegarde-" + aujourdhui() + ".json";
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){
      if(a.parentNode) a.parentNode.removeChild(a);
      URL.revokeObjectURL(url);
    }, 1500);
    ok = true;
  }catch(e){ ok = false; }
  if(ok){
    S.derniereSauvegarde = aujourdhui();
    S.rappelSauvegarde = false;
    sauver();
    toast("Sauvegarde téléchargée ✓");
    render();
  }else{

}
function restaurerDonnees(){

  input.accept = "application/json,.json";
  input.style.display = "none";
  document.body.appendChild(input);
  input.addEventListener("change", function(){
    var f = input.files && input.files[0];
    if(!f){ if(input.parentNode) input.parentNode.removeChild(input); return; }
    var lecteur = new FileReader();
    lecteur.onload = function(){
      var objet = null;
      try{ objet = normaliser(JSON.parse(String(lecteur.result))); }catch(e){ objet = null; }
      if(!objet){

      }else{
        var res = objet.cycles.length;
        var msg = "Restaurer cette sauvegarde ?\n\n"
                + "Elle contient " + objet.rubriques.length + " rubriques, "
                + objet.depenses.length + " dépenses dans le cycle en cours et "
                + res + (res > 1 ? " cycles archivés" : " cycle archivé") + ".\n\n"
                + "Toutes les données actuellement sur cet appareil seront remplacées.";
        if(confirm(msg)){

          sauver();
          rubOuverte = null; cycleOuvert = null; brouillonCycle = null;
          vue = S.onboarded ? "dashboard" : "revenus";
          render();
          toast("Sauvegarde restaurée ✓");

}

/* ==============================================================
   SPRINT 5B — EXPORT EXCEL (F7bis)
   Rapport à LIRE (revenus, dépenses, sous-totaux), généré en
   JavaScript pur — aucune bibliothèque externe, comme le reste de
   l'application. Bien distinct de la sauvegarde JSON ci-dessus (F7) :
   ce fichier ne permet pas de restaurer les données, seule la
   sauvegarde le permet.

   Un fichier .xlsx est un .zip contenant des fichiers XML. On écrit
   donc ici un petit assembleur ZIP (méthode "stockée", sans
   compression — pas besoin de DEFLATE pour quelques dizaines de Ko
   de texte) puis le XML minimal d'un classeur à un seul onglet.
   ============================================================== */

/* ---------- utilitaires bas niveau ---------- */

/* UTF-8 « à la main » (gère aussi les emoji, encodés sur 2 mots UTF-16) */
function utf8Octets(str){
  var out = [];
  for(var i = 0; i < str.length; i++){
    var c = str.charCodeAt(i);
    if(c >= 0xD800 && c <= 0xDBFF && i + 1 < str.length){
      var c2 = str.charCodeAt(i + 1);
      if(c2 >= 0xDC00 && c2 <= 0xDFFF){
        c = ((c - 0xD800) << 10) + (c2 - 0xDC00) + 0x10000;
        i++;
      }
    }
    if(c < 0x80){
      out.push(c);
    }else if(c < 0x800){
      out.push(0xC0 | (c >> 6), 0x80 | (c & 0x3F));
    }else if(c < 0x10000){
      out.push(0xE0 | (c >> 12), 0x80 | ((c >> 6) & 0x3F), 0x80 | (c & 0x3F));
    }else{
      out.push(0xF0 | (c >> 18), 0x80 | ((c >> 12) & 0x3F), 0x80 | ((c >> 6) & 0x3F), 0x80 | (c & 0x3F));
    }
  }
  return new Uint8Array(out);
}
function xmlEsc(s){
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function colLetra(n){
  var s = "", k = n + 1;
  while(k > 0){
    var m = (k - 1) % 26;
    s = String.fromCharCode(65 + m) + s;
    k = Math.floor((k - 1) / 26);
  }
  return s;
}
function celRef(c0, r){ return colLetra(c0) + r; }
/* Date ISO (aaaa-mm-jj) -> numéro de série Excel (jours depuis le 30/12/1899) */
function serieExcel(isoStr){
  if(!isoStr) return null;
  var p = String(isoStr).split("-");
  var an = Number(p[0]), mo = Number(p[1]), jr = Number(p[2]);
  if(!an || !mo || !jr) return null;
  var cible = Date.UTC(an, mo - 1, jr);
  var origine = Date.UTC(1899, 11, 30);
  return Math.round((cible - origine) / 86400000);
}

/* ---------- mini-ZIP (méthode "stockée", sans compression) ---------- */
var CRC_TABLE = (function(){
  var t = [];
  for(var n = 0; n < 256; n++){
    var c = n;
    for(var k = 0; k < 8; k++){ c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); }
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes){
  var c = 0xFFFFFFFF;
  for(var i = 0; i < bytes.length; i++){ c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8); }
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function pushU16(a, n){ a.push(n & 0xFF, (n >>> 8) & 0xFF); }
function pushU32(a, n){ a.push(n & 0xFF, (n >>> 8) & 0xFF, (n >>> 16) & 0xFF, (n >>> 24) & 0xFF); }
function dosDateTime(d){
  var t = ((d.getHours() & 0x1F) << 11) | ((d.getMinutes() & 0x3F) << 5) | (Math.floor(d.getSeconds() / 2) & 0x1F);
  var da = (((d.getFullYear() - 1980) & 0x7F) << 9) | (((d.getMonth() + 1) & 0xF) << 5) | (d.getDate() & 0x1F);
  return {time: t & 0xFFFF, date: da & 0xFFFF};
}
function concatBytes(tab){
  var total = 0;
  tab.forEach(function(a){ total += a.length; });
  var out = new Uint8Array(total), p = 0;
  tab.forEach(function(a){ out.set(a, p); p += a.length; });
  return out;
}
/* fichiers : [{nom: "xl/workbook.xml", octets: Uint8Array}, ...] */
function creerZip(fichiers){
  var dt = dosDateTime(new Date());
  var locaux = [], centraux = [], offset = 0;

  fichiers.forEach(function(f){
    var nomB = utf8Octets(f.nom);
    var data = f.octets;
    var crc = crc32(data);

    var lfh = [];
    pushU32(lfh, 0x04034b50); pushU16(lfh, 20); pushU16(lfh, 0); pushU16(lfh, 0);
    pushU16(lfh, dt.time); pushU16(lfh, dt.date);
    pushU32(lfh, crc); pushU32(lfh, data.length); pushU32(lfh, data.length);
    pushU16(lfh, nomB.length); pushU16(lfh, 0);
    var localBytes = concatBytes([new Uint8Array(lfh), nomB, data]);
    locaux.push(localBytes);

    var cdh = [];
    pushU32(cdh, 0x02014b50); pushU16(cdh, 20); pushU16(cdh, 20); pushU16(cdh, 0); pushU16(cdh, 0);
    pushU16(cdh, dt.time); pushU16(cdh, dt.date);
    pushU32(cdh, crc); pushU32(cdh, data.length); pushU32(cdh, data.length);
    pushU16(cdh, nomB.length); pushU16(cdh, 0); pushU16(cdh, 0); pushU16(cdh, 0); pushU16(cdh, 0);
    pushU32(cdh, 0); pushU32(cdh, offset);
    centraux.push(concatBytes([new Uint8Array(cdh), nomB]));

    offset += localBytes.length;
  });

  var centralBytes = concatBytes(centraux);
  var eocd = [];
  pushU32(eocd, 0x06054b50); pushU16(eocd, 0); pushU16(eocd, 0);
  pushU16(eocd, fichiers.length); pushU16(eocd, fichiers.length);
  pushU32(eocd, centralBytes.length); pushU32(eocd, offset); pushU16(eocd, 0);

  return concatBytes(locaux.concat([centralBytes, new Uint8Array(eocd)]));
}

/* ---------- xl/styles.xml ----------
   Les montants FCFA sont écrits en TEXTE déjà mis en forme (séparateur
   de milliers par espace, comme fmt()/fmtF() dans le reste de
   l'application) plutôt qu'en nombres + format Excel : le séparateur
   d'un format numérique standard ("#,##0") dépend de la langue réglée
   sur l'appareil qui ouvre le fichier (virgule, point ou espace selon
   les cas) — en texte, l'espace est garanti, quel que soit le tableur
   ou la langue de qui l'ouvre. Seules les dates restent de vraies
   dates Excel : "jj/mm/aaaa" s'affiche pareil partout.
   numFmtId 166 = date jj/mm/aaaa (seul format numérique du fichier)
   Styles (index utilisés dans les cellules via l'attribut s) :
   0 normal · 1 gras · 2 titre · 3 en-tête de tableau (gras + trame + filet)
   4 montant gras aligné à droite (statistiques, sous-totaux)
   5 montant aligné à droite (lignes du tableau) · 6 date
   7 montant gras aligné à droite + filet (division) · 8 texte gras + filet (division) */
function construireStylesXml(){
  var numFmts = "<numFmts count=\"1\">"
    + "<numFmt numFmtId=\"166\" formatCode=\"dd/mm/yyyy\"/>"
    + "</numFmts>";
  var fonts = "<fonts count=\"3\">"
    + "<font><sz val=\"11\"/><name val=\"Calibri\"/></font>"
    + "<font><b/><sz val=\"11\"/><name val=\"Calibri\"/></font>"
    + "<font><b/><sz val=\"16\"/><name val=\"Calibri\"/></font>"
    + "</fonts>";
  var fills = "<fills count=\"3\">"
    + "<fill><patternFill patternType=\"none\"/></fill>"
    + "<fill><patternFill patternType=\"gray125\"/></fill>"
    + "<fill><patternFill patternType=\"solid\"><fgColor rgb=\"FFEDEDED\"/><bgColor indexed=\"64\"/></patternFill></fill>"
    + "</fills>";
  var borders = "<borders count=\"3\">"
    + "<border><left/><right/><top/><bottom/><diagonal/></border>"
    + "<border><left/><right/><top/><bottom style=\"thin\"><color indexed=\"64\"/></bottom><diagonal/></border>"
    + "<border><left/><right/><top style=\"thin\"><color indexed=\"64\"/></top><bottom/><diagonal/></border>"
    + "</borders>";
  var cellStyleXfs = "<cellStyleXfs count=\"1\"><xf numFmtId=\"0\" fontId=\"0\" fillId=\"0\" borderId=\"0\"/></cellStyleXfs>";

  function xf(numFmtId, fontId, fillId, borderId, alignRight){
    return "<xf numFmtId=\"" + numFmtId + "\" fontId=\"" + fontId + "\" fillId=\"" + fillId + "\" borderId=\"" + borderId + "\" xfId=\"0\""
      + (numFmtId ? " applyNumberFormat=\"1\"" : "")
      + (fontId ? " applyFont=\"1\"" : "")
      + (fillId ? " applyFill=\"1\"" : "")
      + (borderId ? " applyBorder=\"1\"" : "")
      + (alignRight ? " applyAlignment=\"1\"" : "")
      + (alignRight ? "><alignment horizontal=\"right\"/></xf>" : "/>");
  }
  var xfs = [
    xf(0, 0, 0, 0, false),   /* 0 normal */
    xf(0, 1, 0, 0, false),   /* 1 gras */
    xf(0, 2, 0, 0, false),   /* 2 titre */
    xf(0, 1, 2, 1, false),   /* 3 en-tête de tableau */
    xf(0, 1, 0, 0, true),    /* 4 montant gras, aligné à droite */
    xf(0, 0, 0, 0, true),    /* 5 montant, aligné à droite */
    xf(166, 0, 0, 0, false), /* 6 date */
    xf(0, 1, 0, 2, true),    /* 7 montant gras + filet, aligné à droite */
    xf(0, 1, 0, 2, false)    /* 8 texte gras + filet (division) */
  ];
  var cellXfs = "<cellXfs count=\"" + xfs.length + "\">" + xfs.join("") + "</cellXfs>";

  return "<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>"
    + "<styleSheet xmlns=\"http://schemas.openxmlformats.org/spreadsheetml/2006/main\">"
    + numFmts + fonts + fills + borders + cellStyleXfs + cellXfs
    + "<cellStyles count=\"1\"><cellStyle name=\"Normal\" xfId=\"0\" builtinId=\"0\"/></cellStyles>"
    + "</styleSheet>";
}

/* ---------- construction des lignes de la feuille ---------- */
var STY_GRAS = 1, STY_TITRE = 2, STY_ENTETE = 3, STY_MONT_G = 4,
    STY_MONT = 5, STY_DATE = 6, STY_MONT_G_F = 7, STY_GRAS_F = 8;

function construireLignes(d){
  var lignes = [], fusions = [];
  var largeurs = [12, 22, 30, 24, 15, 34, 18, 20]; /* A..H, en caractères Excel (G, H : Sprint 6B) */
  var row = 1;

  function ligne(r){ var L = {r: r, cells: []}; lignes.push(L); return L; }
  function texte(L, c, v, s){ L.cells.push({c: c, v: (v === null || v === undefined) ? "" : String(v), t: "str", s: s || 0}); }
  /* montants FCFA : texte déjà mis en forme (fmt/fmtF), jamais un nombre + format Excel (voir note ci-dessus) */
  function montant(L, c, v, s, avecUnite){
    texte(L, c, avecUnite ? fmtF(v) : fmt(v), (s === undefined ? STY_MONT : s));
  }
  function date(L, c, iso, s){
    var n = serieExcel(iso);
    if(n === null) return;
    L.cells.push({c: c, v: n, t: "num", s: (s === undefined ? STY_DATE : s)});
  }

  /* --- titre --- */
  var l1 = ligne(row); texte(l1, 0, "MonDjai — Export de données", STY_TITRE);
  fusions.push("A" + row + ":F" + row);
  row += 2;

  /* --- période + statistiques --- */
  var l2 = ligne(row);
  texte(l2, 0, "Période couverte", STY_GRAS);
  texte(l2, 2, dateComplete(d.periodeDebut) + " → " + dateComplete(d.periodeFin));
  fusions.push("A" + row + ":B" + row);
  fusions.push("C" + row + ":F" + row);
  row++;

  function stat(label, valeur){
    var L = ligne(row);
    texte(L, 0, label, STY_GRAS);
    montant(L, 4, valeur, STY_MONT_G, true);
    fusions.push("A" + row + ":D" + row);
    row++;
  }
  stat("Total des revenus", d.totRevenus);
  stat("Total des dépenses", d.totDepenses);
  stat("Solde", d.solde);
  stat("Total épargné (cycle en cours + cycles archivés)", d.totEpargne);
  row++;

  /* --- section Revenus --- */
  var lt1 = ligne(row); texte(lt1, 0, "Revenus", STY_GRAS); row++;
  var lh1 = ligne(row);
  texte(lh1, 0, "Date", STY_ENTETE); texte(lh1, 1, "Libellé", STY_ENTETE); texte(lh1, 2, "Montant (F CFA)", STY_ENTETE);
  texte(lh1, 3, "Nature", STY_ENTETE); texte(lh1, 4, "", STY_ENTETE); texte(lh1, 5, "", STY_ENTETE);  /* Sprint 6A */
  texte(lh1, 6, "", STY_ENTETE); texte(lh1, 7, "", STY_ENTETE);  /* Sprint 6B */
  row++;
  if(!d.revenus.length){
    texte(ligne(row), 0, "Aucun revenu enregistré."); row++;
  }else{
    d.revenus.forEach(function(r){
      var L = ligne(row);
      date(L, 0, r.date);
      texte(L, 1, r.libelle || "—");
      montant(L, 2, r.montant);
      texte(L, 3, r.nature || "");   /* Sprint 6A */
      row++;
    });
  }
  row++;

  /* --- section Dépenses --- */
  var lt2 = ligne(row); texte(lt2, 0, "Dépenses", STY_GRAS); row++;
  var ligneEnteteDepenses = row; /* pour le volet figé */
  var lh2 = ligne(row);
  ["Date", "Cycle", "Rubrique", "Groupe", "Montant (F CFA)", "Note", "Étiquette", "Pour qui"].forEach(function(t, i){
    texte(lh2, i, t, STY_ENTETE);
  });
  row++;
  if(!d.depenses.length){
    texte(ligne(row), 0, "Aucune dépense enregistrée."); row++;
  }else{
    d.depenses.forEach(function(dep){
      var L = ligne(row);
      date(L, 0, dep.date);
      date(L, 1, dep.cycle);
      texte(L, 2, dep.rubrique);
      texte(L, 3, dep.groupe);
      montant(L, 4, dep.montant);
      texte(L, 5, dep.note || "");
      texte(L, 6, dep.etiquette || "");   /* Sprint 6B */
      texte(L, 7, dep.pour || "");        /* Sprint 6B */
      row++;
    });

    /* --- sous-total par rubrique --- */
    d.sousTotaux.forEach(function(st, i){
      var L = ligne(row);
      texte(L, 2, st.rubrique, i === 0 ? STY_GRAS_F : STY_GRAS);
      montant(L, 4, st.montant, i === 0 ? STY_MONT_G_F : STY_MONT_G, true);
      row++;
    });
    var lTot = ligne(row);
    texte(lTot, 2, "Total", STY_GRAS_F);
    montant(lTot, 4, d.totDepenses, STY_MONT_G_F, true);
    row++;
  }

  /* --- Sprint 7C : bloc « Prêts et dettes », à la fin (seulement s'il y a des prêts suivis) --- */
  if(d.prets && d.prets.length){
    row++;
    var lt3 = ligne(row); texte(lt3, 0, "Prêts et dettes", STY_GRAS); row++;
    var lh3 = ligne(row);
    ["Sens", "Qui", "Date", "Montant", "Remboursé", "Reste", "Prévu le", "Mensualité"].forEach(function(t, i){
      texte(lh3, i, t, STY_ENTETE);
    });
    row++;
    d.prets.forEach(function(p){
      var L = ligne(row);
      texte(L, 0, p.sens);
      texte(L, 1, p.qui);
      date(L, 2, p.date);
      montant(L, 3, p.montant);
      montant(L, 4, p.rembourse);
      montant(L, 5, p.reste);
      date(L, 6, p.echeance);
      if(p.mensualite > 0) montant(L, 7, p.mensualite);
      row++;
    });
  }

  return {lignes: lignes, fusions: fusions, largeurs: largeurs, freezeRow: ligneEnteteDepenses, maxRow: row};
}

/* ---------- xl/worksheets/sheet1.xml ---------- */
function construireFeuilleXml(res){
  var largeurs = res.largeurs;
  var cols = "<cols>";
  largeurs.forEach(function(w, i){
    cols += "<col min=\"" + (i + 1) + "\" max=\"" + (i + 1) + "\" width=\"" + w + "\" customWidth=\"1\"/>";
  });
  cols += "</cols>";

  var sheetViews = "<sheetViews><sheetView workbookViewId=\"0\">";
  if(res.freezeRow > 0){
    sheetViews += "<pane ySplit=\"" + res.freezeRow + "\" topLeftCell=\"A" + (res.freezeRow + 1) + "\" activePane=\"bottomLeft\" state=\"frozen\"/>"
      + "<selection pane=\"bottomLeft\" activeCell=\"A" + (res.freezeRow + 1) + "\" sqref=\"A" + (res.freezeRow + 1) + "\"/>";
  }
  sheetViews += "</sheetView></sheetViews>";

  var rowsXml = "";
  res.lignes.forEach(function(L){
    if(!L.cells.length) return;
    rowsXml += "<row r=\"" + L.r + "\">";
    L.cells.forEach(function(cell){
      var ref = celRef(cell.c, L.r);
      var sAttr = cell.s ? (" s=\"" + cell.s + "\"") : "";
      if(cell.t === "str"){
        if(cell.v === ""){
          if(cell.s) rowsXml += "<c r=\"" + ref + "\"" + sAttr + "/>";
          return;
        }
        rowsXml += "<c r=\"" + ref + "\"" + sAttr + " t=\"inlineStr\"><is><t xml:space=\"preserve\">" + xmlEsc(cell.v) + "</t></is></c>";
      }else{
        rowsXml += "<c r=\"" + ref + "\"" + sAttr + "><v>" + cell.v + "</v></c>";
      }
    });
    rowsXml += "</row>";
  });

  var mergeXml = "";
  if(res.fusions.length){
    mergeXml = "<mergeCells count=\"" + res.fusions.length + "\">";
    res.fusions.forEach(function(m){ mergeXml += "<mergeCell ref=\"" + m + "\"/>"; });
    mergeXml += "</mergeCells>";
  }

  return "<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>"
    + "<worksheet xmlns=\"http://schemas.openxmlformats.org/spreadsheetml/2006/main\">"
    + "<dimension ref=\"A1:" + colLetra(res.largeurs.length - 1) + res.maxRow + "\"/>"
    + sheetViews + cols
    + "<sheetData>" + rowsXml + "</sheetData>"
    + mergeXml
    + "</worksheet>";
}

/* ---------- collecte des données (cycle en cours + cycles archivés) ---------- */
function rubriqueDansListe(id, liste){
  for(var i = 0; i < liste.length; i++){ if(liste[i].id === id) return liste[i]; }
  return null;
}
function libelleRubriqueExport(id, liste){
  var r = rubriqueDansListe(id, liste);
  return r ? ((r.icone ? r.icone + " " : "") + r.nom) : "(rubrique supprimée)";
}
function groupeRubriqueExport(id, liste){
  var r = rubriqueDansListe(id, liste);
  return r ? (r.groupe || "Autres") : "Autres";
}
function donneesExport(){
  /* Sprint 6A — nature de chaque revenu (absente = régulier) */
  function natureExport(r){
    return natureInfo(natureDe(r)).lab + (estAjustement(r) ? " (ajustement)" : "");
  }
  var revenus = [];
  S.revenus.forEach(function(r){
    revenus.push({date: r.date || null, libelle: r.libelle || "", montant: Number(r.montant) || 0, nature: natureExport(r)});
  });
  S.cycles.forEach(function(c){
    (c.revenus || []).forEach(function(r){
      revenus.push({date: r.date || null, libelle: r.libelle || "", montant: Number(r.montant) || 0, nature: natureExport(r)});
    });
  });

  var depenses = [];
  S.depenses.forEach(function(dp){
    depenses.push({
      date: dp.date, cycle: S.cycleDebut || aujourdhui(),
      rubrique: libelleRubriqueExport(dp.rubrique, S.rubriques),
      groupe: groupeRubriqueExport(dp.rubrique, S.rubriques),
      montant: Number(dp.montant) || 0, note: dp.libelle || "", etiquette: dp.etiquette || "", pour: dp.pour || ""
    });
  });
  S.cycles.forEach(function(c){
    (c.depenses || []).forEach(function(dp){
      depenses.push({
        date: dp.date, cycle: c.debut,
        rubrique: libelleRubriqueExport(dp.rubrique, c.rubriques),
        groupe: groupeRubriqueExport(dp.rubrique, c.rubriques),
        montant: Number(dp.montant) || 0, note: dp.libelle || "", etiquette: dp.etiquette || "", pour: dp.pour || ""
      });
    });
  });
  depenses.sort(function(a, b){
    if(a.date === b.date) return 0;
    return a.date < b.date ? 1 : -1; /* plus récent d'abord */
  });

  var totRevenus = totalRevenus() + S.cycles.reduce(function(t, c){ return t + cycRevenus(c); }, 0);
  var totDepenses = totalDepense() + S.cycles.reduce(function(t, c){ return t + cycDepense(c); }, 0);
  var totEpargne = totalEpargne() + S.cycles.reduce(function(t, c){ return t + cycEpargne(c); }, 0);

  var debuts = S.cycles.map(function(c){ return c.debut; });
  debuts.push(S.cycleDebut || aujourdhui());
  var periodeDebut = debuts.reduce(function(min, dt){ return (dt < min) ? dt : min; }, debuts[0]);

  var sousTotaux = {}, ordre = [];
  depenses.forEach(function(dp){
    if(!sousTotaux.hasOwnProperty(dp.rubrique)){ sousTotaux[dp.rubrique] = 0; ordre.push(dp.rubrique); }
    sousTotaux[dp.rubrique] += dp.montant;
  });
  var listeSousTotaux = ordre.map(function(nom){ return {rubrique: nom, montant: sousTotaux[nom]}; });
  listeSousTotaux.sort(function(a, b){ return b.montant - a.montant; });

  /* Sprint 7C — prêts donnés puis dettes, par date */
  var prets = (S.prets || []).slice().sort(function(a, b){
    if(a.sens !== b.sens) return a.sens === "donne" ? -1 : 1;
    return a.date === b.date ? 0 : (a.date < b.date ? -1 : 1);
  }).map(function(p){
    return {sens: p.sens === "donne" ? "Prêt donné" : "Dette", qui: nomPret(p), date: p.date, montant: p.montant,
            rembourse: rembourse(p), reste: restePret(p), echeance: p.echeance, mensualite: p.sens === "dette" ? p.mensualite : 0};
  });

  return {
    periodeDebut: periodeDebut, periodeFin: aujourdhui(),
    totRevenus: totRevenus, totDepenses: totDepenses,
    solde: totRevenus - totDepenses, totEpargne: totEpargne,
    revenus: revenus, depenses: depenses, sousTotaux: listeSousTotaux, prets: prets
  };
}

/* ---------- champ montant ---------- */
function champMontant(valeur, onChange){
  var i = document.createElement("input");
  i.type = "text";
  i.inputMode = "numeric";
  i.className = "money" + (valeur ? "" : " vide");
  i.value = valeur ? fmt(valeur) : "0";
  i.setAttribute("aria-label", "Montant en francs CFA");
  i.addEventListener("focus", function(){
    if(chiffres(i.value) === 0) i.value = "";
    setTimeout(function(){ try{ i.scrollIntoView({block:"center", behavior:"smooth"}); }catch(e){} }, 250);
  });
  i.addEventListener("input", function(){
    var v = chiffres(i.value);
    i.value = v ? fmt(v) : "";
    i.classList.toggle("vide", v === 0);
    onChange(v);
  });
  i.addEventListener("blur", function(){
    var v = chiffres(i.value);
    i.value = fmt(v);
    i.classList.toggle("vide", v === 0);
  });
  return i;
}

/* ---------- petit message de confirmation ---------- */
function toast(txt){
  /* Sprint 6B — un seul message à la fois : le précédent s'efface */
  Array.prototype.slice.call(document.querySelectorAll(".toast")).forEach(function(x){ if(x.parentNode) x.parentNode.removeChild(x); });
  var t = el("div", "toast", txt);
  t.setAttribute("role", "status");
  document.body.appendChild(t);
  placerToast(t);   /* Sprint 7A — au-dessus de la barre d'une feuille ouverte */
  setTimeout(function(){ t.style.opacity = "0"; }, 1300);
  setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 1700);
}

/* Sprint 6A — correctif d'affichage (présent depuis la 5A) : sur les écrans
   qui ont une barre de validation fixe en bas (Bienvenue, Revenus, Rubriques,
   Répartition, Nouveau cycle), le bas du contenu passait sous la barre et
   ne pouvait plus être atteint. La marge du bas suit désormais la hauteur
   réelle de la barre, même quand elle change (bannière de déficit…). */
var observateurBarre = null;
function ajusterMargeBasse(){
  var ec = document.getElementById("ecran");
  var st = document.querySelector("#barre .sticky");
  if(observateurBarre){ try{ observateurBarre.disconnect(); }catch(e){} observateurBarre = null; }
  if(!st){ ec.style.paddingBottom = ""; return; }
  function appliquer(){ ec.style.paddingBottom = (st.offsetHeight + 20) + "px"; }
  appliquer();
  if(window.ResizeObserver){
    try{ observateurBarre = new ResizeObserver(appliquer); observateurBarre.observe(st); }catch(e){}
  }
}

/* ==============================================================
   ÉCRAN 1 — Jour de salaire + revenus
   ============================================================== */
function vueRevenus(ec, ba){
  /* Sprint 6D — montants déjà présents à l'ouverture : seuls les revenus ajoutés ou saisis ici déclenchent la proposition */
  var avantRev = {};
  S.revenus.forEach(function(r){ avantRev[r.id] = Number(r.montant) || 0; });
  ec.appendChild(el("h1", null, S.onboarded ? "Vos revenus" : "Bienvenue sur MonDjai"));
  ec.appendChild(el("p", "sub", S.onboarded
    ? "Modifiez le jour de paie ou vos revenus du mois."
    : "Deux choses pour commencer : quand vous êtes payé, et combien vous recevez."));

  /* --- jour de salaire --- */
  ec.appendChild(el("h2", null, "Jour de réception du salaire"));
  var grille = el("div", "jours");
  for(var j = 1; j <= 31; j++){
    (function(jour){
      var b = el("button", "jour", String(jour));
      b.type = "button";
      b.setAttribute("aria-pressed", S.jourSalaire === jour ? "true" : "false");
      b.addEventListener("click", function(){
        S.jourSalaire = jour; sauver();
        grille.querySelectorAll(".jour").forEach(function(x){ x.setAttribute("aria-pressed","false"); });
        bDernier.setAttribute("aria-pressed","false");
        b.setAttribute("aria-pressed","true");
        majSuite();
      });
      grille.appendChild(b);
    })(j);
  }
  ec.appendChild(grille);

  var bDernier = el("button", "btn jour-dernier", "Dernier jour du mois");
  bDernier.type = "button";
  bDernier.setAttribute("aria-pressed", S.jourSalaire === "dernier" ? "true" : "false");
  bDernier.addEventListener("click", function(){
    S.jourSalaire = "dernier"; sauver();
    grille.querySelectorAll(".jour").forEach(function(x){ x.setAttribute("aria-pressed","false"); });
    bDernier.setAttribute("aria-pressed","true");
    majSuite();
  });
  ec.appendChild(bDernier);

  /* --- revenus --- */
  ec.appendChild(el("h2", null, "Revenus du mois"));
  var liste = el("div");
  ec.appendChild(liste);

  function dessinerLignes(){
    liste.innerHTML = "";
    S.revenus.forEach(function(rev, idx){
      var l = el("div", "ligne");
      var lib = document.createElement("input");
      lib.type = "text"; lib.className = "lib"; lib.value = rev.libelle;
      lib.placeholder = "Nom du revenu";
      lib.setAttribute("aria-label", "Nom du revenu");
      lib.addEventListener("input", function(){ rev.libelle = lib.value; sauver(); });
      l.appendChild(lib);
      l.appendChild(champMontant(rev.montant, function(v){ rev.montant = v; synchroniserLigne(rev); sauver(); majTotal(); }));   /* Sprint 7C */
      if(idx > 0){
        var d = el("button", "del", "×");
        d.type = "button"; d.title = "Retirer ce revenu";
        d.setAttribute("aria-label", "Retirer " + (rev.libelle || "ce revenu"));
        d.addEventListener("click", function(){
          var msgSup = lienSupprime(rev.id);   /* Sprint 7C */
          S.revenus = S.revenus.filter(function(x){ return x.id !== rev.id; });
          sauver(); dessinerLignes(); majTotal();
          if(msgSup) toast(msgSup);
        });
        l.appendChild(d);
      }
      liste.appendChild(l);
      /* Sprint 6A — nature du revenu, un tap ; l'ajustement de caisse garde la sienne */
      if(estAjustement(rev)) liste.appendChild(pastilleAjustementRevenu());
      /* Sprint 7C — remboursement d'un prêt donné : pastille grise fixe (et le prêt relié) */
      else if(natureDe(rev) === NATURE_REMBOURSEMENT) liste.appendChild(pastilleRemboursementRevenu(rev));
      else liste.appendChild(pastillesNature(rev, function(){
        var msgN = lienNatureChangee(rev);   /* Sprint 7C — dette dont l'emprunt change de nature */
        sauver(); majTotal();
        if(msgN) toast(msgN);
      }));
      /* Sprint 5B — date propre à ce revenu, jamais celle du salaire */
      if(idx > 0){
        var fd = el("div", "champ-date");
        fd.appendChild(el("span", "tiny muted", "Reçu le"));
        var id_ = document.createElement("input");
        id_.type = "date"; id_.className = "input-date";
        id_.value = rev.date || "";
        id_.setAttribute("aria-label", "Date de réception de " + (rev.libelle || "ce revenu"));
        id_.addEventListener("change", function(){
          rev.date = id_.value || null;
          /* Sprint 7C — ligne reliée : jamais dans le futur ; le prêt suit la date */
          if(rev.pret && rev.date && rev.date > aujourdhui()){ rev.date = aujourdhui(); id_.value = rev.date; }
          synchroniserLigne(rev);
          sauver();
        });
        fd.appendChild(id_);
        liste.appendChild(fd);
      }
    });
  }
  dessinerLignes();

  var bAjout = el("button", "btn btn-ghost", "+ Ajouter un revenu");
  bAjout.type = "button";
  var menu = el("div", "menu");
  menu.hidden = true;
  TYPES_REVENU.filter(typeAuMenu).forEach(function(t){   /* Sprint 7C : sans « Remboursement d'un prêt donné » */
    var b = el("button", null, t.lab);
    b.type = "button";
    b.addEventListener("click", function(){
      /* Sprint 6A — nature par défaut selon le type, toujours modifiable ;
         Sprint 7A — le type choisi est noté (revenus[].type) */
      S.revenus.push({id: uid(), libelle: libelleDuType(t), montant: 0, date: aujourdhui(), nature: t.nature, type: t.cle});
      regler("dernierTypeRevenu", t.cle);
      menu.hidden = true; dessinerLignes(); majTotal();
      var champs = liste.querySelectorAll(".lib");
      if(!libelleDuType(t) && champs.length) champs[champs.length-1].focus();
    });
    menu.appendChild(b);
  });
  bAjout.addEventListener("click", function(){ menu.hidden = !menu.hidden; });
  ec.appendChild(bAjout);
  ec.appendChild(menu);

  var tot = el("div", "total-ligne");
  tot.appendChild(el("span", "muted small", "Total des revenus"));
  var totVal = el("span", "big");
  tot.appendChild(totVal);
  ec.appendChild(tot);
  /* Sprint 6A — « dont régulier · exceptionnel · emprunt » */
  var dontN = el("div", "dont");
  ec.appendChild(dontN);

  /* --- reprendre une sauvegarde, au tout premier lancement --- */
  if(!S.onboarded){
    ec.appendChild(el("h2", null, "Vous avez déjà utilisé MonDjai ?"));
    var bRes = el("button", "btn", "Restaurer une sauvegarde");
    bRes.type = "button";
    bRes.addEventListener("click", restaurerDonnees);
    ec.appendChild(bRes);
    var aideRes = el("p", "tiny muted", "Reprenez votre fichier « mondjai-sauvegarde-….json » : tout revient comme avant.");
    aideRes.style.margin = "8px 0 0";
    ec.appendChild(aideRes);
  }

  /* --- barre --- */
  var bar = el("div", "sticky"), inn = el("div", "sticky-in");
  var suite = el("button", "btn btn-primary", S.onboarded ? "Enregistrer" : "Continuer");
  suite.type = "button";
  suite.addEventListener("click", function(){
    sauver();
    if(S.onboarded){
      S.revenus.forEach(function(r){ if(!(avantRev[r.id] > 0)) enfilerPart(r); });   /* Sprint 6D */
    }

/* --- jauge segmentée (élément signature) --- */
function dessinerJauge(jauge){
  jauge.innerHTML = "";
  var tot = totalRevenus(), rep = totalReparti();
  var base = Math.max(tot, rep);
  if(base <= 0){ jauge.appendChild(el("div", "seg seg-vide")); return; }
  actives().forEach(function(r){
    var m = Number(r.montant) || 0;
    if(m <= 0) return;
    var s = el("div", "seg");
    s.style.width = (m / base * 100) + "%";
    s.style.background = rep > tot ? "var(--red)" : teinte(r.couleur);
    jauge.appendChild(s);
  });
  if(rep < tot){
    var v = el("div", "seg seg-vide");
    v.style.flex = "none";
    v.style.width = ((tot - rep) / base * 100) + "%";
    jauge.appendChild(v);
  }
}

   1) bouton « + » flottant  2) grille des rubriques
   3) montant (+ libellé facultatif + date) → validation
   ============================================================== */
var feuille = null; /* feuille plein écran ouverte, ou null */

function boutonPlus(parent, rubriquePrechoisie){
  var f = el("button", "fab", "+");
  f.type = "button";

function fermerFeuille(viaRetour){
  if(!feuille) return;
  if(feuille.parentNode) feuille.parentNode.removeChild(feuille);
  feuille = null;
  document.body.classList.remove("sous-feuille");   /* Sprint 7D */
  document.body.style.overflow = "";
  if(!viaRetour){
    /* Sprint 7A — l'entrée d'historique de la feuille est rendue au navigateur
       un instant plus tard : si un écran ou une autre feuille s'ouvre entre-temps
       (« Plutôt ajouter un revenu », « Clôturer et démarrer », mise de côté…),
       il la reprend (replaceState) au lieu d'être aussitôt défait par history.back(). */
    entreeFeuilleLibre = true;
    setTimeout(function(){
      if(!entreeFeuilleLibre) return;
      entreeFeuilleLibre = false;
      try{ history.back(); }catch(e){}
    }, 0);
  }
}
var entreeFeuilleLibre = false;
function poserEntree(etat){
  try{
    if(entreeFeuilleLibre){ entreeFeuilleLibre = false; history.replaceState(etat, ""); }
    else history.pushState(etat, "");
  }catch(e){}
}
function remplacerEntree(etat){
  entreeFeuilleLibre = false;
  try{ history.replaceState(etat, ""); }catch(e){}
}
/* Sprint 5A — bouton retour physique (Android) : ferme la feuille de
   saisie si elle est ouverte, sinon revient à l'écran précédent. */
window.addEventListener("popstate", function(e){
  if(feuille){ fermerFeuille(true); return; }
  var st = e.state || {};
  var v = st.mdVue || (S.onboarded ? "dashboard" : "revenus");
  if(st.mdEtat){
    /* Sprint 7A — sens Dépenses | Revenus ; on ne redessine que si quelque chose change */
    var s2 = st.mdEtat.sens === "revenus" ? "revenus" : "depenses", m2 = st.mdEtat.mode || "jour", j2 = st.mdEtat.jour || null;
    var chg = vue !== "etat" || etatUI.sens !== s2 || etatUI.mode !== m2 || etatUI.jour !== j2;
    etatUI.sens = s2; etatUI.mode = m2; etatUI.jour = j2; vue = "etat";
    if(chg) render();
    return;
  }
  if(st.mdHab){
    var chgH = vue !== "habitudes" || habUI.mode !== st.mdHab.mode || habUI.jour !== st.mdHab.jour;
    habUI.mode = st.mdHab.mode; habUI.jour = st.mdHab.jour; vue = "habitudes";
    if(chgH) render();
    return;
  }
  if(v !== vue){ vue = v; render(); }
});
document.addEventListener("keydown", function(e){
  if(e.key === "Escape" && feuille) fermerFeuille(false);
});

function ouvrirDepense(opts){
  opts = opts || {};
  var edition = opts.edit || null;
  var editionPrevision = edition ? !!opts.prevision : false;
  var etat = {
    rubrique: edition ? edition.rubrique : (opts.rubrique || null),
    montant:  edition ? (Number(edition.montant)||0) : 0,
    libelle:  edition ? (edition.libelle || "") : "",
    date:     edition ? edition.date : aujourdhui(),
    etiquette: edition ? (edition.etiquette || "") : "",   /* Sprint 6B */
    pour:      edition ? (edition.pour || "") : ""         /* Sprint 6B */
  };
  /* Sprint 7C — prêt relié à la ligne modifiée (origine d'un prêt donné, ou remboursement
     d'une dette) ; « Remboursement prévu le » (Prêts donnés) et « Quelle dette ? » (Mensualités) */
  var pretLie = (edition && !editionPrevision) ? pretParId(edition.pret) : null;
  var avantEdition = edition ? {rubrique: edition.rubrique, pour: edition.pour || ""} : null;
  etat.echeance = (pretLie && pretLie.origine === edition.id) ? (pretLie.echeance || "") : "";
  etat.dette = (pretLie && pretLie.sens === "dette") ? pretLie.id : "";

  var sh = el("div", "sheet");
  sh.setAttribute("role", "dialog");
  sh.setAttribute("aria-modal", "true");

  var top = el("div", "sheet-top");
  var topIn = el("div", "sheet-top-in");
  var bRetour = el("button", "icon-btn", "‹");
  bRetour.type = "button"; bRetour.setAttribute("aria-label", "Retour aux rubriques");
  var titre = el("div", "sheet-titre", edition ? "Modifier la dépense" : "Nouvelle dépense");
  var bFermer = el("button", "icon-btn", "×");
  bFermer.type = "button"; bFermer.setAttribute("aria-label", "Fermer");
  bFermer.addEventListener("click", function(){ fermerFeuille(false); });
  bRetour.addEventListener("click", function(){ etat.rubrique = null; dessiner(); });
  topIn.appendChild(bRetour); topIn.appendChild(titre); topIn.appendChild(bFermer);
  top.appendChild(topIn);
  sh.appendChild(top);

  var body = el("div", "sheet-body");
  sh.appendChild(body);

  document.body.appendChild(sh);
  document.body.style.overflow = "hidden";
  feuille = sh;
  document.body.classList.add("sous-feuille");   /* Sprint 7D */
  poserEntree({mdFeuille:1});   /* Sprint 7A */

  function dessiner(){
    body.innerHTML = "";
    /* Sprint 7C — correctif : la barre de l'étape montant ne reste pas sur la grille des rubriques */
    Array.prototype.slice.call(sh.querySelectorAll(":scope > .sticky")).forEach(function(x){ x.parentNode.removeChild(x); });
    bRetour.hidden = (etat.rubrique === null);
    if(etat.rubrique === null) etapeGrille(); else etapeMontant();
  }

  /* ---- Tap 2 : la grille des rubriques ---- */
  function etapeGrille(){
    var act = actives();
    titre.textContent = edition ? "Modifier la ligne" : "Nouvelle saisie";
    /* Sprint 6B — raccourcis ⚡ : tap 2 = la pastille, tap 3 = Enregistrer */
    var mods = edition ? [] : (S.modeles || []).filter(function(m){
      var rm = rubriqueParId(m.rubrique); return rm && rm.active;
    });
    if(mods.length){
      var zm = el("div", "chips raccourcis");
      zm.setAttribute("role", "group");
      zm.setAttribute("aria-label", "Raccourcis de saisie");
      mods.forEach(function(m){
        var c = el("button", "chip chip-modele", "⚡ " + libelleModele(m));
        c.type = "button";
        c.addEventListener("click", function(){
          etat.rubrique = m.rubrique; etat.montant = Number(m.montant) || 0;
          etat.libelle = m.libelle || ""; etat.etiquette = m.etiquette || ""; etat.pour = m.pour || "";
          etat.date = aujourdhui();
          dessiner();
        });
        zm.appendChild(c);
      });
      body.appendChild(zm);
    }
    body.appendChild(el("p", "sub", act.length ? "Dans quelle enveloppe ?" : "Aucune enveloppe active pour l'instant."));
    if(!act.length){
      var b = el("button", "btn", "Choisir mes rubriques");
      b.type = "button";
      b.addEventListener("click", function(){ fermerFeuille(false); aller("rubriques"); });
      body.appendChild(b);
      return;
    }
    var g = el("div", "grille-rub");
    act.forEach(function(r){
      var t = el("button", "tuile");
      t.type = "button";

  /* ---- Tap 3 : montant, libellé facultatif, date ---- */
  function etapeMontant(){
    var r = rubriqueParId(etat.rubrique);
    if(!r){ etat.rubrique = null; dessiner(); return; }
    var ep = estEpargne(r);
    titre.textContent = edition
      ? (editionPrevision ? "Modifier la prévision" : (ep ? "Modifier le versement" : "Modifier la dépense"))
      : (ep ? "Mettre de côté" : "Nouvelle dépense");

    /* rappel de l'enveloppe choisie (retap = changer) */
    var choisie = el("button", "rub-choisie");
    choisie.type = "button";
    var ic = el("span", "ico", r.icone);
    ic.style.background = "var(--ico-bg)";
    ic.style.boxShadow = "inset 0 0 0 1px " + teinte(r.couleur) + "55";
    choisie.appendChild(ic);
    choisie.appendChild(el("span", "nom", r.nom));
    choisie.appendChild(el("span", "chg", "Changer"));
    choisie.addEventListener("click", function(){ etat.rubrique = null; dessiner(); });
    body.appendChild(choisie);

    /* montant */
    var im = document.createElement("input");
    im.type = "text"; im.inputMode = "numeric";
    im.className = "montant-xl";
    im.value = etat.montant ? fmt(etat.montant) : "";
    im.placeholder = "0";
    im.setAttribute("aria-label", "Montant de la dépense en francs CFA");
    im.addEventListener("focus", function(){
      setTimeout(function(){ try{ im.scrollIntoView({block:"center", behavior:"smooth"}); }catch(e){} }, 250);
    });
    im.addEventListener("input", function(){
      var v = chiffres(im.value);
      im.value = v ? fmt(v) : "";
      etat.montant = v;
      majInfo();
    });
    body.appendChild(im);
    body.appendChild(el("div", "devise", "FRANCS CFA"));

    /* Sprint 6B — étiquette : une par dépense, facultative, un tap */
    var zoneEt = el("div", "etiqs");
    body.appendChild(zoneEt);
    function dessinerEtiquettes(){
      zoneEt.innerHTML = "";
      var prop = etiquettesProposees(r, etat.etiquette);
      var rangee = el("div", "chips");
      rangee.setAttribute("role", "group");
      rangee.setAttribute("aria-label", "Étiquette");
      prop.forEach(function(e){
        var c = el("button", "chip chip-s", e);
        c.type = "button";
        c.setAttribute("aria-pressed", cleTexte(e) === cleTexte(etat.etiquette) ? "true" : "false");
        c.addEventListener("click", function(){
          etat.etiquette = cleTexte(e) === cleTexte(etat.etiquette) ? "" : e;
          dessinerEtiquettes();
        });
        rangee.appendChild(c);
      });
      var autre = el("div", "etiq-autre");
      autre.hidden = true;
      var iA = document.createElement("input");
      iA.type = "text"; iA.className = "input"; iA.maxLength = ETIQUETTE_MAX;
      iA.placeholder = "Nouvelle étiquette";
      iA.setAttribute("aria-label", "Nouvelle étiquette");
      var bA = el("button", "btn btn-line", "OK");
      bA.type = "button";
      function validerAutre(){
        var v = memoriserEtiquette(r, iA.value);
        if(v) etat.etiquette = v;
        dessinerEtiquettes();
      }
      bA.addEventListener("click", validerAutre);
      iA.addEventListener("keydown", function(ev){ if(ev.key === "Enter"){ ev.preventDefault(); validerAutre(); } });
      autre.appendChild(iA); autre.appendChild(bA);
      var cA = el("button", "chip chip-s chip-autre", prop.length ? "+ Autre" : "+ Étiquette");
      cA.type = "button";
      cA.addEventListener("click", function(){ autre.hidden = false; try{ iA.focus(); }catch(e){} });
      rangee.appendChild(cA);
      zoneEt.appendChild(rangee);
      zoneEt.appendChild(autre);
    }
    dessinerEtiquettes();

    /* Sprint 7C — Mensualités (dettes) : « Quelle dette ? », facultatif, sur une ligne qui
       défile ; sans y toucher, rien ne change (3 taps). Masqué pour une date future. */
    var zoneDette = el("div", "field quelle-dette");
    zoneDette.setAttribute("data-test", "quelle-dette");
    body.appendChild(zoneDette);
    function dettesProposees(){
      if(r.id !== ID_MENSUALITES || editionPrevision) return [];
      return trierPrets((S.prets || []).filter(function(p){ return p.sens === "dette" && (restePret(p) > 0 || p.id === etat.dette); }));
    }
    function dessinerDettes(){
      zoneDette.innerHTML = "";
      var l = dettesProposees();
      zoneDette.hidden = !l.length || (etat.date || aujourdhui()) > aujourdhui();
      if(!l.length) return;
      zoneDette.appendChild(el("label", null, "Quelle dette ? (facultatif)"));
      var rg = el("div", "chips chips-ligne");
      rg.setAttribute("role", "group");
      rg.setAttribute("aria-label", "Quelle dette ?");
      l.forEach(function(p){
        var c = el("button", "chip chip-s", nomPret(p) + " · reste " + fmtF(restePret(p)));
        c.type = "button";
        c.setAttribute("data-pret", p.id);
        c.setAttribute("aria-pressed", etat.dette === p.id ? "true" : "false");
        c.addEventListener("click", function(){
          etat.dette = etat.dette === p.id ? "" : p.id;
          /* montant encore vide : la mensualité est proposée, modifiable */
          if(etat.dette && !(Number(etat.montant) > 0) && p.mensualite > 0){
            etat.montant = Math.min(p.mensualite, restePret(p) || p.mensualite);
            im.value = fmt(etat.montant);
          }
          dessinerDettes();
          majInfo();
        });
        rg.appendChild(c);
      });
      zoneDette.appendChild(rg);
    }
    dessinerDettes();

    /* information sur l'enveloppe — on informe, on ne bloque jamais */
    var info = el("div", "info-env");
    body.appendChild(info);

    /* libellé facultatif */
    var fL = el("div", "field");
    fL.appendChild(el("label", null, "Libellé (facultatif)"));
    var iL = document.createElement("input");
    iL.type = "text"; iL.className = "input"; iL.maxLength = 60;
    iL.placeholder = ep ? "Ex. : tontine, réserve, projet…" : "Ex. : gbaka, marché, taxi…";
    iL.value = etat.libelle;
    iL.addEventListener("input", function(){ etat.libelle = iL.value; });
    fL.appendChild(iL);
    /* Sprint 6B — libellés récents de cette rubrique : un tap remplit le champ */
    var recents = libellesRecents(r.id);
    if(recents.length){
      var rc = el("div", "chips chips-sous chips-ligne");   /* Sprint 7B — une ligne qui défile */
      recents.forEach(function(lb){
        var c = el("button", "chip chip-s", lb);
        c.type = "button";
        c.addEventListener("click", function(){ iL.value = lb; etat.libelle = lb; });
        rc.appendChild(c);
      });
      fL.appendChild(rc);
    }
    body.appendChild(fL);

    /* Sprint 6B — « Pour qui ? » (facultatif, désactivable dans Réglages › Saisie).
       Masqué, il ne touche pas à la valeur déjà enregistrée sur la ligne. */
    if(reglage("pourQui")){
      var fP = el("div", "field");
      fP.appendChild(el("label", null, "Pour qui ? (facultatif)"));
      var iP = document.createElement("input");
      iP.type = "text"; iP.className = "input"; iP.maxLength = POUR_QUI_MAX;
      iP.placeholder = "Ex. : un proche, un collègue…";
      iP.setAttribute("aria-label", "Pour qui ?");
      iP.value = etat.pour;
      iP.addEventListener("input", function(){ etat.pour = iP.value; });
      fP.appendChild(iP);
      var pers = personnesRecentes();
      if(pers.length){
        var rp = el("div", "chips chips-sous chips-ligne");   /* Sprint 7B */
        pers.forEach(function(p){
          var c = el("button", "chip chip-s", p);
          c.type = "button";
          c.addEventListener("click", function(){ iP.value = p; etat.pour = p; });
          rp.appendChild(c);
        });
        fP.appendChild(rp);
      }
      body.appendChild(fP);
    }

    /* date : aujourd'hui par défaut, modifiable — Sprint 5B : une date
       future ne compte pas dans le solde tant qu'elle n'est pas validée */
    var fD = el("div", "field");
    fD.appendChild(el("label", null, "Date"));
    var chips = el("div", "chips");
    chips.style.marginBottom = "8px";
    var hier = new Date(); hier.setDate(hier.getDate() - 1);
    var raccourcis = [{lab:"Aujourd'hui", val: aujourdhui()}, {lab:"Hier", val: iso(hier)}];
    var iD = document.createElement("input");
    iD.type = "date"; iD.className = "input"; iD.value = etat.date;
    iD.setAttribute("aria-label", "Date de la dépense");
    var indicPrevision = el("p", "tiny muted");
    indicPrevision.style.margin = "8px 0 0";
    raccourcis.forEach(function(rc){
      var c = el("button", "chip", rc.lab);
      c.type = "button";
      c.setAttribute("aria-pressed", etat.date === rc.val ? "true" : "false");
      c.addEventListener("click", function(){
        etat.date = rc.val; iD.value = rc.val;
        chips.querySelectorAll(".chip").forEach(function(x){ x.setAttribute("aria-pressed","false"); });
        c.setAttribute("aria-pressed","true");
        majInfo();
      });
      chips.appendChild(c);
    });
    if(pretLie) iD.max = aujourdhui();   /* Sprint 7C — ligne reliée : jamais dans le futur */
    iD.addEventListener("change", function(){
      etat.date = iD.value || aujourdhui();
      if(pretLie && etat.date > aujourdhui()){ etat.date = aujourdhui(); iD.value = etat.date; }
      chips.querySelectorAll(".chip").forEach(function(x, i){
        x.setAttribute("aria-pressed", etat.date === raccourcis[i].val ? "true" : "false");
      });
      majInfo();
    });
    fD.appendChild(chips);
    fD.appendChild(iD);
    fD.appendChild(indicPrevision);
    body.appendChild(fD);

    /* Sprint 7C — Prêts donnés : « Remboursement prévu le » (facultatif), sous la date.
       Une prévision ne crée rien : le champ attend que la date soit arrivée. */
    var fE = null;
    if(r.id === ID_PRETS_DONNES && (!edition || editionPrevision || (pretLie && pretLie.origine === edition.id))){
      fE = el("div", "field");
      fE.setAttribute("data-test", "champ-prevu");
      var lE = el("label", null, "Remboursement prévu le (facultatif)");
      lE.setAttribute("for", "dep-prevu");
      fE.appendChild(lE);
      var iE = document.createElement("input");
      iE.type = "date"; iE.className = "input"; iE.id = "dep-prevu";
      iE.value = etat.echeance || "";
      iE.addEventListener("change", function(){ etat.echeance = iE.value || ""; });
      fE.appendChild(iE);
      body.appendChild(fE);
    }

    /* suppression si l'on modifie une dépense existante */
    if(edition){
      var bSup = el("button", "btn btn-danger",
        editionPrevision ? "Supprimer cette prévision" : (ep ? "Supprimer ce versement" : "Supprimer cette dépense"));
      bSup.type = "button";
      bSup.style.marginTop = "18px";
      bSup.addEventListener("click", function(){
        if(confirm("Supprimer cette ligne de " + fmtF(edition.montant) + " ?")){
          var msgSup = supprimerDepense(edition.id, editionPrevision);
          fermerFeuille(false);
          render();
          toast(msgSup || (editionPrevision ? "Prévision supprimée" : "Dépense supprimée"));
        }
      });
      body.appendChild(bSup);
    }

    /* barre de validation */
    var bar = el("div", "sticky"), inn = el("div", "sticky-in");
    var bOk = el("button", "btn btn-primary", "");
    bOk.type = "button";
    bOk.addEventListener("click", enregistrer);
    inn.appendChild(bOk);
    bar.appendChild(inn);
    sh.appendChild(bar);

    im.addEventListener("keydown", function(e){
      if(e.key === "Enter" && etat.montant > 0){ e.preventDefault(); enregistrer(); }
    });

    function majInfo(){
      var futur = (etat.date || aujourdhui()) > aujourdhui();
      /* Sprint 7C — pas de ligne reliée dans le futur */
      zoneDette.hidden = futur || !dettesProposees().length;
      if(fE) fE.hidden = futur;

      /* Sprint 5B — une dépense datée dans le futur devient une prévision :
         elle ne compte pas dans le solde tant qu'elle n'a pas été validée. */
      if(futur){
        indicPrevision.textContent = "📌 Cette date n'est pas encore arrivée : ce sera une prévision, elle ne comptera dans votre solde qu'une fois validée le jour venu.";
        bOk.textContent = edition ? "Enregistrer la prévision" : "Prévoir cette dépense";
      }else if(editionPrevision){
        indicPrevision.textContent = "✓ Cette date est passée ou c'est aujourd'hui : en enregistrant, cette prévision devient une dépense réelle et comptera tout de suite dans votre solde.";
        bOk.textContent = "Valider la dépense";
      }else{
        indicPrevision.textContent = "";
        bOk.textContent = edition ? "Enregistrer les modifications" : (ep ? "Mettre de côté" : "Enregistrer la dépense");
      }

      var affecte = Number(r.montant) || 0;
      var dejaSansMoi = depenseRub(r.id) - (edition && !editionPrevision ? (Number(edition.montant)||0) : 0);
      var apres = dejaSansMoi + (futur ? 0 : (Number(etat.montant)||0));
      var restant = affecte - apres;
      var etatC = etatDe(apres, affecte, ep);
      info.className = "info-env " + (affecte <= 0 && !ep ? "" :
        etatC === "rouge" ? "rouge" : etatC === "orange" ? "orange" :
        etatC === "attente" ? "attente" : "vert");
      if(futur){
        info.className = "info-env";
        info.textContent = "Une prévision n'affecte pas encore « " + r.nom + " ».";
      }else if(ep){
        if(affecte <= 0){
          info.textContent = "Aucun objectif fixé ici : tout ce que vous mettez de côté est du gagné.";
        }else if(restant > 0){
          info.textContent = "Après ce versement, il resterait " + fmtF(restant) + " à mettre de côté dans « " + r.nom + " ».";
        }else if(restant === 0){
          info.textContent = "Avec ce versement, l'objectif de « " + r.nom + " » est atteint. Bravo !";
        }else{
          info.textContent = "Vous dépasseriez l'objectif de " + fmtF(-restant) + ". Tant mieux : c'est de l'épargne en plus.";
        }
      }else if(affecte <= 0){
        info.textContent = "Aucun montant n'est affecté à cette enveloppe pour l'instant.";
      }else if(restant >= 0){
        info.textContent = "Après cette dépense, il resterait " + fmtF(restant) + " dans « " + r.nom + " ».";
      }else{
        info.textContent = "Cette dépense dépasserait l'enveloppe de " + fmtF(-restant) + ". C'est possible, à vous de voir.";
      }
      bOk.disabled = !(Number(etat.montant) > 0);
    }
    majInfo();
    setTimeout(function(){ try{ im.focus(); }catch(e){} }, 60);
  }

  function enregistrer(){
    if(!(Number(etat.montant) > 0) || !rubriqueParId(etat.rubrique)) return;   /* 7C : jamais de dépense sans rubrique */
    var futur = (etat.date || aujourdhui()) > aujourdhui();
    var champs = {
      rubrique: etat.rubrique,
      montant: Number(etat.montant) || 0,
      libelle: (etat.libelle || "").trim(),
      date: etat.date || aujourdhui()
    };
    var messageFinal, nouvelle = null, creee = null;
    var etq = propre(etat.etiquette, ETIQUETTE_MAX), pourQui = propre(etat.pour, POUR_QUI_MAX);   /* Sprint 6B */
    if(edition){
      Object.keys(champs).forEach(function(k){ edition[k] = champs[k]; });
      if(etq) edition.etiquette = etq; else delete edition.etiquette;
      if(pourQui) edition.pour = pourQui; else delete edition.pour;
      if(editionPrevision && !futur){
        /* la prévision est validée : elle devient une dépense réelle */
        S.previsions = S.previsions.filter(function(x){ return x.id !== edition.id; });
        S.depenses.push(edition);
        messageFinal = "Dépense validée ✓";
        /* Sprint 7C — la validation d'une prévision dans « Prêts donnés » crée le prêt */
        if(lierNouvelleDepense(edition, {echeance: etat.echeance}) === "pret") messageFinal = "Prêt noté ✓";
      }else if(!editionPrevision && futur){
        /* la dépense est repoussée dans le futur : elle devient une prévision */
        S.depenses = S.depenses.filter(function(x){ return x.id !== edition.id; });
        S.previsions.push(edition);
        messageFinal = "Déplacée en prévision pour le " + dateLisible(edition.date);
      }else{
        messageFinal = "Modification enregistrée";
        /* Sprint 7C — cohérence des lignes reliées (montant, date, rubrique, dette choisie) */
        var msgLien = majLienDepense(edition, avantEdition, {echeance: etat.echeance, dette: etat.dette});
        if(msgLien) messageFinal = msgLien;
      }
    }else{
      var obj = champs;
      if(etq) obj.etiquette = etq;
      if(pourQui) obj.pour = pourQui;
      obj.id = uid(); obj.cree = Date.now();
      creee = {id: obj.id, prevision: futur};   /* Sprint 7A — annulable */
      if(futur){
        S.previsions.push(obj);
        messageFinal = "Dépense prévue pour le " + dateLisible(obj.date) + " ✓";
      }else{
        S.depenses.push(obj);
        nouvelle = obj;
        var rFin = rubriqueParId(obj.rubrique);
        messageFinal = estEpargne(rFin) ? "Mis de côté ✓ Bravo" : "Dépense enregistrée ✓";
        /* Sprint 7C — Prêts donnés : la dépense crée le prêt ; Mensualités : remboursement de la dette choisie */
        var lienCree = lierNouvelleDepense(obj, {echeance: etat.echeance, dette: etat.dette});
        if(lienCree === "pret") messageFinal = "Prêt noté ✓";
        else if(lienCree === "remb") messageFinal = "Remboursement noté ✓";
      }
    }
    sauver();
    fermerFeuille(false);
    render();
    /* Sprint 7A — une création (dépense ou prévision) s'annule pendant ANNULER_DELAI_MS */
    var proposition = null;
    if(creee){
      toastAnnuler(messageFinal, function(){ annulerDepenseCreee(creee.id, creee.prevision, proposition); });
    }else{
      toast(messageFinal);
    }
    /* Sprint 6B — 3e saisie identique dans le cycle : « Garder en raccourci ⚡ ? » */
    if(nouvelle){
      var sig = candidatModele(nouvelle);
      if(sig){
        proposition = {avant: reglage("modelesProposes")};
        proposerModele(nouvelle, sig);
      }
    }
  }

  dessiner();
}

/* Sprint 5B — valide une prévision échue : elle devient une dépense réelle
   avec sa date prévue, sans repasser par la feuille de saisie. */
function validerPrevision(id){
  var it = null;
  S.previsions.forEach(function(d){ if(d.id === id) it = d; });
  if(!it) return;
  S.previsions = S.previsions.filter(function(d){ return d.id !== id; });
  S.depenses.push(it);
  var lienV = lierNouvelleDepense(it, {});   /* Sprint 7C — Prêts donnés : la validation crée le prêt */
  sauver();
  render();
  toast(lienV === "pret" ? "Prêt noté ✓" : "Dépense validée ✓");
}

function supprimerDepense(id, estPrevision){
  var msg = "";
  if(estPrevision){
    S.previsions = S.previsions.filter(function(d){ return d.id !== id; });
  }else{
    msg = lienSupprime(id);   /* Sprint 7C — prêt retiré, ou gardé (« Le prêt reste suivi ») ; remboursement retiré */
    S.depenses = S.depenses.filter(function(d){ return d.id !== id; });
  }
  sauver();
  return msg;
}

/* ==============================================================
   ÉCRAN 4 — Accueil (F5)
   Sprint 5A : allégé au strict essentiel. Le détail des enveloppes,
   le journal complet et l'épargne ont désormais leur propre onglet.
   ============================================================== */
function vueDashboard(ec, ba){
  /* Sprint 7A — Aujourd'hui en cases, dans l'ordre de lecture :
     Il vous reste → Revenus | Dépenses → Pour ce mois → Aujourd'hui | Ma petite caisse
     → cartes d'avis. Mêmes calculs qu'au 6D, seule la présentation change. */
  var tot = totalRevenus(), rep = totalReparti();
  var dep = totalDepense(), dispo = tot - dep;
  var jours = joursAvantPaie();
  var paie = prochainePaie();
  var reg = revenuRegulier();

  ec.appendChild(el("h1", "sr-only", "Aujourd'hui"));
  /* le bandeau (thème clair) descend jusqu'au milieu de la case « Il vous reste » */
  ec.appendChild(el("div", "band-ext"));

  /* --- AUJOURD'HUI · jj/mm/aaaa --- */
  var ld = el("div", "auj-date");
  ld.setAttribute("data-test", "auj-date");
  ld.appendChild(el("span", null, "AUJOURD'HUI · " + dateJJMMAAAA(aujourdhui())));
  var filet = el("i"); filet.setAttribute("aria-hidden", "true");
  ld.appendChild(filet);
  ec.appendChild(ld);

  /* --- 1. case principale « Il vous reste » --- */
  var cr = el("div", "card case-reste");
  cr.id = "case-reste";
  cr.setAttribute("data-test", "case-reste");
  cr.appendChild(el("div", "case-lab", "Il vous reste"));
  var grand = el("div", "big fit" + (dispo < 0 ? " c-rouge" : ""), fmtF(Math.max(dispo, 0)));
  grand.setAttribute("data-test", "reste-montant");
  cr.appendChild(grand);
  if(jours){
    var phrase = el("div", "small reste-ligne");
    phrase.setAttribute("data-test", "reste-ligne");
    if(dispo >= 0){
      /* segments insécables : la ligne passe à la ligne entre deux segments, jamais au milieu */
      segments(phrase, ["jusqu'au " + jourEtMois(paie), motJours(jours)]
        .concat(dispo > 0 ? ["≈ " + fmtF(Math.floor(dispo / jours)) + " / jour"] : []));
      cr.appendChild(phrase);
    }else{
      /* solde négatif : montant et phrase du 6D, inchangés */
      phrase.textContent = "Vous avez dépensé " + fmtF(-dispo) + " de plus que vos revenus, à " + motJours(jours) + " de la paie.";
      cr.appendChild(phrase);
      var quand = el("div", "tiny muted", "Prochaine paie : " + jourEtMois(paie) + ".");
      quand.style.marginTop = "2px";
      cr.appendChild(quand);
    }
  }
  var jg = jaugeRub(dep, tot);
  jg.style.marginTop = "10px";
  cr.appendChild(jg);
  carteRythme(cr);   /* Sprint 6D — « À ce rythme… » (information, masquable) */
  var bAj = el("button", "lien lien-ajuster", "⚖️ Ajuster mon solde");
  bAj.type = "button";
  bAj.setAttribute("data-test", "lien-ajuster");
  bAj.addEventListener("click", ouvrirAjustement);

function depensesDuJourSimple(j){ return S.depenses.filter(function(d){ return d.date === j; }); }

/* ==============================================================
   Sprint 5A — ÉCRAN « Enveloppes »
   Le détail complet, groupe par groupe, qui occupait tout l'accueil.
   L'épargne (groupe Épargne & Investissement) a son propre onglet,
   elle n'apparaît donc pas ici pour éviter le doublon.
   ============================================================== */
function vueEnveloppes(ec, ba){
  var tot = totalRevenus(), rep = totalReparti(), rst = tot - rep;

  ec.appendChild(el("h1", null, "Mes enveloppes"));   /* Sprint 7B ; Sprint 7D : l'onglet aussi */
  ec.appendChild(el("p", "sub", "Ce qui est affecté et ce qui a déjà été dépensé, groupe par groupe."));
  /* Sprint 7A — la carte « Mis de côté » n'est plus ici : case « Ma petite caisse » d'Aujourd'hui */

  var act = actives().filter(function(r){ return !estEpargne(r); });
  if(act.length === 0){
    var c0 = el("div", "card");
    c0.appendChild(el("div", "vide-msg", "Aucune rubrique active. Ouvrez « Réglages › Mes rubriques » pour en choisir."));
    ec.appendChild(c0);
  }else{
    groupesPresents(act).forEach(function(g){
      var membres = membresGroupe(act, g);
      if(!membres.length) return;
      var affG = 0, depG = 0;
      membres.forEach(function(r){
        affG += Number(r.montant) || 0;
        depG += depenseRub(r.id);
      });
      ec.appendChild(enteteGroupe(g, affG, depG, false));
      membres.slice().sort(function(a,b){ return (b.montant||0) - (a.montant||0); })
        .forEach(function(r){ ec.appendChild(carteEnveloppe(r, "enveloppes")); });
    });
  }

  /* --- enveloppes désactivées (hors épargne) qui portent encore des dépenses --- */
  var orphelines = S.rubriques.filter(function(r){ return !r.active && !estEpargne(r) && depenseRub(r.id) > 0; });
  if(orphelines.length){
    ec.appendChild(el("h2", null, "Rubriques désactivées"));
    orphelines.forEach(function(r){ ec.appendChild(carteEnveloppe(r, "enveloppes")); });
  }

  /* --- non affecté --- */
  ec.appendChild(el("h2", null, "Non affecté"));
  var card = el("div", "card");
  var l2 = el("div", "tb-ligne");
  var p2b = el("span", "pastille");
  p2b.style.background = "var(--muted)";
  l2.appendChild(p2b);
  l2.appendChild(el("span", "ico", "🗂️"));
  l2.appendChild(el("span", "nom", "Reste à répartir"));
  var m2 = el("div", "tb-mont", fmtF(Math.max(0, rst)));
  m2.appendChild(el("small", null, "sur " + fmtF(tot)));
  l2.appendChild(m2);
  card.appendChild(l2);
  ec.appendChild(card);

  var bRep = el("button", "btn", "Modifier la répartition");
  bRep.type = "button";
  bRep.style.marginTop = "10px";
  bRep.addEventListener("click", function(){ ouvrirVue("repartition", "enveloppes"); });
  ec.appendChild(bRep);

  boutonPlus(ba, null);
}

/* Sprint 6C — l'ancien écran « Journal » est devenu Mon état › Jour (voir etatJour). */
/* Sprint 6B — filtre de recherche (gardé en mémoire tant que l'application est ouverte) */
var filtreJournal = {texte: "", pour: "", pourNom: ""};
function correspondJournal(d){
  if(filtreJournal.pour && cleTexte(d.pour) !== filtreJournal.pour) return false;
  var q = cleTexte(filtreJournal.texte);
  if(!q) return true;
  var r = rubriqueParId(d.rubrique);
  return [d.libelle, d.etiquette, d.pour, r ? r.nom : ""].some(function(v){ return cleTexte(v).indexOf(q) >= 0; });
}

    ec.appendChild(el("h2", null, "Vos rubriques d'épargne"));
    membres.slice().sort(function(a,b){ return (b.montant||0) - (a.montant||0); })
      .forEach(function(r){ ec.appendChild(carteEnveloppe(r, "epargne")); });
  }

  /* --- rubriques d'épargne désactivées qui portent encore des versements --- */
  var orphEp = S.rubriques.filter(function(r){ return !r.active && estEpargne(r) && depenseRub(r.id) > 0; });
  if(orphEp.length){
    ec.appendChild(el("h2", null, "Rubriques désactivées"));
    orphEp.forEach(function(r){ ec.appendChild(carteEnveloppe(r, "epargne")); });
  }
