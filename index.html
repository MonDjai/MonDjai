/* Sprint 6C — texte de gauche sous une jauge : jamais de pourcentage au-delà de 100 %.
   Au-delà du budget : « +X F au-dessus » (dépensé − budget) et la barre reste pleine.
   Sans budget : « Sans enveloppe » (neutre). */
function texteUtilise(d, affecte, ep){
  if(affecte > 0){
    if(d > affecte) return "+" + fmtF(d - affecte) + " au-dessus";
    return pct(d / affecte * 100) + (ep ? " de l'objectif" : " utilisé");
  }
  return d > 0 ? (ep ? "mis de côté" : "Sans enveloppe") : "rien d'affecté";
}
/* --- carte d'une enveloppe avec sa jauge ---
   Sprint 4 : dans l'épargne, on « met de côté » et rien ne passe au rouge (F10).
   Sprint 5A : « origine » mémorise l'onglet d'où l'on vient, pour un bouton
   retour juste sur l'écran de détail. */
function carteEnveloppe(r, origine){
  var ep = estEpargne(r);
  var affecte = Number(r.montant) || 0;
  var d = depenseRub(r.id);
  /* Sprint 6A — « À classer » (ajustements de caisse) reste neutre : jamais de rouge */
  var neutre = estAClasser(r) && affecte <= 0;
  var etat = neutre ? "neutre" : etatDe(d, affecte, ep);
  var reste = affecte - d;
  /* Sprint 6A — budget suggéré pour une rubrique qui dépense sans enveloppe */
  var sug = ep ? null : suggestionBudget(r);
  var classeCarte = "env" + (etat === "rouge" ? " alerte" : "");

  var b = el("button", sug ? "env-in" : classeCarte);
  b.type = "button";
  b.setAttribute("aria-label", (ep ? "Voir les versements de " : "Voir les dépenses de ") + r.nom);

  var haut = el("div", "env-haut");
  var ic = el("span", "ico", r.icone);
  ic.style.background = "var(--ico-bg)";
  ic.style.boxShadow = "inset 0 0 0 1px " + teinte(r.couleur) + "55";
  haut.appendChild(ic);
  haut.appendChild(el("span", "nom", r.nom));
  if(!r.active) haut.appendChild(el("span", "tag", "désactivée"));
  var m = el("div", "env-mont", fmtF(d));
  m.appendChild(el("small", null, (ep ? "objectif " : "sur ") + fmtF(affecte)));
  haut.appendChild(m);
  haut.appendChild(el("span", "chev", "›"));
  b.appendChild(haut);

  b.appendChild(jaugeRub(d, affecte, ep, neutre ? "neutre" : null));

  var bas = el("div", "env-bas");
  var gauche = neutre ? "ajustements de caisse" : texteUtilise(d, affecte, ep);
  bas.appendChild(el("span", (!ep && affecte <= 0 && d > 0 && !neutre) ? "c-neutre" : classeEtat(etat), gauche));
  if(neutre){
    /* ce n'est pas un dépassement : rien de plus à dire */
  }else if(ep){
    bas.appendChild(el("span", classeEtat(etat), motEpargne(d, affecte)));
  }else if(reste >= 0 || affecte <= 0){
    if(affecte > 0) bas.appendChild(el("span", "muted", "Reste " + fmtF(reste)));
  }
  b.appendChild(bas);

  var rl = rappelLissage(r);
  if(rl && (r.periodicite || "mensuel") !== "mensuel"){
    var lr = el("div", "tiny muted", rl);
    lr.style.marginTop = "6px";
    b.appendChild(lr);
  }

  b.addEventListener("click", function(){ ouvrirRubrique(r.id, origine); });
  if(!sug) return b;
  var w = el("div", classeCarte);
  w.appendChild(b);
  w.appendChild(blocSuggestion(sug, function(m){
    fixerSuggestion(r, m);
    rafraichirSurPlace();
    toast("Enveloppe fixée à " + fmtF(m) + " ✓");
  }, function(){
    ignorerSuggestion(r.id);
    rafraichirSurPlace();
    toast("Suggestion masquée pour ce cycle");
  }));
  return w;
}

/* --- une ligne de dépense (modifiable / supprimable) --- */
function ligneDepense(d, avecRubrique, estPrevision){
  var r = rubriqueParId(d.rubrique);
  var ligne = el("div", "dep");

  var main = el("button", "dep-main");
  main.type = "button";
  main.setAttribute("aria-label", estPrevision ? "Modifier cette prévision" : "Modifier cette dépense");
  var ic = el("span", "ico", r ? r.icone : "💸");
  if(r){
    ic.style.background = "var(--ico-bg)";
    ic.style.boxShadow = "inset 0 0 0 1px " + teinte(r.couleur) + "55";
  }
  main.appendChild(ic);
  var txt = el("div", "d-txt");
  txt.appendChild(el("div", "d-lib", d.libelle || (r ? r.nom : "Dépense")));
  var sous = estPrevision ? "Prévue le " + dateLisible(d.date) : dateLisible(d.date);
  if(avecRubrique && r && d.libelle) sous += " · " + r.nom;
  if(d.etiquette) sous += " · " + d.etiquette;          /* Sprint 6B */
  if(d.pour) sous += " · pour " + d.pour;                /* Sprint 6B */
  var ligneDate = el("div", "d-date", sous);
  if(estAjustement(d)) ligneDate.appendChild(el("span", "pill-aj", "Ajustement"));   /* Sprint 6A */
  txt.appendChild(ligneDate);
  main.appendChild(txt);
  main.appendChild(el("div", "d-mont", fmtF(d.montant)));
  main.addEventListener("click", function(){ ouvrirDepense({edit: d, prevision: !!estPrevision}); });
  ligne.appendChild(main);

  /* Sprint 5B — prévision échue : validation en un tap, sans repasser
     par la feuille de saisie */
  if(estPrevision && d.date <= aujourdhui()){
    var bVal = el("button", "del", "✓");
    bVal.type = "button";
    bVal.title = "Valider maintenant";
    bVal.setAttribute("aria-label", "Valider cette prévision de " + fmt(d.montant) + " francs maintenant");
    bVal.style.color = "var(--green)";
    bVal.addEventListener("click", function(){ validerPrevision(d.id); });
    ligne.appendChild(bVal);
  }

  var sup = el("button", "del", "×");
  sup.type = "button";
  sup.title = "Supprimer";
  sup.setAttribute("aria-label", "Supprimer cette " + (estPrevision ? "prévision" : "dépense") + " de " + fmt(d.montant) + " francs");
  sup.addEventListener("click", function(){
    if(confirm("Supprimer cette ligne de " + fmtF(d.montant) + " ?")){
      supprimerDepense(d.id, !!estPrevision);
      render();
      toast(estPrevision ? "Prévision supprimée" : "Dépense supprimée");
    }
  });
  ligne.appendChild(sup);
  return ligne;
}

/* ==============================================================
   ÉCRAN 5 — Détail d'une rubrique et de ses dépenses
   ============================================================== */
function vueRubriqueDetail(ec, ba){
  var r = rubriqueParId(rubOuverte);
  if(!r){ aller("dashboard"); return; }

  var ep = estEpargne(r);
  var affecte = Number(r.montant) || 0;
  var d = depenseRub(r.id);
  var neutre = estAClasser(r) && affecte <= 0;   /* Sprint 6A — « À classer » reste neutre */
  var etat = neutre ? "neutre" : etatDe(d, affecte, ep);
  var reste = affecte - d;

  var origine = retourDe("rubrique");
  var labelOrigine = libelleVue(origine);
  ec.appendChild(boutonRetour(labelOrigine, origine));

  var t = el("h1", null, r.icone + " " + r.nom);
  ec.appendChild(t);
  var sousT = r.groupe;
  var rl = rappelLissage(r);
  if(rl && (r.periodicite || "mensuel") !== "mensuel") sousT += " · " + rl;
  ec.appendChild(el("p", "sub", sousT));

  /* résumé */
  var carte = el("div", "tb-tete");
  var haut = el("div", "env-haut");
  var bloc = el("div");
  bloc.style.flex = "1";
  bloc.appendChild(el("div", "lab tiny muted", ep ? "MIS DE CÔTÉ" : "DÉPENSÉ"));
  var gr = el("div", "big", fmtF(d));
  if(etat === "rouge") gr.className = "big c-rouge";
  if(ep && d > 0) gr.className = "big c-vert";
  bloc.appendChild(gr);
  bloc.appendChild(el("div", "tiny muted", (ep ? "sur un objectif de " : "sur ") + fmtF(affecte) + (ep ? "" : " affectés")));
  haut.appendChild(bloc);
  carte.appendChild(haut);
  var jg = jaugeRub(d, affecte, ep, neutre ? "neutre" : null);
  jg.style.marginTop = "10px";
  carte.appendChild(jg);
  var bas = el("div", "env-bas");
  bas.appendChild(el("span", (!ep && affecte <= 0 && d > 0 && !neutre) ? "c-neutre" : classeEtat(etat),
    neutre ? "ajustements de caisse" : texteUtilise(d, affecte, ep)));
  if(neutre){
    /* pas un dépassement */
  }else if(ep){
    bas.appendChild(el("span", classeEtat(etat), motEpargne(d, affecte)));
  }else if(reste >= 0 && affecte > 0){
    bas.appendChild(el("span", "muted", "Reste " + fmtF(reste)));
  }
  carte.appendChild(bas);
  ec.appendChild(carte);

  /* Sprint 6A — budget suggéré : il remplace le message de dépassement
     d'une rubrique qui dépense sans enveloppe */
  var sugD = ep ? null : suggestionBudget(r);
  if(sugD){
    ec.appendChild(blocSuggestion(sugD, function(m){
      fixerSuggestion(r, m);
      rafraichirSurPlace();
      toast("Enveloppe fixée à " + fmtF(m) + " ✓");
    }, function(){
      ignorerSuggestion(r.id);
      rafraichirSurPlace();
      toast("Suggestion masquée pour ce cycle");
    }, "sugg-carte"));
  }else if(ep && d > affecte && affecte > 0){
    ec.appendChild(el("p", "small c-vert", "Vous avez mis plus que prévu de côté. C'est une réussite, pas un dépassement."));
  }else if(!ep && reste < 0 && !neutre){
    ec.appendChild(el("p", "small muted", "L'enveloppe est dépassée. MonDjai ne bloque rien : à vous de décider où prendre la différence."));
  }

  /* Sprint 6B — « Par étiquette », dès 2 étiquettes différentes (total = total de la rubrique) */
  var parEt = regrouper(depensesDe(r.id), "etiquette");
  var avecEt = parEt.filter(function(x){ return x.cle; });
  if(avecEt.length >= 2){
    avecEt.sort(function(a, b){ return b.total - a.total; });
    ec.appendChild(el("h2", null, "Par étiquette"));
    var cEt = el("div", "card par-etiquette");
    avecEt.concat(parEt.filter(function(x){ return !x.cle; })).forEach(function(x){
      var lg = el("div", "tb-ligne");
      lg.appendChild(el("span", x.cle ? "nom" : "nom muted", x.cle ? x.nom : "Sans étiquette"));
      var mt = el("div", "tb-mont", fmtF(x.total));
      mt.appendChild(el("small", null, x.nb + (x.nb > 1 ? " dépenses" : " dépense")));
      lg.appendChild(mt);
      cEt.appendChild(lg);
    });
    ec.appendChild(cEt);
  }

  /* liste des dépenses (ou des versements) */
  var liste = triDepenses(depensesDe(r.id));
  var mot = ep ? "versements" : "dépenses";
  ec.appendChild(el("h2", null, liste.length ? "Ses " + mot + " (" + liste.length + ")" : "Ses " + mot));
  var card = el("div", "card");
  if(!liste.length){
    card.appendChild(el("div", "vide-msg", ep
      ? "Rien n'a encore été mis de côté ici. Le bouton « + » est là pour ça."
      : "Aucune dépense dans cette enveloppe pour l'instant."));
  }else{
    liste.forEach(function(dep){ card.appendChild(ligneDepense(dep, false)); });
  }
  ec.appendChild(card);

  var aide = el("p", "tiny muted", "Appuyez sur une ligne pour la modifier, ou sur × pour la supprimer.");
  aide.style.margin = "10px 0 0";
  ec.appendChild(aide);

  /* modifier le montant affecté */
  var bRep = el("button", "btn", ep ? "Modifier l'objectif" : "Modifier la répartition");
  bRep.type = "button";
  bRep.style.marginTop = "18px";
  bRep.addEventListener("click", function(){ ouvrirVue("repartition", origine); });
  ec.appendChild(bRep);

  /* « + » pré-réglé sur cette enveloppe : 2 taps */
  boutonPlus(ba, r.id);
}

/* ==============================================================
   ÉCRAN 6 — Nouveau cycle (F1)
   Revenus et répartition préremplis à partir du cycle en cours,
   modifiables avant validation. L'ancien cycle est archivé.
   ============================================================== */
function vueNouveauCycle(ec, ba){
  if(!brouillonCycle){ ouvrirNouveauCycle(); return; }
  var b = brouillonCycle;

  var bRet = el("button", "btn btn-ghost btn-line", "‹ Aujourd'hui");
  bRet.type = "button";
  bRet.style.marginBottom = "14px";
  bRet.addEventListener("click", function(){ brouillonCycle = null; aller("dashboard"); });
  ec.appendChild(bRet);

  ec.appendChild(el("h1", null, "J'ai reçu mon salaire"));
  ec.appendChild(el("p", "sub",
    "Tout est prérempli à partir du cycle en cours : ajustez ce qui a changé, puis validez. Le cycle démarré le "
    + dateComplete(S.cycleDebut) + " sera archivé avec ses dépenses."));
  var epEnCours = totalEpargne();
  if(epEnCours > 0){
    var bv = el("p", "bravo", "Sur le cycle qui se termine, vous avez mis " + fmtF(epEnCours) + " de côté. Beau travail.");
    bv.style.margin = "-14px 0 18px";
    ec.appendChild(bv);
  }

  /* --- revenus du nouveau cycle --- */
  ec.appendChild(el("h2", null, "Revenus de ce cycle"));
  var liste = el("div");
  ec.appendChild(liste);

  function dessinerRevenus(){
    liste.innerHTML = "";
    b.revenus.forEach(function(rev, idx){
      var l = el("div", "ligne");
      var lib = document.createElement("input");
      lib.type = "text"; lib.className = "lib"; lib.value = rev.libelle;
      lib.placeholder = "Nom du revenu";
      lib.setAttribute("aria-label", "Nom du revenu");
      lib.addEventListener("input", function(){ rev.libelle = lib.value; });
      l.appendChild(lib);
      l.appendChild(champMontant(rev.montant, function(v){ rev.montant = v; maj(); }));
      if(idx > 0){
        var d = el("button", "del", "×");
        d.type = "button"; d.title = "Retirer ce revenu";
        d.setAttribute("aria-label", "Retirer " + (rev.libelle || "ce revenu"));
        d.addEventListener("click", function(){
          b.revenus = b.revenus.filter(function(x){ return x.id !== rev.id; });
          dessinerRevenus(); maj();
        });
        l.appendChild(d);
      }
      liste.appendChild(l);
      /* Sprint 6A — nature du revenu, un tap */
      liste.appendChild(pastillesNature(rev, function(){ maj(); }));
      /* Sprint 5B — date propre à ce revenu, jamais celle du salaire par
         défaut : « Autre / Prime / Activités » n'arrivent pas forcément
         le jour de la paie. */
      if(idx > 0){
        var fd = el("div", "champ-date");
        fd.appendChild(el("span", "tiny muted", "Reçu le"));
        var id_ = document.createElement("input");
        id_.type = "date"; id_.className = "input-date";
        id_.value = rev.date || "";
        id_.setAttribute("aria-label", "Date de réception de " + (rev.libelle || "ce revenu"));
        id_.addEventListener("change", function(){ rev.date = id_.value || null; });
        fd.appendChild(id_);
        liste.appendChild(fd);
      }
    });
  }
  dessinerRevenus();

  var bAjout = el("button", "btn btn-ghost", "+ Ajouter un revenu");
  bAjout.type = "button";
  var menu = el("div", "menu");
  menu.hidden = true;
  TYPES_REVENU.forEach(function(t){
    var bt = el("button", null, t.lab);
    bt.type = "button";
    bt.addEventListener("click", function(){
      b.revenus.push({id: uid(), libelle: t.libelle, montant: 0, date: aujourdhui(), nature: t.nature});
      menu.hidden = true; dessinerRevenus(); maj();
    });
    menu.appendChild(bt);
  });
  bAjout.addEventListener("click", function(){ menu.hidden = !menu.hidden; });
  ec.appendChild(bAjout);
  ec.appendChild(menu);

  var tot = el("div", "total-ligne");
  tot.appendChild(el("span", "muted small", "Total des revenus"));
  var totVal = el("span", "big");
  tot.appendChild(totVal);
  ec.appendChild(tot);
  /* Sprint 6A — « dont régulier · exceptionnel · emprunt » */
  var dontNC = el("div", "dont");
  ec.appendChild(dontNC);

  /* Sprint 5B — si le total a changé par rapport au cycle précédent,
     on propose (sans l'imposer) de recalculer la répartition :
     charges fixes inchangées, épargne proportionnelle, le reste ajusté. */
  var avisRecalc = el("div", "avis");
  avisRecalc.hidden = true;
  ec.appendChild(avisRecalc);

  /* --- répartition du nouveau cycle, par groupe --- */
  ec.appendChild(el("h2", null, "Répartition"));
  var aideL2 = el("p", "tiny muted",
    "L'assistant de lissage reste disponible ici : « Lisser un montant » recalcule la part mensuelle d'une dépense qui ne tombe pas tous les mois.");
  aideL2.style.margin = "0 0 12px";
  ec.appendChild(aideL2);
  var act = actives();
  var pcts = {};
  if(!act.length){
    var c0 = el("div", "card");
    c0.appendChild(el("div", "vide-msg", "Aucune rubrique active. Ouvrez « Rubriques » pour en choisir."));
    ec.appendChild(c0);
  }else{
    groupesPresents(act).forEach(function(g){
      var membres = membresGroupe(act, g);
      if(!membres.length) return;
      var h = el("div", "grp");
      var ht = el("div", "grp-t");
      ht.appendChild(el("span", "grp-nom", g));
      var sous = el("span", "grp-mont", "");
      ht.appendChild(sous);
      h.appendChild(ht);
      h.dataset.groupe = g;
      ec.appendChild(h);
      pcts["__grp_" + g] = sous;

      var pilote = {
        maj: function(){ maj(); },
        reste: function(){ return brTotalRevenus() - brTotalReparti(); }
      };
      membres.forEach(function(r){
        ec.appendChild(ligneRepartition(r, Number(b.montants[r.id]) || 0, function(v){
          b.montants[r.id] = v; maj();
        }, pilote, pcts, {
          /* Sprint 6A — mêmes suggestions, à partir des dépenses du cycle qui
             se termine ; jamais appliquées automatiquement */
          calcul: function(v){ return (b.suggIgnorees || {})[r.id] ? null : calculSuggestion(r, S.depenses, v); },
          fixer: function(m){ if(b.reelsFixes) b.reelsFixes[r.id] = m; },
          ignorer: function(){ if(b.suggIgnorees) b.suggIgnorees[r.id] = true; }
        }));
      });
    });
  }

  /* --- barre --- */
  var bar = el("div", "sticky"), inn = el("div", "sticky-in");
  var banniere = el("div", "banner");
  banniere.hidden = true;
  var rl = el("div", "reste-line");
  var gauche = el("div");
  gauche.appendChild(el("div", "lab", "Reste à répartir"));
  var val = el("div", "reste-val");
  gauche.appendChild(val);
  rl.appendChild(gauche);
  var droite = el("div", "tiny muted num");
  droite.style.textAlign = "right";
  rl.appendChild(droite);

  var rowB = el("div", "row-btns");
  var bAnn = el("button", "btn btn-ghost", "Annuler"); bAnn.type = "button";
  bAnn.addEventListener("click", function(){ brouillonCycle = null; aller("dashboard"); });
  var bOk = el("button", "btn btn-primary", "Démarrer le cycle"); bOk.type = "button";
  bOk.addEventListener("click", function(){
    var dep = totalDepense();
    var msg = "Démarrer un nouveau cycle ?\n\nLe cycle en cours (depuis le " + dateComplete(S.cycleDebut) + ") "
            + "sera archivé avec ses " + S.depenses.length + (S.depenses.length > 1 ? " dépenses" : " dépense")
            + " (" + fmt(dep) + " F). Vous le retrouverez dans l'Historique.";
    if(confirm(msg)) validerNouveauCycle();
  });
  rowB.appendChild(bAnn); rowB.appendChild(bOk);

  inn.appendChild(banniere); inn.appendChild(rl); inn.appendChild(rowB);
  bar.appendChild(inn); ba.appendChild(bar);

  function maj(){
    var t = brTotalRevenus(), rep = brTotalReparti(), rst = t - rep;
    totVal.textContent = fmtF(t);
    dessinerDontNatures(dontNC, b.revenus);   /* Sprint 6A */
    act.forEach(function(r){
      var m = Number(b.montants[r.id]) || 0;
      pcts[r.id].textContent = (t > 0 ? Math.round(m / t * 100) : 0) + "%";
    });
    groupesPresents(act).forEach(function(g){
      if(!pcts["__grp_" + g]) return;
      var s = 0;
      membresGroupe(act, g).forEach(function(r){ s += Number(b.montants[r.id]) || 0; });
      pcts["__grp_" + g].textContent = fmtF(s);
    });
    droite.textContent = "Réparti : " + fmtF(rep) + " / " + fmtF(t);
    if(rst < 0){
      val.textContent = fmtF(0);
      val.className = "reste-val deficit";
      banniere.hidden = false;
      banniere.textContent = "Déficit à combler : " + fmtF(-rst);
    }else{
      val.textContent = fmtF(rst);
      val.className = "reste-val" + (rst === 0 ? " ok" : "");
      banniere.hidden = true;
    }
    bOk.disabled = !(t > 0);

    /* Sprint 5B — proposition de recalcul si les revenus ont changé */
    var changement = b.totalOrigine > 0 && t !== b.totalOrigine;
    var dejaDecide = b.derniereDecisionTotal === t;
    if(changement && !dejaDecide){
      avisRecalc.hidden = false;
      avisRecalc.innerHTML = "";
      var signe = t > b.totalOrigine ? "+" : "";
      avisRecalc.appendChild(el("div", "avis-t", "Vos revenus ont changé"));
      avisRecalc.appendChild(el("p", "avis-p",
        fmtF(b.totalOrigine) + " → " + fmtF(t) + " (" + signe + fmtF(t - b.totalOrigine) + "). "
        + "Recalculer la répartition ? Les charges fixes restent identiques, l'épargne suit vos revenus, le reste s'ajuste."));
      var rBtns = el("div", "row-btns");
      var bGarder = el("button", "btn btn-ghost", "Garder mes montants"); bGarder.type = "button";
      bGarder.addEventListener("click", function(){
        b.derniereDecisionTotal = t; avisRecalc.hidden = true;
      });
      var bRecalc = el("button", "btn btn-primary", "Recalculer"); bRecalc.type = "button";
      bRecalc.addEventListener("click", function(){
        recalculerRepartitionAuto();
        b.derniereDecisionTotal = t;
        aller("nouveauCycle"); /* on redessine l'écran : les champs affichent les nouveaux montants */
        toast("Répartition recalculée ✓");
      });
      rBtns.appendChild(bGarder); rBtns.appendChild(bRecalc);
      avisRecalc.appendChild(rBtns);
    }else{
      avisRecalc.hidden = true;
    }
  }
  maj();
}

/* ==============================================================
   ÉCRAN 7 — Historique des cycles (F6)
   ============================================================== */
function vueHistorique(ec, ba){
  var cible = retourDe("historique");
  ec.appendChild(boutonRetour(libelleVue(cible), cible));

  ec.appendChild(el("h1", null, "Historique"));
  ec.appendChild(el("p", "sub", "Vos cycles clôturés, du plus récent au plus ancien."));

  if(!S.cycles.length){
    var c0 = el("div", "card");
    c0.appendChild(el("div", "vide-msg",
      "Aucun cycle archivé pour l'instant. Votre premier cycle apparaîtra ici le jour où vous démarrerez le suivant."));
    ec.appendChild(c0);
  }else{
    S.cycles.forEach(function(c){
      var rev = cycRevenus(c), dep = cycDepense(c), ecart = rev - dep;
      var b = el("button", "cyc");
      b.type = "button";
      b.setAttribute("aria-label", "Ouvrir le cycle du " + periodeCycle(c));

      var h = el("div", "cyc-h");
      h.appendChild(el("span", "cyc-per", periodeCycle(c)));
      h.appendChild(el("span", "chev", "›"));
      b.appendChild(h);

      var g = el("div", "cyc-g");
      var d1 = el("div", null, "REVENUS");
      d1.insertBefore(el("b", null, fmtF(rev)), d1.firstChild);
      var d2 = el("div", null, "DÉPENSÉ");
      d2.insertBefore(el("b", null, fmtF(dep)), d2.firstChild);
      var d3 = el("div", null, ecart >= 0 ? "RESTÉ" : "DÉPASSEMENT");
      d3.insertBefore(el("b", ecart >= 0 ? "c-vert" : "c-rouge", fmtF(Math.abs(ecart))), d3.firstChild);
      g.appendChild(d1); g.appendChild(d2); g.appendChild(d3);
      b.appendChild(g);

      b.appendChild(jaugeRub(dep, rev));
      var epC = cycEpargne(c);
      if(epC > 0) b.appendChild(el("div", "bravo", fmtF(epC) + " mis de côté 👏"));
      b.addEventListener("click", function(){ ouvrirCycle(c.id); });
      ec.appendChild(b);
    });
  }

  ec.appendChild(el("h2", null, "Vos données"));
  ec.appendChild(blocSauvegarde());

/* ==============================================================
   ÉCRAN 8 — Un cycle archivé, en lecture seule (F6)
   ============================================================== */
function vueCycleArchive(ec, ba){
  var c = cycleParId(cycleOuvert);
  if(!c){ aller("historique"); return; }

  var rev = cycRevenus(c), rep = cycReparti(c), dep = cycDepense(c);
  var ecart = rev - dep;

  ec.appendChild(boutonRetour("Historique", "historique"));

  ec.appendChild(el("h1", null, "Cycle clôturé"));
  var sub = el("p", "sub", periodeCycle(c));
  ec.appendChild(sub);
  var badge = el("span", "lecture", "Lecture seule");
  ec.appendChild(badge);

  /* --- synthèse --- */
  var tete = el("div", "tb-tete");
  tete.style.marginTop = "16px";
  tete.appendChild(el("div", "lab tiny muted", "DÉPENSÉ SUR CE CYCLE"));
  var grand = el("div", "big", fmtF(dep));
  if(dep > rev) grand.className = "big c-rouge";
  tete.appendChild(grand);
  tete.appendChild(el("div", "tiny muted", "sur " + fmtF(rev) + " de revenus"));
  var jg = jaugeRub(dep, rev);
  jg.style.marginTop = "12px";
  tete.appendChild(jg);
  var bas = el("div", "env-bas");
  bas.appendChild(el("span", "muted", "Réparti : " + fmtF(rep)));
  bas.appendChild(el("span", ecart >= 0 ? "c-vert" : "c-rouge",
    ecart >= 0 ? "Resté " + fmtF(ecart) : "Dépassement de " + fmtF(-ecart)));
  tete.appendChild(bas);
  var epC2 = cycEpargne(c);
  if(epC2 > 0){
    tete.appendChild(el("div", "bravo", "dont " + fmtF(epC2) + " mis de côté 👏"));
  }
  ec.appendChild(tete);

  /* --- revenus --- */
  ec.appendChild(el("h2", null, "Revenus"));
  var cr = el("div", "card");
  if(!c.revenus.length){
    cr.appendChild(el("div", "vide-msg", "Aucun revenu enregistré sur ce cycle."));
  }else{
    c.revenus.forEach(function(r){
      var l = el("div", "ro");
      var h = el("div", "ro-h");
      h.appendChild(el("span", "nom", r.libelle || "Revenu"));
      /* Sprint 6A — la nature suit dans l'archive (rien pour le régulier) */
      if(estAjustement(r)) h.appendChild(el("span", "pill-aj", "Ajustement"));
      else if(natureDe(r) !== "regulier") h.appendChild(el("span", "tag", natureInfo(natureDe(r)).dont));
      h.appendChild(el("div", "ro-m", fmtF(r.montant)));
      l.appendChild(h);
      cr.appendChild(l);
    });
    var lt = el("div", "ro");
    var ht = el("div", "ro-h");
    ht.appendChild(el("span", "nom muted", "Total"));
    ht.appendChild(el("div", "ro-m", fmtF(rev)));
    lt.appendChild(ht);
    var dontA = el("div", "dont");
    dessinerDontNatures(dontA, c.revenus);
    if(!dontA.hidden) lt.appendChild(dontA);
    cr.appendChild(lt);
  }
  ec.appendChild(cr);

  /* --- répartition, dépensé et écarts, par groupe --- */
  ec.appendChild(el("h2", null, "Répartition et dépenses"));
  var rubs = c.rubriques.filter(function(r){
    return (Number(r.montant) || 0) > 0 || cycDepenseRub(c, r.id) > 0;
  });
  if(!rubs.length){
    var c1 = el("div", "card");
    c1.appendChild(el("div", "vide-msg", "Rien n'a été réparti ni dépensé sur ce cycle."));
    ec.appendChild(c1);
  }else{
    groupesPresents(rubs).forEach(function(g){
      var membres = membresGroupe(rubs, g);
      if(!membres.length) return;
      var affG = 0, depG = 0;
      membres.forEach(function(r){
        affG += Number(r.montant) || 0;
        depG += cycDepenseRub(c, r.id);
      });
      ec.appendChild(enteteGroupe(g, affG, depG, g === GROUPE_EPARGNE));

      var carte = el("div", "card");
      membres.slice().sort(function(a,b){ return (b.montant||0) - (a.montant||0); }).forEach(function(r){
        var epR = (g === GROUPE_EPARGNE);
        var aff = Number(r.montant) || 0;
        var d = cycDepenseRub(c, r.id);
        var e = aff - d;
        var etat = etatDe(d, aff, epR);

        var l = el("div", "ro");
        var h = el("div", "ro-h");
        var ic = el("span", "ico", r.icone);
        ic.style.background = "var(--ico-bg)";
        ic.style.boxShadow = "inset 0 0 0 1px " + teinte(r.couleur) + "55";
        h.appendChild(ic);
        h.appendChild(el("span", "nom", r.nom));
        var m = el("div", "ro-m", fmtF(d));
        m.appendChild(el("small", null, (epR ? "objectif " : "sur ") + fmtF(aff)));
        h.appendChild(m);
        l.appendChild(h);
        l.appendChild(jaugeRub(d, aff, epR));
        var b2 = el("div", "ro-b");
        b2.appendChild(el("span", (!epR && aff <= 0 && d > 0) ? "c-neutre" : classeEtat(etat), texteUtilise(d, aff, epR)));
        if(epR){
          b2.appendChild(el("span", classeEtat(etat), motEpargne(d, aff)));
        }else{
          b2.appendChild(el("span", e < 0 ? "c-rouge" : "muted",
            e >= 0 ? "Écart : + " + fmtF(e) : "Écart : − " + fmtF(-e)));
        }
        l.appendChild(b2);
        carte.appendChild(l);
      });
      ec.appendChild(carte);
    });

    var nonAff = rev - rep;
    if(nonAff > 0){
      var cn = el("div", "card");
      cn.style.marginTop = "10px";
      var ln = el("div", "tb-ligne");
      var pa = el("span", "pastille");
      pa.style.background = "var(--muted)";
      ln.appendChild(pa);
      ln.appendChild(el("span", "ico", "\uD83D\uDDC2\uFE0F"));
      ln.appendChild(el("span", "nom", "Non affecté"));
      var mn = el("div", "tb-mont", fmtF(nonAff));
      mn.appendChild(el("small", null, "jamais réparti"));
      ln.appendChild(mn);
      cn.appendChild(ln);
      ec.appendChild(cn);
    }
  }

  /* --- journal des dépenses du cycle --- */
  var liste = triDepenses(c.depenses);
  ec.appendChild(el("h2", null, liste.length
    ? "Ses sorties (" + liste.length + ")" : "Ses sorties"));
  var cd = el("div", "card");
  if(!liste.length){
    cd.appendChild(el("div", "vide-msg", "Aucune dépense n'a été saisie sur ce cycle."));
  }else{
    liste.forEach(function(d){
      var r = null;
      for(var i = 0; i < c.rubriques.length; i++){ if(c.rubriques[i].id === d.rubrique) r = c.rubriques[i]; }
      var l = el("div", "ro");
      var h = el("div", "ro-h");
      var ic = el("span", "ico", r ? r.icone : "\uD83D\uDCB8");
      if(r){
        ic.style.background = "var(--ico-bg)";
        ic.style.boxShadow = "inset 0 0 0 1px " + teinte(r.couleur) + "55";
      }
      h.appendChild(ic);
      var txt = el("div");
      txt.style.flex = "1"; txt.style.minWidth = "0";
      txt.appendChild(el("div", "d-lib", d.libelle || (r ? r.nom : "Dépense")));
      var sous2 = dateCourte(d.date) + (r && d.libelle ? " · " + r.nom : "");
      var ld2 = el("div", "d-date", sous2);
      if(estAjustement(d)) ld2.appendChild(el("span", "pill-aj", "Ajustement"));   /* Sprint 6A */
      txt.appendChild(ld2);
      h.appendChild(txt);
      h.appendChild(el("div", "ro-m", fmtF(d.montant)));
      l.appendChild(h);
      cd.appendChild(l);
    });
  }
  ec.appendChild(cd);

  var note = el("p", "tiny muted",
    "Un cycle archivé ne se modifie plus : c'est la photo de votre mois, telle qu'elle était à la clôture.");
  note.style.margin = "12px 0 0";
  ec.appendChild(note);
}

/* ==============================================================
   SPRINT 4 — CODE D'ACCÈS (F8)
   Le code décourage les curieux ; il ne chiffre pas les données.
   C'est écrit noir sur blanc dans les Réglages.
   ============================================================== */

/* Pavé numérique + quatre points. opts.onComplet(code, api) */
function blocCode(opts){
  var wrap = el("div", "code-bloc");
  var pts = el("div", "points");
  var points = [];
  for(var i = 0; i < 4; i++){
    var d = el("div", "pt");
    pts.appendChild(d); points.push(d);
  }
  wrap.appendChild(pts);
  var err = el("div", "err-code", "");
  wrap.appendChild(err);

  var saisie = "";
  function majPoints(){
    points.forEach(function(d, i){ d.classList.toggle("on", i < saisie.length); });
  }
  var api = {
    reset: function(){ saisie = ""; err.textContent = ""; majPoints(); },
    erreur: function(m){ saisie = ""; err.textContent = m; majPoints(); }
  };
  function taper(c){
    if(saisie.length >= 4) return;
    err.textContent = "";
    saisie += c;
    majPoints();
    if(saisie.length === 4){
      var code = saisie;
      setTimeout(function(){ opts.onComplet(code, api); }, 130);
    }
  }
  var clav = el("div", "clav");
  ["1","2","3","4","5","6","7","8","9"].forEach(function(c){
    var b = el("button", "tou", c);
    b.type = "button";
    b.addEventListener("click", function(){ taper(c); });
    clav.appendChild(b);
  });
  var vide = el("button", "tou tou-vide", "");
  vide.type = "button"; vide.tabIndex = -1; vide.setAttribute("aria-hidden", "true");
  clav.appendChild(vide);
  var b0 = el("button", "tou", "0");
  b0.type = "button";
  b0.addEventListener("click", function(){ taper("0"); });
  clav.appendChild(b0);
  var bDel = el("button", "tou", "⌫");
  bDel.type = "button"; bDel.setAttribute("aria-label", "Effacer le dernier chiffre");
  bDel.addEventListener("click", function(){
    saisie = saisie.slice(0, -1);
    err.textContent = "";
    majPoints();
  });
  clav.appendChild(bDel);
  wrap.appendChild(clav);

  wrap.api = api;
  return wrap;
}

/* Activer ou modifier le code : saisie, puis confirmation */
function ouvrirDefinirCode(){
  var f = creerFeuille(S.pin ? "Modifier le code" : "Activer le code");
  var titre = el("h1", null, "Choisissez un code");
  var sous = el("p", "sub", "Quatre chiffres, faciles à retenir pour vous.");
  f.body.appendChild(titre);
  f.body.appendChild(sous);
  var zone = el("div");
  f.body.appendChild(zone);

  var premier = "";
  function dessiner(msg){
    zone.innerHTML = "";
    titre.textContent = premier ? "Confirmez le code" : "Choisissez un code";
    sous.textContent = premier ? "Saisissez-le une seconde fois."
                               : "Quatre chiffres, faciles à retenir pour vous.";
    var bloc = blocCode({
      onComplet: function(code){
        if(!premier){
          premier = code;
          dessiner("");
        }else if(code === premier){
          S.pin = code;
          deverrouille = true;
          sauver();
          fermerFeuille(false);
          render();
          toast("Code activé ✓");
        }else{
          premier = "";
          dessiner("Les deux codes sont différents. On recommence.");
        }
      }
    });
    zone.appendChild(bloc);
    if(msg) bloc.api.erreur(msg);
  }
  dessiner("");
}

function desactiverCode(){

  S.pin = null;
  deverrouille = true;

  render();
  toast("Code désactivé");
}

/* ==============================================================
   SPRINT 4 — ASSISTANT DE LISSAGE : le panneau dépliable (F9)
   ============================================================== */
function blocLissage(r, onAppliquer, onMaj){
  var p = el("div", "lissage");
  p.hidden = true;
  p.appendChild(el("div", "liss-t", "Lisser cette dépense"));
  p.appendChild(el("p", "liss-p",
    "Indiquez ce que vous payez réellement et à quelle fréquence : MonDjai calcule la part à prévoir chaque mois."));

  var ligne = el("div", "liss-ligne");
  ligne.appendChild(el("span", "liss-lab", "Montant réel"));
  var champ = champMontant(Number(r.montantReel) || 0, function(v){
    r.montantReel = v; sauver(); majResultat();
  });
  ligne.appendChild(champ);
  p.appendChild(ligne);

  var chips = el("div", "chips");
  chips.style.margin = "11px 0 12px";
  PERIODICITES.forEach(function(pe){
    var c = el("button", "chip", pe.label);
    c.type = "button";
    c.setAttribute("aria-pressed", (r.periodicite || "mensuel") === pe.cle ? "true" : "false");
    c.addEventListener("click", function(){
      r.periodicite = pe.cle; sauver();
      chips.querySelectorAll(".chip").forEach(function(x){ x.setAttribute("aria-pressed", "false"); });
      c.setAttribute("aria-pressed", "true");
      majResultat();
    });
    chips.appendChild(c);
  });
  p.appendChild(chips);

  var res = el("div", "liss-res", "");
  p.appendChild(res);

  var row = el("div", "row-btns");
  var bRet = el("button", "btn btn-ghost", "Retirer");
  bRet.type = "button";
  bRet.addEventListener("click", function(){
    r.montantReel = 0; r.periodicite = "mensuel"; sauver();
    champ.value = fmt(0); champ.classList.add("vide");
    chips.querySelectorAll(".chip").forEach(function(x, i){
      x.setAttribute("aria-pressed", i === 0 ? "true" : "false");
    });
    majResultat();
    if(onMaj) onMaj();
  });
  var bApp = el("button", "btn btn-primary", "Appliquer");
  bApp.type = "button";
  bApp.addEventListener("click", function(){
    var prov = provisionRub(r);
    if(prov <= 0) return;
    onAppliquer(prov);
    if(onMaj) onMaj();
    p.hidden = true;
    toast("Provision mensuelle appliquée ✓");
  });
  row.appendChild(bRet); row.appendChild(bApp);
  p.appendChild(row);

  function majResultat(){
    var prov = provisionRub(r);
    var pe = periodDe(r.periodicite);
    res.textContent = prov > 0
      ? "Provision mensuelle : " + fmtF(prov) + "  (" + fmtF(Number(r.montantReel) || 0) + " " + pe.par + ")"
      : "Saisissez le montant réel pour voir la part mensuelle.";
    bApp.disabled = !(prov > 0);
    bApp.textContent = prov > 0 ? "Mettre " + fmtF(prov) : "Appliquer";
  }
  majResultat();
  return p;
}

/* Ligne de répartition complète : rubrique + lien de lissage + panneau.
   Utilisée par l'écran Répartition et par l'écran Nouveau cycle. */
function ligneRepartition(r, valeur, onChange, onMaj, pcts, sugg){
  var frag = document.createDocumentFragment();
  var zoneSugg = el("div");   /* Sprint 6A — budget suggéré sous la ligne */

  var row = el("div", "repart");
  row.style.borderLeftColor = r.couleur;
  var ic = el("span", "ico", r.icone);
  ic.style.background = "var(--ico-bg)";
  ic.style.boxShadow = "inset 0 0 0 1px " + teinte(r.couleur) + "55";
  row.appendChild(ic);

  var bloc = el("div");
  bloc.style.flex = "1"; bloc.style.minWidth = "0";
  bloc.appendChild(el("div", "nom", r.nom));
  var sousLigne = el("div", "sous-ligne");
  var pc = el("span", "pct", "0 %");
  if(pcts) pcts[r.id] = pc;
  sousLigne.appendChild(pc);
  var lien = el("button", "lien-liss", "");
  lien.type = "button";
  sousLigne.appendChild(lien);
  bloc.appendChild(sousLigne);
  row.appendChild(bloc);

  var bReste = el("button", "reste-ici", "+ reste");
  bReste.type = "button";
  bReste.title = "Mettre tout le reste dans cette rubrique";
  row.appendChild(bReste);

  var champ = champMontant(valeur, function(v){ onChange(v); majSugg(v); });
  row.appendChild(champ);

  function poser(v){
    onChange(v);
    champ.value = fmt(v);
    champ.classList.toggle("vide", v === 0);
    majSugg(v);
  }
  /* Sprint 6A — « Sans enveloppe · dépensé … · fixer à … ? » tant que le budget est à 0 */
  function majSugg(v){
    zoneSugg.innerHTML = "";
    if(!sugg) return;
    var sg = sugg.calcul(v);
    if(!sg) return;
    zoneSugg.appendChild(blocSuggestion(sg, function(m){
      sugg.fixer(m);
      poser(m);
      majLien();
      onMaj.maj();
      toast("Enveloppe fixée à " + fmtF(m) + " ✓");
    }, function(){
      sugg.ignorer();
      zoneSugg.innerHTML = "";
    }, "sugg-rep"));
  }
  bReste.addEventListener("click", function(){
    var rst = onMaj.reste();
    if(rst <= 0) return;
    poser((chiffres(champ.value) || 0) + rst);
    onMaj.maj();
  });

  var panneau = blocLissage(r, function(prov){
    poser(prov);
    onMaj.maj();
  }, majLien);
  function majLien(){
    var t = rappelLissage(r);
    lien.textContent = t ? "≈ " + t : "Lisser un montant";
  }
  lien.addEventListener("click", function(){ panneau.hidden = !panneau.hidden; });
  majLien();

  frag.appendChild(row);
  frag.appendChild(zoneSugg);
  frag.appendChild(panneau);
  majSugg(valeur);
  return frag;
}

function ouvrirAjustement(){

  var fR = el("div", "field");

  var bOk = el("button", "btn btn-primary", "Ajuster");
  bOk.type = "button";
  inn.appendChild(bOk); bar.appendChild(inn); f.sh.appendChild(bar);

  function ecart(){ return reel - solde; }
  function maj(){
    zone.innerHTML = "";

      zone.appendChild(el("div", "big c-vert", "Rien à ajuster ✓"));
      return;
    }
    zone.appendChild(el("div", "lab tiny muted", "ÉCART"));

    maj();

    if(e.key === "Enter" && !bOk.disabled){ e.preventDefault(); valider(); }
  });

}

   SPRINT 6B — TEXTE, ÉTIQUETTES, « POUR QUI ? », RACCOURCIS
   ============================================================== */
/* Clé de regroupement : insensible à la casse, aux accents et aux espaces en trop */
function cleTexte(s){
  var t = String(s === undefined || s === null ? "" : s);
  try{ t = t.normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }catch(e){}
  return t.toLowerCase().replace(/\s+/g, " ").trim();
}
function propre(s, max){
  var t = String(s === undefined || s === null ? "" : s).replace(/\s+/g, " ").trim();
  return max ? t.slice(0, max) : t;
}
function familleParId(id){
  for(var i = 0; i < FAMILLES.length; i++){ if(FAMILLES[i].id === id) return FAMILLES[i]; }
  return null;
}
function estFamilleId(id){ return !!familleParId(id); }
var voirPlusRubriques = false;   /* premier lancement : catalogue détaillé déplié ? */

/* --- étiquettes --- */
function etiquettesDe(r){
  return (r && Array.isArray(r.etiquettes))
    ? r.etiquettes.filter(function(e){ return typeof e === "string" && e.trim(); }) : [];
}
/* Pastilles proposées : étiquettes mémorisées (suggestions des familles, « + Autre »),
   puis celles déjà utilisées sur cette rubrique */
function etiquettesProposees(r, choisie){
  var out = [], vus = {};
  function ajout(e){
    var p = propre(e, ETIQUETTE_MAX), k = cleTexte(p);
    if(k && !vus[k]){ vus[k] = true; out.push(p); }
  }
  etiquettesDe(r).forEach(ajout);
  triDepenses(S.depenses.concat(S.previsions || [])).forEach(function(d){
    if(d.rubrique === r.id && d.etiquette) ajout(d.etiquette);
  });
  if(choisie) ajout(choisie);
  return out;
}
function memoriserEtiquette(r, e){
  var p = propre(e, ETIQUETTE_MAX);
  if(!p || !r) return "";
  var l = etiquettesDe(r), k = cleTexte(p);
  for(var i = 0; i < l.length; i++){ if(cleTexte(l[i]) === k) return l[i]; }
  l.push(p);
  r.etiquettes = l;
  sauver();
  return p;
}
/* Regroupe des lignes par étiquette ou par personne ; orthographe affichée = la plus récente */
function regrouper(liste, champ){
  var g = {}, ordre = [];
  triDepenses(liste).forEach(function(d){
    var k = cleTexte(d[champ]);
    if(!Object.prototype.hasOwnProperty.call(g, k)){
      g[k] = {cle: k, nom: k ? propre(d[champ]) : "", total: 0, nb: 0};
      ordre.push(k);
    }
    g[k].total += Number(d.montant) || 0;
    g[k].nb++;
  });
  return ordre.map(function(k){ return g[k]; });
}
function toutesDepenses(){
  var l = S.depenses.concat(S.previsions || []);
  S.cycles.forEach(function(c){ l = l.concat(c.depenses || []); });
  return l;
}

/* Les valeurs les plus utilisées sur les POUR_QUI_JOURS derniers jours (aucune détection de prénoms) */
function personnesRecentes(){
  var lim = new Date(); lim.setDate(lim.getDate() - POUR_QUI_JOURS);
  var limIso = iso(lim);
  var g = regrouper(toutesDepenses().filter(function(d){
    return cleTexte(d.pour) && (d.date || "") >= limIso;
  }), "pour");
  g.sort(function(a, b){ return b.nb - a.nb; });   /* à égalité : la plus récente d'abord */
  return g.slice(0, POUR_QUI_PASTILLES).map(function(x){ return x.nom; });
}
/* Personnes du cycle en cours, par ordre alphabétique : un récapitulatif, jamais un classement */
function personnesDuCycle(){

  g.sort(function(a, b){ return a.nom.localeCompare(b.nom, "fr", {sensitivity: "base"}); });

}

/* --- raccourcis de saisie ⚡ --- */
function signatureSaisie(d){ return (d.rubrique || "") + "|" + (Number(d.montant) || 0) + "|" + cleTexte(d.libelle); }
/* 3e saisie identique (rubrique + montant + libellé normalisé) dans le cycle,
   jamais deux fois pour le même modèle, MAX_MODELES au plus */
function candidatModele(dep){
  if(!dep || estAjustement(dep)) return null;
  if((S.modeles || []).length >= MAX_MODELES) return null;
  var sig = signatureSaisie(dep);
  if((S.modeles || []).some(function(m){ return signatureSaisie(m) === sig; })) return null;
  if(reglage("modelesProposes").indexOf(sig) >= 0) return null;
  var n = S.depenses.filter(function(d){ return !estAjustement(d) && signatureSaisie(d) === sig; }).length;
  return n >= MODELE_SEUIL ? sig : null;
}
function ajouterModele(dep){

  S.modeles.push(m);
  sauver();

}

/* ==============================================================
   SPRINT 6B — FUSION DE RUBRIQUES (assistant et fusion unitaire)
   Rien ne change sans accord explicite et confirmation chiffrée.
   ============================================================== */
/* Fusion de A dans B : dépenses, prévisions et raccourcis du cycle en cours
   repointés vers B ; budget de B = B + A ; A supprimée si personnalisée,
   sinon désactivée (montant 0). Cycles archivés intacts, totaux identiques.
   Refusée si A = B, et entre épargne et non-épargne (l'épargne reste à part). */
function fusionnerRubrique(idA, idB, sansSauver){
  if(!idA || !idB || idA === idB) return false;
  var A = rubriqueParId(idA), B = rubriqueParId(idB);
  if(!A || !B || estEpargne(A) !== estEpargne(B)) return false;
  function repointer(liste){ (liste || []).forEach(function(d){ if(d.rubrique === idA) d.rubrique = idB; }); }
  repointer(S.depenses); repointer(S.previsions); repointer(S.modeles);
  B.montant = (Number(B.montant) || 0) + (Number(A.montant) || 0);
  if((B.periodicite || "mensuel") === "mensuel" && ((Number(B.montantReel) || 0) > 0 || (Number(A.montantReel) || 0) > 0)){
    B.montantReel = B.montant;
  }
  var lb = etiquettesDe(B);
  etiquettesDe(A).forEach(function(e){
    if(!lb.some(function(x){ return cleTexte(x) === cleTexte(e); })) lb.push(e);
  });
  if(lb.length) B.etiquettes = lb;
  B.active = true;
  if(A.perso){
    S.rubriques = S.rubriques.filter(function(x){ return x.id !== idA; });
  }else{
    A.active = false;
    A.montant = 0;
  }
  if(!sansSauver) sauver();
  return true;
}
function porteQuelqueChose(r){
  return r.active || (Number(r.montant) || 0) > 0
    || S.depenses.some(function(d){ return d.rubrique === r.id; })
    || (S.previsions || []).some(function(d){ return d.rubrique === r.id; });
}
/* Pour chaque famille : les rubriques rattachées qui portent quelque chose
   (active, budget, dépense ou prévision), hors la rubrique cible elle-même */
function propositionsSimplification(){
  var out = [];
  FAMILLES.forEach(function(f){
    var sources = (RATTACHEMENTS[f.id] || []).filter(function(id){ return id !== f.id; })
      .map(rubriqueParId).filter(function(r){ return r && !r.perso && !estAClasser(r) && porteQuelqueChose(r); });
    if(sources.length) out.push({famille: f, cible: rubriqueParId(f.id), sources: sources});
  });
  return out;
}
/* Applique une famille : cible créée si besoin (nom, icône, étiquettes de la famille),
   puis chaque rubrique cochée y est fusionnée */
function appliquerFamille(p, ids){
  if(!ids.length) return;
  var f = p.famille;
  var cible = rubriqueParId(f.id);
  if(!cible){
    cible = {id: f.id, nom: f.nom, icone: f.icone, couleur: f.couleur, groupe: f.groupe,
             active: true, montant: 0, perso: false, periodicite: "mensuel", montantReel: 0};
    S.rubriques.push(cible);
  }
  cible.active = true;
  var nomPris = S.rubriques.some(function(x){
    return x.id !== cible.id && ids.indexOf(x.id) < 0 && cleTexte(x.nom) === cleTexte(f.nom);
  });
  if(!nomPris) cible.nom = f.nom;
  cible.icone = f.icone;
  var l = etiquettesDe(cible);
  (ETIQUETTES_FAMILLES[f.id] || []).forEach(function(e){
    if(!l.some(function(x){ return cleTexte(x) === cleTexte(e); })) l.push(e);
  });
  if(l.length) cible.etiquettes = l;
  ids.forEach(function(id){ fusionnerRubrique(id, cible.id, true); });
}
function phraseFusion(nbDep, nbPrev, nomCible, budget){
  var t = nbDep === 0 ? "Aucune dépense à déplacer"
        : nbDep + (nbDep > 1 ? " dépenses seront déplacées" : " dépense sera déplacée") + " vers " + nomCible;
  if(nbPrev) t += " (+ " + nbPrev + (nbPrev > 1 ? " prévisions" : " prévision") + ")";
  return t + " ; budgets additionnés : " + fmtF(budget) + ".";
}
function compterLignes(ids){
  return {
    dep: S.depenses.filter(function(d){ return ids.indexOf(d.rubrique) >= 0; }).length,
    prev: (S.previsions || []).filter(function(d){ return ids.indexOf(d.rubrique) >= 0; }).length
  };
}

function ouvrirAssistantFusion(){

  });
  function cochees(p){ return p.sources.filter(function(r){ return choix[p.famille.id][r.id]; }).map(function(r){ return r.id; }); }
  function nbCochees(){ return props.reduce(function(t, p){ return t + cochees(p).length; }, 0); }

  function etapeChoix(){
    f.body.innerHTML = "";
    try{ f.sh.scrollTop = 0; }catch(e){}
    f.body.appendChild(el("p", "sub", "Regroupez vos rubriques en grandes familles. Décochez ce que vous voulez garder à part : rien ne change avant votre confirmation."));
    if(!props.length){
      var c0 = el("div", "card");

    props.forEach(function(p){
      var bloc = el("div", "assist");
      bloc.appendChild(el("div", "assist-t", "→ " + p.famille.icone + " " + p.famille.nom));
      var note = !p.cible ? "nouvelle rubrique"
               : (p.cible.nom !== p.famille.nom ? "« " + p.cible.nom + " » prendra ce nom" : "");
      if(note) bloc.appendChild(el("div", "tiny muted assist-n", note));
      p.sources.forEach(function(r){
        var b = el("button", "rub");
        b.type = "button";
        b.setAttribute("aria-pressed", choix[p.famille.id][r.id] ? "true" : "false");
        var ic = el("span", "ico", r.icone);
        ic.style.background = "var(--ico-bg)";
        ic.style.boxShadow = "inset 0 0 0 1px " + teinte(r.couleur) + "55";
        b.appendChild(ic);
        var t = el("span", "nom");
        t.appendChild(document.createTextNode(r.nom));
        var n = compterLignes([r.id]).dep;
        t.appendChild(el("span", "assist-m", (n ? n + (n > 1 ? " dépenses" : " dépense") : "aucune dépense")
          + " · budget " + fmtF(Number(r.montant) || 0)));
        b.appendChild(t);
        b.appendChild(el("span", "check", "✓"));
        b.addEventListener("click", function(){
          choix[p.famille.id][r.id] = !choix[p.famille.id][r.id];

          bSuite.disabled = nbCochees() === 0;
        });
        bloc.appendChild(b);
      });
      f.body.appendChild(bloc);
    });
    bSuite.disabled = nbCochees() === 0;
    barreFeuille(f, [bouton("btn btn-ghost", "Annuler", function(){ fermerFeuille(false); }), bSuite]);
  }

  function etapeConfirmation(){
    f.body.innerHTML = "";
    try{ f.sh.scrollTop = 0; }catch(e){}
    f.body.appendChild(el("h1", null, "Récapitulatif"));
    var choisies = props.filter(function(p){ return cochees(p).length; });
    choisies.forEach(function(p){
      var ids = cochees(p);
      var n = compterLignes(ids);
      var budget = (p.cible ? Number(p.cible.montant) || 0 : 0)
        + ids.reduce(function(t, id){ return t + (Number(rubriqueParId(id).montant) || 0); }, 0);

      c.appendChild(el("div", "tiny muted", ids.map(function(id){ return "« " + rubriqueParId(id).nom + " »"; }).join(", ")

      if(p.cible && p.cible.nom !== p.famille.nom){
        c.appendChild(el("div", "tiny muted", "« " + p.cible.nom + " » devient « " + p.famille.nom + " »."));
      }

    f.body.appendChild(el("p", "tiny muted", "Les cycles archivés ne changent pas. Les totaux restent identiques."));

/* ==============================================================
   SPRINT 6A — MISE À JOUR AUTOMATIQUE (mécanisme de la famille
   MonDjai, repris de Revente-E et Coiffure-8C, adapté à Salaire)
   Quand index.html ET sw.js sont remplacés sur GitHub (numéro de
   cache changé dans sw.js), le téléphone le détecte tout seul :
    - vérification à chaque ouverture et à chaque retour au premier
      plan (registration.update(), silencieux, ignoré hors ligne) ;
    - le nouveau service worker prend le contrôle (« controllerchange »)
      et la page se recharge UNE seule fois, seulement si c'est sans
      risque : Accueil, aucune feuille ouverte, aucun nouveau cycle en
      préparation, aucun champ en cours de saisie, aucun code entamé ;
    - sinon, une petite bannière propose « Mettre à jour », et le
      rechargement se fait au retour sur l'Accueil.
   Les données (localStorage, clé mondjai.v2) ne sont jamais touchées.
   ============================================================== */
var MAJ_CLE_SESSION = "mondjai_salaire_maj_auto";
var maj = {prete: false, rechargementLance: false};
var swRegistration = null;
var swControleurAuDemarrage = false;
/* Garde-fou anti-boucle : une page issue d'un rechargement automatique ne se
   recharge plus d'elle-même pendant 10 secondes (la bannière prend le relais). */
var pageIssueDunRechargementAuto = false;
try{ pageIssueDunRechargementAuto = sessionStorage.getItem(MAJ_CLE_SESSION) === "1"; }catch(e){}
if(pageIssueDunRechargementAuto){
  setTimeout(function(){
    try{ sessionStorage.removeItem(MAJ_CLE_SESSION); }catch(e){}
    pageIssueDunRechargementAuto = false;
  }, 10000);
}
function rechargementSansRisque(){
  if(feuille) return false;
  var actif = document.activeElement;
  if(actif && /^(INPUT|TEXTAREA|SELECT)$/.test(actif.tagName) && actif.value) return false;
  if(S.pin && !deverrouille) return !document.querySelector(".pt.on");
  return !!S.onboarded && vue === "dashboard" && !brouillonCycle;
}
function rechargerPourMaj(automatique){
  if(maj.rechargementLance) return;
  maj.rechargementLance = true;
  sauver();   /* tout est déjà enregistré à chaque action : simple précaution */
  try{ if(automatique) sessionStorage.setItem(MAJ_CLE_SESSION, "1"); }catch(e){}
  location.reload();
}

  var b = el("div");

/* Appelée après chaque rendu et à la prise de contrôle d'une nouvelle version */
function verifierMajEnAttente(){
  if(!maj || !maj.prete || maj.rechargementLance) return;
  if(!pageIssueDunRechargementAuto && rechargementSansRisque()){
    rechargerPourMaj(true);
    return;
  }
  afficherBanniereMaj();
}
function verifierMiseAJourSw(){
  if(!swRegistration) return;
  if(navigator.onLine === false) return;   /* hors ligne : rien à vérifier, aucune erreur */
  try{
    var p = swRegistration.update();
    if(p && typeof p.catch === "function") p.catch(function(){});
  }catch(e){}
}
function enregistrerServiceWorker(){
  if(!("serviceWorker" in navigator)) return;
  /* Premier lancement (aucun service worker ne contrôlait la page) : la prise
     de contrôle qui suit l'installation ne doit PAS recharger la page. */
  swControleurAuDemarrage = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", function(){
    if(!swControleurAuDemarrage){ swControleurAuDemarrage = true; return; }
    maj.prete = true;
    verifierMajEnAttente();
  });
  var demarrer = function(){
    navigator.serviceWorker.register("./sw.js").then(function(reg){
      swRegistration = reg;
      if(swControleurAuDemarrage) verifierMiseAJourSw();
    }).catch(function(){});
  };
  if(document.readyState === "complete") demarrer();
  else window.addEventListener("load", demarrer);
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible") verifierMiseAJourSw();
  });
}

/* ==============================================================
   SPRINT 6C — MON ÉTAT : Jour · Semaine · Mois
   Aucun calcul métier ne change : ce sont les mêmes dépenses et les mêmes
   revenus, regroupés par jour, par semaine (lundi à dimanche, première et
   dernière coupées aux bornes du cycle) et par cycle.
   ============================================================== */
var MOIS_ABR = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
var JOURS_NOM = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
var SEMAINES_AFFICHEES_MAX = 6;   /* un cycle de ~31 jours tient en 6 tronçons au plus */

function ajouterJours(s, n){ var d = deIso(s); d.setDate(d.getDate() + n); return iso(d); }
function lundiDe(s){ var d = deIso(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return iso(d); }
function dimancheDe(s){ return ajouterJours(lundiDe(s), 6); }
function jourMois(s){ var d = deIso(s); return d.getDate() + " " + MOIS_ABR[d.getMonth()]; }
function jourLong(s){ var d = deIso(s); return JOURS_NOM[d.getDay()] + " " + jourMois(s); }
function libelleSemaine(deb, fin){
  if(deb === fin) return jourLong(deb);
  var a = deIso(deb), b = deIso(fin);
  return a.getDate() + (a.getMonth() !== b.getMonth() ? " " + MOIS_ABR[a.getMonth()] : "") + " – " + jourMois(fin);
}
function lignesPeriode(deb, fin, liste){
  return (liste || S.depenses).filter(function(d){ return d.date >= deb && d.date <= fin; });
}
function totalPeriode(deb, fin, liste){
  return lignesPeriode(deb, fin, liste).reduce(function(t, d){ return t + (Number(d.montant) || 0); }, 0);
}
function premiereDonnee(){
  var m = null;
  S.depenses.forEach(function(d){ if(d.date && (m === null || d.date < m)) m = d.date; });
  return m;
}
function derniereDonnee(){
  var m = null;
  S.depenses.forEach(function(d){ if(d.date && (m === null || d.date > m)) m = d.date; });
  return m;
}
/* Bornes de navigation : de la première période contenant une donnée à la période en cours */
function borneBasse(){ return premiereDonnee() || aujourdhui(); }
function borneHaute(){ var d = derniereDonnee(); return (d && d > aujourdhui()) ? d : aujourdhui(); }
function clampJour(j){
  var b = borneBasse(), h = borneHaute();
  j = j || aujourdhui();
  return j < b ? b : (j > h ? h : j);
}
function debutEtat(){
  var p = premiereDonnee();
  return (p && p < S.cycleDebut) ? p : S.cycleDebut;
}
function finCycleEtat(){
  var f = aujourdhui();
  if(S.jourSalaire !== null && S.jourSalaire !== undefined) f = ajouterJours(iso(paieApres(S.cycleDebut)), -1);
  var der = derniereDonnee();
  if(der && der > f) f = der;
  return f;
}
/* Tronçons du cycle : jusqu'à la semaine de la dernière dépense (jamais de tronçon vide à la fin) */
function semainesDuCycle(){
  var der = derniereDonnee();
  if(!der) return [];
  var fin = finCycleEtat(), cur = debutEtat(), out = [];
  while(cur <= der){
    var dim = dimancheDe(cur);
    var f = dim < fin ? dim : fin;
    var l = lignesPeriode(cur, f);
    out.push({debut: cur, fin: f, nb: l.length,
              total: l.reduce(function(t, d){ return t + (Number(d.montant) || 0); }, 0)});
    cur = ajouterJours(dim, 1);
  }
  return out;
}

/* ==============================================================
   SPRINT 6C — MES HABITUDES (Semaine · Mois)
   Des barres fines en HTML/CSS, sans bibliothèque. Les lignes d'ajustement
   de caisse sont exclues. Titres neutres : on regarde, on ne classe pas.
   ============================================================== */
var habUI = {mode: "mois", jour: null};
function habAller(mode, jour){
  habUI.mode = mode;
  habUI.jour = clampJour(jour || aujourdhui());
  try{ history.replaceState({mdVue: "habitudes", mdHab: {mode: habUI.mode, jour: habUI.jour}}, ""); }catch(e){}
  render();
}
function barreHab(parent, nom, sous, montant, axe, couleur, repere){
  var l = el("div", "hb");
  var h = el("div", "hb-h");
  h.appendChild(el("span", "hb-n", nom));
  h.appendChild(el("span", "hb-m", fmtF(montant)));
  l.appendChild(h);
  if(sous) l.appendChild(el("div", "hb-s", sous));
  var tr = el("div", "hb-barre");
  var i = document.createElement("i");
  i.style.width = (axe > 0 ? Math.max(1, Math.min(100, montant / axe * 100)) : 0) + "%";
  i.style.background = couleur;
  tr.appendChild(i);
  if(repere > 0 && axe > 0){
    var m = document.createElement("b");
    m.style.left = Math.min(99, repere / axe * 100) + "%";
    m.setAttribute("aria-hidden", "true");
    tr.appendChild(m);
  }
  l.appendChild(tr);
  parent.appendChild(l);
}
function vueHabitudes(ec, ba){
  habUI.jour = clampJour(habUI.jour || aujourdhui());

  var deb, fin;
  if(habUI.mode === "semaine"){
    var l = lundiDe(habUI.jour), s = dimancheDe(l);
    var bas = lundiDe(borneBasse()), haut = lundiDe(borneHaute());
    deb = l; fin = s;
    ec.appendChild(navigationPeriode("Semaine du " + jourMois(l) + " au " + jourMois(s), "",
      l > bas ? function(){ habAller("semaine", ajouterJours(l, -7)); } : null,
      l < haut ? function(){ habAller("semaine", ajouterJours(l, 7)); } : null));
  }else{
    deb = debutEtat(); fin = finCycleEtat();
    var cy = el("p", "sub", "Cycle du " + jourMois(deb) + " au " + jourMois(fin));
    cy.style.marginTop = "-4px";
    ec.appendChild(cy);
  }
  var lignes = lignesPeriode(deb, fin, horsAjustements(S.depenses));
  var total = lignes.reduce(function(t, d){ return t + (Number(d.montant) || 0); }, 0);
  if(!lignes.length){
    var c0 = el("div", "card");
    c0.appendChild(el("div", "vide-msg", "Rien à montrer sur cette période pour l'instant."));
    ec.appendChild(c0);
    boutonPlus(ba, null);
    return;
  }

  /* info : le revenu régulier face aux dépenses (jamais au-delà de 100 %) */
  var reg = revenuRegulier();
  if(habUI.mode === "mois" && reg > 0 && total > 0){
    var x = Math.floor(reg / total * 100);
    var info = el("div", "hb-info", x >= 100 ? "Le revenu régulier couvre l'ensemble des dépenses."
                                              : "Le revenu régulier couvre " + x + NBSP + "% des dépenses.");
    info.setAttribute("data-test", "hab-couverture");
    ec.appendChild(info);
  }

  /* Par rubrique */
  var parRub = {};
  lignes.forEach(function(d){
    var k = d.rubrique || "";
    parRub[k] = (parRub[k] || 0) + (Number(d.montant) || 0);
  });
  var rows = Object.keys(parRub).map(function(k){
    var r = rubriqueParId(k);
    return {r: r, total: parRub[k], budget: (r && habUI.mode === "mois") ? (Number(r.montant) || 0) : 0};
  }).sort(function(a, b){ return b.total - a.total; });
  var axe = rows.reduce(function(m, x){ return Math.max(m, x.total, x.budget); }, 0);
  ec.appendChild(el("h2", null, "Par rubrique"));
  var cR = el("div", "card");
  cR.setAttribute("data-test", "hab-rubriques");
  rows.forEach(function(x){
    var sous = habUI.mode === "mois" ? (x.budget > 0 ? "sur " + fmtF(x.budget) : "Sans enveloppe") : "";
    barreHab(cR, x.r ? x.r.icone + " " + x.r.nom : "Autre", sous, x.total, axe, x.r ? teinte(x.r.couleur) : "var(--muted)", x.budget);
  });
  if(habUI.mode === "mois") cR.appendChild(el("p", "hb-note", "Le trait vertical marque l'enveloppe."));
  ec.appendChild(cR);

  /* Par étiquette (dès 2 étiquettes différentes) */
  var parEt = regrouper(lignes, "etiquette");
  var avecEt = parEt.filter(function(x){ return x.cle; });
  if(avecEt.length >= 2){
    avecEt.sort(function(a, b){ return b.total - a.total; });
    var sans = parEt.filter(function(x){ return !x.cle; });
    var tous = avecEt.concat(sans);
    var axeE = tous.reduce(function(m, x){ return Math.max(m, x.total); }, 0);
    ec.appendChild(el("h2", null, "Par étiquette"));
    var cE = el("div", "card");
    cE.setAttribute("data-test", "hab-etiquettes");
    tous.forEach(function(x){
      barreHab(cE, x.cle ? x.nom : "Sans étiquette", x.nb + (x.nb > 1 ? " dépenses" : " dépense"), x.total, axeE, "var(--gold-fill)", 0);
    });
    ec.appendChild(cE);
  }

  /* Par personne (si le champ est utilisé) : ordre alphabétique, jamais un classement */
  var parPers = regrouper(lignes, "pour").filter(function(x){ return x.cle; });
  if(parPers.length){
    parPers.sort(function(a, b){ return a.nom.localeCompare(b.nom, "fr", {sensitivity: "base"}); });
    var axeP = parPers.reduce(function(m, x){ return Math.max(m, x.total); }, 0);
    ec.appendChild(el("h2", null, "Par personne"));
    var cP = el("div", "card");
    cP.setAttribute("data-test", "hab-personnes");
    parPers.forEach(function(x){
      barreHab(cP, x.nom, x.nb + (x.nb > 1 ? " dépenses" : " dépense"), x.total, axeP, "var(--bleu)", 0);
    });
    ec.appendChild(cP);
  }

  /* Les 5 plus grosses dépenses */
  var gros = lignes.slice().sort(function(a, b){
    return (Number(b.montant) || 0) - (Number(a.montant) || 0) || (a.date < b.date ? 1 : -1);
  }).slice(0, 5);
  ec.appendChild(el("h2", null, "Les 5 plus grosses dépenses"));
  var cG = el("div", "card");
  cG.setAttribute("data-test", "hab-grosses");
  gros.forEach(function(d){ cG.appendChild(ligneDepense(d, true)); });
  ec.appendChild(cG);

  boutonPlus(ba, null);
}

/* ==============================================================
   SPRINT 6D — ACCOMPAGNEMENT
   L'application accompagne, elle n'ordonne pas : chaque proposition se
   refuse ou se modifie en un tap, ne bloque jamais, ne se répète pas pour
   la même raison, et se désactive dans Réglages. Aucune notification
   externe : tout s'affiche à l'ouverture, 100 % hors ligne.
   Seuils : constantes nommées ci-dessous (aucun n'est calibré sur une personne).
   ============================================================== */
var PART_PCT_DEFAUT = 10;          /* % proposé par défaut (0 = ne plus proposer) */
var PART_PCT_MAX = 50, PART_PCT_PAS = 5;
var PART_CHOIX_PCT = [5, 10, 20, 30];
var PART_ARRONDI = 500;            /* arrondi inférieur du montant proposé */
var PART_MIN = 1000;               /* aucune proposition en dessous */
var RYTHME_JOURS = 7;              /* fenêtre de calcul du rythme */
var RYTHME_MIN_CYCLE = 5;          /* le cycle doit durer depuis au moins N jours */
var RYTHME_MIN_DEPENSES = 3;       /* au moins N dépenses sur la fenêtre */
var RYTHME_MARGE_PAIE = 3;         /* la date projetée précède la paie d'au moins N jours */
var RYTHME_MASQUE_JOURS = 3;
var RAPPEL_JOURS = 3;              /* « rien noté depuis N jours » */
var RAPPEL_MIN_CYCLE = 5;
var POINT_JOURS = 3;               /* « Faire le point ? » dans les N derniers jours avant la paie */
var JOURS_SANS_MAX = 400;          /* taille maximale de joursSansDepense */

function ecartJours(a, b){          /* b − a, en jours calendaires (ISO) */
  var da = deIso(a), db = deIso(b);
  da.setHours(12, 0, 0, 0); db.setHours(12, 0, 0, 0);
  return Math.round((db.getTime() - da.getTime()) / 86400000);
}
function jjmm(s){ var d = deIso(s); return p2(d.getDate()) + "/" + p2(d.getMonth() + 1); }

/* ---------- 1. mise de côté sur un revenu exceptionnel ---------- */
var filePart = [];                  /* ids de revenus à proposer, remplie par un enregistrement explicite */
function pctPart(){
  var p = Number(reglage("partCotePct"));
  if(!(p >= 0)) p = PART_PCT_DEFAUT;
  return Math.min(PART_PCT_MAX, Math.round(p));
}
function montantPart(montantRevenu, pct){
  return Math.floor((Number(montantRevenu) || 0) * pct / 100 / PART_ARRONDI) * PART_ARRONDI;
}
/* Proposition pour un revenu, ou null. Plafonnée à « Il vous reste ». */
function propositionPart(rev, pct){
  if(!rev || natureDe(rev) !== "exceptionnel" || estAjustement(rev) || rev.partProposee === true) return null;
  if(pct === undefined) pct = pctPart();
  if(!(pct > 0)) return null;
  var m = montantPart(rev.montant, pct);
  var reste = disponible();
  if(m > reste) m = Math.floor(reste);
  if(m < PART_MIN) return null;
  return {pct: pct, montant: m};
}
function enfilerPart(rev){
  if(rev && natureDe(rev) === "exceptionnel" && !estAjustement(rev) && rev.partProposee !== true
     && (Number(rev.montant) || 0) > 0 && filePart.indexOf(rev.id) < 0) filePart.push(rev.id);
}
function rubriquesEpargneActives(){ return actives().filter(estEpargne); }
function assurerEpargneActive(){
  var r = rubriqueParId("epargnetont");
  if(!r){
    for(var i = 0; i < S.rubriques.length; i++){ if(estEpargne(S.rubriques[i])){ r = S.rubriques[i]; break; } }
  }
  if(!r){
    r = {id: "epargnetont", nom: "Épargne & imprévus", icone: "🐖", couleur: "#3FB27F",
         groupe: GROUPE_EPARGNE, active: true, montant: 0, perso: true, periodicite: "mensuel", montantReel: 0};
    S.rubriques.push(r);
  }
  r.active = true;
  return r;
}
/* Ouvre la feuille pour le premier revenu de la file qui mérite une proposition */
function proposerPartSuivante(){
  if(feuille || !filePart.length) return;
  if(["revenus", "rubriques", "repartition", "nouveauCycle", "bienvenue"].indexOf(vue) >= 0 || !S.onboarded) return;
  while(filePart.length){
    var id = filePart.shift();
    var rev = null;
    S.revenus.forEach(function(r){ if(r.id === id) rev = r; });
    var prop = propositionPart(rev);
    if(prop){ ouvrirPart(rev, prop); return; }
  }
}
function ouvrirPart(rev, prop){
  rev.partProposee = true;          /* une seule fois pour ce revenu */
  sauver();
  var f = creerFeuille("Un revenu en plus. Mettre une part de côté ?");
  f.titre.style.whiteSpace = "normal"; f.titre.style.lineHeight = "1.25";

  c.appendChild(el("div", "lab tiny muted", (rev.libelle || "REVENU").toUpperCase()));
  c.appendChild(el("div", "big", fmtF(Number(rev.montant) || 0)));
  f.body.appendChild(c);

  var fP = el("div", "field");
  fP.appendChild(el("label", null, "Part à mettre de côté"));
  var chips = el("div", "chips-theme");

    b.setAttribute("data-pct", String(p));
    b.setAttribute("aria-pressed", p === pct ? "true" : "false");
    b.addEventListener("click", function(){
      pct = p;
      montant = Math.min(montantPart(rev.montant, p), Math.max(0, Math.floor(disponible())));
      im.value = montant > 0 ? fmt(montant) : "";
      chips.querySelectorAll(".chip").forEach(function(x){ x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
      maj();
    });
    chips.appendChild(b);

  fP.appendChild(chips);
  f.body.appendChild(fP);

  var fM = el("div", "field");
  var lab = el("label", null, "Montant");
  lab.setAttribute("for", "part-montant");
  fM.appendChild(lab);
  var im = document.createElement("input");
  im.type = "text"; im.inputMode = "numeric"; im.id = "part-montant";
  im.className = "montant-xl"; im.setAttribute("autocomplete", "off");
  im.value = montant > 0 ? fmt(montant) : "";
  fM.appendChild(im);
  f.body.appendChild(fM);
  f.body.appendChild(el("div", "devise", "FRANCS CFA"));
  im.addEventListener("input", function(){
    montant = chiffres(im.value);
    im.value = montant > 0 ? fmt(montant) : "";
    chips.querySelectorAll(".chip").forEach(function(x){ x.setAttribute("aria-pressed", "false"); });
    maj();

  /* destination : rubriques d'épargne actives */
  var zoneDest = el("div", "field");
  f.body.appendChild(zoneDest);
  var eps = rubriquesEpargneActives();
  if(eps.length){
    dest = eps[0].id;
    zoneDest.appendChild(el("label", null, "Où ?"));
    var wD = el("div", "chips-theme");
    eps.forEach(function(r, i){
      var b = el("button", "chip", r.icone + " " + r.nom);
      b.type = "button";
      b.setAttribute("data-dest", r.id);
      b.setAttribute("aria-pressed", i === 0 ? "true" : "false");
      b.addEventListener("click", function(){
        dest = r.id;
        wD.querySelectorAll(".chip").forEach(function(x){ x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
      });
      wD.appendChild(b);

    zoneDest.appendChild(wD);
  }else{
    zoneDest.appendChild(el("p", "small muted", "Aucune rubrique d'épargne n'est active."));
    var bAct = el("button", "btn btn-line", "Activer « Épargne & imprévus »");
    bAct.type = "button";
    bAct.addEventListener("click", function(){
      var r = assurerEpargneActive(); sauver(); dest = r.id;
      zoneDest.innerHTML = "";
      zoneDest.appendChild(el("p", "small c-vert", r.icone + " " + r.nom + " activée ✓"));
      maj();

  var note = el("p", "tiny muted", "");

  var bPas = el("button", "btn btn-ghost", "Pas cette fois"); bPas.type = "button";
  var bNon = el("button", "btn btn-ghost", "Ne plus proposer"); bNon.type = "button";
  rb.appendChild(bPas); rb.appendChild(bNon);
  inn.appendChild(bOk); inn.appendChild(rb);
  bar.appendChild(inn); f.sh.appendChild(bar);
  function maj(){
    bOk.disabled = !(montant > 0 && dest);
    note.textContent = "Il vous restera " + fmtF(Math.max(0, disponible() - montant)) + " après.";
  }
  bOk.addEventListener("click", function(){
    if(!(montant > 0 && dest)) return;
    S.depenses.push({id: uid(), rubrique: dest, montant: montant,
                     libelle: "Part du revenu · " + (rev.libelle || "revenu"),
                     date: aujourdhui(), cree: Date.now()});

    toast(fmtF(montant) + " mis de côté 👏");
  });

  bNon.addEventListener("click", function(){
    regler("partCotePct", 0);
    fermerFeuille(false);
    toast("Réactivable dans Réglages › Mise de côté");
  });
  maj();
}

/* ---------- 2. indication de rythme ---------- */
function rythmeInfo(){
  if(!reglage("alerteRythme")) return null;
  var auj = aujourdhui();
  var masque = reglage("rythmeMasqueJusqua");
  if(typeof masque === "string" && masque && auj < masque) return null;
  var reste = disponible();
  if(!(reste > 0)) return null;
  if(!S.cycleDebut || ecartJours(S.cycleDebut, auj) < RYTHME_MIN_CYCLE) return null;
  var debut = ajouterJours(auj, -(RYTHME_JOURS - 1));
  var lignes = horsAjustements(S.depenses).filter(function(d){
    return d.date >= debut && d.date <= auj && !estEpargne(rubriqueParId(d.rubrique));
  });
  if(lignes.length < RYTHME_MIN_DEPENSES) return null;
  var total = lignes.reduce(function(t, d){ return t + (Number(d.montant) || 0); }, 0);
  var rythme = total / RYTHME_JOURS;
  if(!(rythme > 0)) return null;
  var jours = Math.floor(reste / rythme);
  var jp = joursAvantPaie();
  if(jp === null || jours > jp - RYTHME_MARGE_PAIE) return null;
  return {rythme: rythme, jours: jours, date: ajouterJours(auj, jours)};
}
function carteRythme(parent){
  var r = rythmeInfo();
  if(!r) return;
  var w = el("div", "rythme");
  w.setAttribute("data-test", "rythme");
  w.appendChild(el("span", "r-m", "À ce rythme, il vous restera 0 F vers le " + jjmm(r.date)));
  w.appendChild(el("span", "tiny muted", "indicatif"));
  var b = el("button", "lien-pt", "Masquer");
  b.type = "button";
  b.addEventListener("click", function(){
    regler("rythmeMasqueJusqua", ajouterJours(aujourdhui(), RYTHME_MASQUE_JOURS));
    render();
  });
  w.appendChild(b);
  parent.appendChild(w);
}

/* ---------- 3. rappel doux de saisie et point de fin de cycle ---------- */
function dernierEnregistrement(){
  var der = S.cycleDebut || aujourdhui();
  S.depenses.forEach(function(d){ if(d.date && d.date > der && d.date <= aujourdhui()) der = d.date; });
  (S.joursSansDepense || []).forEach(function(j){ if(j > der && j <= aujourdhui()) der = j; });
  return der;
}
function rappelSaisieDu(){
  if(!reglage("rappelAbsence") || !S.onboarded) return null;
  var auj = aujourdhui();
  if(!S.cycleDebut || ecartJours(S.cycleDebut, auj) < RAPPEL_MIN_CYCLE) return null;
  var der = dernierEnregistrement();
  var n = ecartJours(der, auj);
  return n >= RAPPEL_JOURS ? {depuis: der, jours: n} : null;
}
function marquerRienANoter(depuis){
  var liste = (S.joursSansDepense || []).slice();
  var j = ajouterJours(depuis, 1), auj = aujourdhui(), garde = 0;
  while(j <= auj && garde < 62){
    if(liste.indexOf(j) < 0) liste.push(j);
    j = ajouterJours(j, 1); garde++;
  }
  liste.sort();
  S.joursSansDepense = liste.slice(-JOURS_SANS_MAX);
  sauver();
}
function pointDeFinDu(){
  if(!reglage("rappelAbsence") || !S.onboarded) return false;
  var jp = joursAvantPaie();
  if(jp === null || jp > POINT_JOURS) return false;
  if(reglage("pointVuCycle") === S.cycleId) return false;
  return Math.round(disponible()) !== 0;
}
function cartesAccompagnement(parent){
  var rap = rappelSaisieDu();
  if(rap){
    var a = el("div", "avis");
    a.setAttribute("data-test", "rappel-saisie");
    a.appendChild(el("div", "avis-t", "Rien noté depuis " + motJours(rap.jours) + ". Rien à noter ?"));
    var rb = el("div", "row-btns");
    var bR = el("button", "btn btn-ghost", "Rien à noter"); bR.type = "button";
    bR.addEventListener("click", function(){ marquerRienANoter(rap.depuis); render(); toast("C'est noté ✓"); });
    var bA = el("button", "btn btn-primary", "Ajouter une dépense"); bA.type = "button";
    bA.addEventListener("click", function(){ ouvrirDepense({rubrique: null}); });
    rb.appendChild(bR); rb.appendChild(bA);
    a.appendChild(rb);
    parent.appendChild(a);
  }
  if(pointDeFinDu()){
    var p = el("div", "avis");
    p.setAttribute("data-test", "point-fin");
    p.appendChild(el("div", "avis-t", "Faire le point ?"));
    p.appendChild(el("p", "avis-p", "La paie approche. Comparez avec l'argent réellement disponible."));
    var rp = el("div", "row-btns");
    var bL = el("button", "btn btn-ghost", "Pas maintenant"); bL.type = "button";
    bL.addEventListener("click", function(){ regler("pointVuCycle", S.cycleId); render(); });
    var bP = el("button", "btn btn-primary", "Ajuster mon solde"); bP.type = "button";
    bP.addEventListener("click", ouvrirAjustement);
    rp.appendChild(bL); rp.appendChild(bP);
    p.appendChild(rp);
    parent.appendChild(p);
  }
}

/* ---------- 4. échéances des charges fixes ---------- */
function echeanceDe(r){
  var e = r ? Number(r.echeance) : 0;
  return (e >= 1 && e <= 31) ? Math.round(e) : 0;
}
function dateEcheance(jour, aPartirDe){      /* première occurrence du jour du mois, à partir de la date donnée */
  var d = deIso(aPartirDe);
  for(var k = 0; k < 3; k++){
    var an = d.getFullYear(), mo = d.getMonth() + k;
    var dernier = new Date(an, mo + 1, 0).getDate();
    var c = new Date(an, mo, Math.min(jour, dernier));
    if(iso(c) >= aPartirDe) return iso(c);
  }
  return aPartirDe;
}
/* Prévisions du nouveau cycle : seulement si la rubrique n'a encore ni dépense ni prévision */
function creerEcheances(debutIso){
  var n = 0;
  S.rubriques.forEach(function(r){
    if(!r.active || r.groupe !== "Fixes" || !echeanceDe(r)) return;
    var m = Number(r.montant) || 0;
    if(!(m > 0)) return;
    var deja = S.depenses.some(function(d){ return d.rubrique === r.id; })
            || (S.previsions || []).some(function(p){ return p.rubrique === r.id; });
    if(deja) return;
    S.previsions.push({id: uid(), rubrique: r.id, montant: m, libelle: "Échéance",
                       date: dateEcheance(echeanceDe(r), debutIso || aujourdhui()), cree: Date.now()});
    n++;
  });
  return n;
}

   On réécrit tout de suite l'état migré : même si l'utilisateur
   ne touche à rien, ses données anciennes sont déjà au format
   des cycles, sans qu'il ait rien vu ni rien perdu. */
appliquerTheme();
sauver();
