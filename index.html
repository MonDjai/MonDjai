<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<script>
/* ==============================================================
   Données durables (Salaire-6B.1 / Coiffure-8D.1)
   Aucune donnée n'est envoyée nulle part : tout reste sur le téléphone.
   1. Demande au navigateur de ne pas effacer les données de l'appli
      (navigator.storage.persist) quand c'est possible sans question.
   2. Garde une copie de secours de l'état dans IndexedDB (autre coffre
      que localStorage), mise à jour après chaque enregistrement.
   3. Au démarrage, si l'état principal a disparu ou est illisible alors
      que la copie existe, la remet en place toute seule (une fois).
   Les mises à jour de l'appli (index.html, sw.js) ne touchent jamais
   à localStorage : seule une action sur le téléphone peut l'effacer.
   La clé de stockage n'est PAS modifiée.
   ============================================================== */
(function(){
  var CLE = "mondjai.v2", BD = "mondjai_salaire_secours", MAG = "copie", ENR = "etat", DRAPEAU = "mondjai_restauration_auto:" + CLE, INFO = "mondjai_restauration_info:" + CLE;
  var racine = document.documentElement;
  var MD = window.MDStock = { pret:false, persistant:null, copie:null, derniere:null, restaure:false };

  function etatPrincipalOk(){
    try{
      var b = localStorage.getItem(CLE);
      if(!b) return false;
      var o = JSON.parse(b);
      return !!o && typeof o === "object";
    }catch(e){ return false; }
  }
  function valide(txt){
    try{ var o = JSON.parse(txt); return !!o && typeof o === "object" && !Array.isArray(o); }catch(e){ return false; }
  }

  /* --- IndexedDB, version « callback » (aucune dépendance) --- */
  function ouvrir(ok, ko){
    var req;
    try{ req = window.indexedDB.open(BD, 1); }catch(e){ ko(e); return; }
    req.onupgradeneeded = function(){ try{ req.result.createObjectStore(MAG); }catch(e){} };
    req.onsuccess = function(){ ok(req.result); };
    req.onerror = req.onblocked = function(){ ko(req.error); };
  }
  function lire(ok, ko){
    ouvrir(function(db){
      try{
        var r = db.transaction(MAG, "readonly").objectStore(MAG).get(ENR);
        r.onsuccess = function(){ var v = r.result; db.close(); ok(v || null); };
        r.onerror = function(){ db.close(); ko(r.error); };
      }catch(e){ try{ db.close(); }catch(x){} ko(e); }
    }, ko);
  }
  function ecrire(txt, fini){
    ouvrir(function(db){
      try{
        var tx = db.transaction(MAG, "readwrite");
        tx.objectStore(MAG).put({texte: txt, date: Date.now()}, ENR);
        tx.oncomplete = function(){ db.close(); MD.copie = true; MD.derniere = new Date(); if(fini) fini(true); };
        tx.onerror = tx.onabort = function(){ try{ db.close(); }catch(x){} MD.copie = false; if(fini) fini(false); };
      }catch(e){ try{ db.close(); }catch(x){} MD.copie = false; if(fini) fini(false); }
    }, function(){ MD.copie = false; if(fini) fini(false); });
  }

  /* --- copie de secours : lit l'état principal au moment d'écrire --- */
  var minuteur = null;
  function copierMaintenant(){
    minuteur = null;
    if(!MD.pret) return;
    var txt = null;
    try{ txt = localStorage.getItem(CLE); }catch(e){}
    if(txt && valide(txt)) ecrire(txt);
  }
  MD.miroir = function(){
    if(!MD.pret || minuteur) return;
    minuteur = setTimeout(copierMaintenant, 500);
  };
  MD.vider = function(){ if(minuteur){ clearTimeout(minuteur); copierMaintenant(); } };
  document.addEventListener("visibilitychange", function(){ if(document.visibilityState === "hidden") MD.vider(); });
  window.addEventListener("pagehide", MD.vider);

  /* --- stockage durable, sans jamais déranger l'utilisateur --- */
  function demanderDurable(){
    try{
      if(!(navigator.storage && navigator.storage.persist && navigator.storage.persisted)) return;
      navigator.storage.persisted().then(function(deja){
        if(deja){ MD.persistant = true; return; }
        var ua = navigator.userAgent || "";
        var installee = false;
        try{ installee = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true; }catch(e){}
        /* Firefox pose une question à l'utilisateur : on ne la déclenche pas. */
        if(/Firefox\//.test(ua) && !installee){ MD.persistant = false; return; }
        return navigator.storage.persist().then(function(ok){ MD.persistant = !!ok; });
      }).catch(function(){});
    }catch(e){}
  }
  MD.verifierDurable = demanderDurable;
  demanderDurable();

  /* Après une restauration automatique : un seul message, discret. */
  window.addEventListener("load", function(){
    var info = null;
    try{ info = sessionStorage.getItem(INFO); }catch(e){}
    if(!info) return;
    try{ sessionStorage.removeItem(INFO); sessionStorage.removeItem(DRAPEAU); }catch(e){}
    var b = document.createElement("div");
    b.setAttribute("role", "status");
    b.textContent = "✓ Vos données ont été retrouvées automatiquement.";
    b.style.cssText = "position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:2147483000;" +
      "background:#1F2632;color:#ECEFF5;border:1px solid #3FB27F;border-radius:12px;padding:12px 14px;" +
      "font:700 14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.35);";
    document.body.appendChild(b);
    setTimeout(function(){ if(b.parentNode) b.parentNode.removeChild(b); }, 6000);
  });

  /* --- démarrage --- */
  if(!window.indexedDB){ MD.copie = false; return; }

  function terminer(){
    MD.pret = true;
    racine.style.visibility = "";
    MD.miroir();
  }

  if(etatPrincipalOk()){
    /* Tout va bien : on s'assure seulement que la copie existe et est à jour. */
    MD.pret = true;
    setTimeout(function(){ MD.miroir(); }, 800);
    return;
  }

  /* L'état principal manque (premier lancement, ou effacé par le téléphone) :
     on regarde si une copie de secours existe, sans montrer l'écran d'accueil
     entre-temps. */
  racine.style.visibility = "hidden";
  var securite = setTimeout(function(){ racine.style.visibility = ""; }, 2500);
  lire(function(v){
    clearTimeout(securite);
    var dejaEssaye = false;
    try{ dejaEssaye = sessionStorage.getItem(DRAPEAU) === "1"; }catch(e){}
    if(v && v.texte && valide(v.texte) && !dejaEssaye){
      var ecrit = false;
      try{
        localStorage.setItem(CLE, v.texte);
        ecrit = localStorage.getItem(CLE) === v.texte;
      }catch(e){}
      if(ecrit){
        MD.restaure = true;
        try{ sessionStorage.setItem(DRAPEAU, "1"); }catch(e){}
        try{ sessionStorage.setItem(INFO, "1"); }catch(e){}
        location.reload();
        return;
      }
    }
    MD.copie = !!v;
    terminer();
  }, function(){
    clearTimeout(securite);
    MD.copie = false;
    racine.style.visibility = "";
    /* copie illisible : on ne l'écrasera pas avant d'en savoir plus */
  });
})();
</script>
<script>
/* Sprint 6C — thème posé AVANT le premier affichage : aucun éclair au démarrage,
   au rechargement de mise à jour ni à l'écran du code d'accès. Lit seulement le
   choix enregistré (reglages.theme : 'clair' | 'auto' | 'sombre' ; absent = 'clair').
   Aucun appel réseau. */
(function(){
  var t = "clair";
  try{
    var s = JSON.parse(localStorage.getItem("mondjai.v2") || "null");
    var c = s && s.reglages && typeof s.reglages === "object" ? s.reglages.theme : null;
    if(c === "sombre") t = "sombre";
    else if(c === "auto" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) t = "sombre";
  }catch(e){}
  document.documentElement.setAttribute("data-theme", t);
  var m = document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute("content", t === "sombre" ? "#0F1218" : "#141922");
})();
</script>
<style>
/* ============================================================
   MonDjai — feuille de style (tout est dans ce fichier)
   ============================================================ */
:root{
  color-scheme:dark;
  --bg:#0F1218;
  --surface:#171C25;
  --surface-2:#1F2632;
  --line:#2A323F;
  --text:#ECEFF5;
  --muted:#98A2B4;
  --gold:#F2A93B;            /* ambre « texte » */
  --gold-fill:#F2A93B;       /* ambre « remplissage » : boutons, jauges, coches */
  --on-gold:#141414;         /* texte posé sur l'ambre de remplissage */
  --gold-soft:rgba(242,169,59,.13);
  --gold-bd3:rgba(242,169,59,.3);
  --gold-bd35:rgba(242,169,59,.35);
  --gold-bd45:rgba(242,169,59,.45);
  --gold-bd5:rgba(242,169,59,.5);
  --green:#3FB27F;
  --green-soft:rgba(63,178,127,.13);
  --green-bd3:rgba(63,178,127,.3);
  --green-bd35:rgba(63,178,127,.35);
  --orange:#E8901F;
  --orange-soft:rgba(232,144,31,.14);
  --orange-bd3:rgba(232,144,31,.3);
  --red:#E5484D;
  --red-soft:rgba(229,72,77,.13);
  --red-bd3:rgba(229,72,77,.3);
  --red-bd35:rgba(229,72,77,.35);
  --red-bd4:rgba(229,72,77,.4);
  --bleu:#5B9BD5;
  --bleu-soft:rgba(91,155,213,.14);
  --bleu-bd3:rgba(91,155,213,.3);
  --header-bg:rgba(15,18,24,.92);
  --header-bd:var(--line);
  --sticky-bg:rgba(15,18,24,.94);
  --nav-bg:rgba(15,18,24,.96);
  --sheet-top-bg:rgba(15,18,24,.96);
  --mark:var(--text);
  --mark-em:var(--gold);
  --eyebrow:var(--muted);
  --hd-btn-bg:var(--surface-2);
  --hd-btn-bd:var(--line);
  --hd-btn-text:var(--text);
  --ombre-pop:0 8px 24px rgba(0,0,0,.45);
  --ombre-carte:none;
  --hachure:rgba(255,255,255,.06);
  --ico-bg:rgba(255,255,255,.05);
  --ph:#8b93a1;
  --r:14px;
  --pad:16px;
  --clavier:0px;
  --navh:0px;
}
/* Thème clair « bandeau MonDjai » : mêmes noms de variables, autres valeurs */
html[data-theme="clair"]{
  color-scheme:light;
  --bg:#eff1f4;
  --surface:#ffffff;
  --surface-2:#f3f5f8;
  --line:#e3e6eb;
  --text:#151a22;
  --muted:#5a6372;
  --gold:#9a5a00;
  --gold-fill:#f5a623;
  --on-gold:#1b1200;
  --gold-soft:rgba(245,166,35,.10);
  --gold-bd3:rgba(154,90,0,.28);
  --gold-bd35:rgba(154,90,0,.32);
  --gold-bd45:rgba(154,90,0,.4);
  --gold-bd5:rgba(154,90,0,.5);
  --green:#137a52;
  --green-soft:rgba(19,122,82,.1);
  --green-bd3:rgba(19,122,82,.3);
  --green-bd35:rgba(19,122,82,.35);
  --orange:#a85a00;
  --orange-soft:rgba(168,90,0,.1);
  --orange-bd3:rgba(168,90,0,.3);
  --red:#c4382c;
  --red-soft:rgba(196,56,44,.09);
  --red-bd3:rgba(196,56,44,.3);
  --red-bd35:rgba(196,56,44,.35);
  --red-bd4:rgba(196,56,44,.4);
  --bleu:#2b5bc0;
  --bleu-soft:rgba(43,91,192,.09);
  --bleu-bd3:rgba(43,91,192,.3);
  --header-bg:#141922;
  --header-bd:#141922;
  --sticky-bg:rgba(255,255,255,.96);
  --nav-bg:#ffffff;
  --sheet-top-bg:rgba(255,255,255,.96);
  --mark:#ffffff;
  --mark-em:#f5a623;
  --eyebrow:#b4bcc9;
  --hd-btn-bg:rgba(255,255,255,.1);
  --hd-btn-bd:rgba(255,255,255,.22);
  --hd-btn-text:#ffffff;
  --ombre-pop:0 8px 24px rgba(20,25,34,.2);
  --ombre-carte:0 1px 2px rgba(20,25,34,.05),0 6px 18px rgba(20,25,34,.05);
  --hachure:rgba(20,25,34,.07);
  --ico-bg:rgba(20,25,34,.05);
  --ph:#5a6372;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}

/* --- structure --- */
.app{max-width:560px;margin:0 auto;padding:0 var(--pad)}
header.top{
  position:sticky;top:0;z-index:20;background:var(--header-bg);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--header-bd);
  padding-top:env(safe-area-inset-top);
}
.top-in{max-width:560px;margin:0 auto;padding:12px var(--pad);display:flex;align-items:baseline;gap:10px}
.mark{font-weight:800;letter-spacing:-.03em;font-size:19px;color:var(--mark)}
.mark em{font-style:normal;color:var(--mark-em)}
.eyebrow{
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--eyebrow);
  font-weight:700;margin-left:auto
}
main{padding-top:20px;padding-bottom:calc(120px + var(--navh))}
body.avec-onglets main{padding-bottom:calc(120px + var(--navh) + 78px)}

h1{font-size:24px;line-height:1.2;letter-spacing:-.02em;margin:0 0 6px;font-weight:800}
.sub{color:var(--muted);font-size:14px;margin:0 0 22px}
h2{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px;font-weight:700}

/* --- blocs --- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card + .card{margin-top:10px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.big{font-size:30px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}

/* --- boutons --- */
.btn{
  border:1px solid var(--line);background:var(--surface-2);color:var(--text);
  border-radius:11px;padding:12px 14px;font-weight:600;font-size:15px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%
}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--gold-fill);color:var(--on-gold);border-color:var(--gold-fill);font-weight:700}
.btn-primary[disabled]{opacity:.35;pointer-events:none}
.btn-ghost{background:transparent}
.btn-line{width:auto;padding:9px 12px;font-size:14px;border-radius:10px}
.btn-danger{color:var(--red);border-color:var(--red-bd35);background:transparent}
.row-btns{display:flex;gap:8px}
.row-btns .btn{flex:1}

/* --- jour de salaire --- */
.jours{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.jour{
  border:1px solid var(--line);background:var(--surface);border-radius:9px;
  padding:0;height:40px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)
}
.jour[aria-pressed="true"]{background:var(--gold-fill);border-color:var(--gold-fill);color:var(--on-gold);font-weight:800}
.jour-dernier{margin-top:8px}
.jour-dernier[aria-pressed="true"]{background:var(--gold-fill);border-color:var(--gold-fill);color:var(--on-gold)}

/* --- champs --- */
.ligne{
  display:flex;align-items:center;gap:10px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:8px
}
.ligne .lib{
  flex:1;min-width:0;background:transparent;border:0;padding:6px 0;font-size:15px;font-weight:600
}
.ligne .lib::placeholder{color:var(--muted);font-weight:500}

/* --- Sprint 5B : date propre à un revenu (jamais celle du salaire) --- */
.champ-date{
  display:flex;align-items:center;gap:8px;margin:-4px 0 8px 4px
}
.champ-date .input-date{
  background:var(--surface-2);border:1px solid var(--line);border-radius:9px;
  padding:6px 8px;font-size:13px;color:var(--text)
}

.money{
  width:130px;text-align:right;background:var(--surface-2);border:1px solid var(--line);
  border-radius:9px;padding:9px 10px;font-variant-numeric:tabular-nums;font-weight:700;font-size:15px
}
.money:focus{border-color:var(--gold);outline:none}
.money.vide{color:var(--muted);font-weight:600}
.del{
  background:transparent;border:0;color:var(--muted);font-size:20px;line-height:1;
  padding:6px 2px;width:28px;flex:none
}
.total-ligne{display:flex;align-items:baseline;justify-content:space-between;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}

/* --- menu ajout revenu --- */
.menu{margin-top:8px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.menu button{display:block;width:100%;text-align:left;background:transparent;border:0;padding:13px 14px;font-size:15px}
.menu button + button{border-top:1px solid var(--line)}

/* --- rubriques --- */
.rub{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:11px 12px;margin-bottom:8px
}
.rub[aria-pressed="true"]{border-color:var(--gold-bd5);background:var(--gold-soft)}
.ico{
  width:36px;height:36px;flex:none;border-radius:10px;display:grid;place-items:center;
  font-size:18px;background:var(--surface-2)
}
.rub .nom{flex:1;min-width:0;font-weight:600;font-size:15px;white-space:normal;word-break:break-word}
.check{
  width:22px;height:22px;flex:none;border-radius:7px;border:1.5px solid var(--line);
  display:grid;place-items:center;font-size:13px;color:transparent
}
.rub[aria-pressed="true"] .check{background:var(--gold-fill);border-color:var(--gold-fill);color:var(--on-gold);font-weight:900}
.perso-tag{font-size:11px;color:var(--muted);flex:none}

/* --- formulaire rubrique perso --- */
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px}
.input,select.input{
  width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:15px
}
.input:focus{border-color:var(--gold);outline:none}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:34px;height:34px;border-radius:10px;border:2px solid transparent}
.sw[aria-pressed="true"]{border-color:var(--text)}
.emojis{display:flex;flex-wrap:wrap;gap:6px}
.em{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:18px}
.em[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft)}

/* --- répartition --- */
.repart{
  display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);
  border-left:3px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:8px
}
.repart .nom{flex:1;min-width:0;font-weight:600;font-size:15px;white-space:normal;word-break:break-word}
.repart .pct{display:block;font-weight:500;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.reste-ici{
  background:transparent;border:1px solid var(--line);border-radius:9px;color:var(--muted);
  font-size:11px;font-weight:700;padding:7px 8px;flex:none;letter-spacing:.04em
}

/* --- jauge (élément signature) --- */
.jauge-wrap{margin:2px 0 10px}
.jauge{
  display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--surface-2);
  border:1px solid var(--line)
}
.seg{height:100%;flex:none;transition:width .18s ease}
.seg-vide{
  flex:1;background:repeating-linear-gradient(135deg,transparent 0 5px,var(--hachure) 5px 10px)
}

/* --- barre collante --- */
.sticky{
  position:fixed;left:0;right:0;bottom:var(--clavier);z-index:30;
  background:var(--sticky-bg);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
  padding:12px var(--pad) calc(12px + env(safe-area-inset-bottom));
  transition:bottom .1s ease
}
.sticky-in{max-width:560px;margin:0 auto}
.reste-line{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:10px}
.reste-line .lab{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.reste-val{font-size:26px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.deficit{color:var(--red)}
.ok{color:var(--green)}
.banner{
  background:var(--red-soft);border:1px solid var(--red-bd35);color:var(--red);
  border-radius:11px;padding:11px 12px;font-weight:700;font-size:14px;margin-bottom:10px
}
.doux{
  background:var(--gold-soft);border:1px solid var(--gold-bd3);color:var(--gold);
  border-radius:11px;padding:10px 12px;font-size:13px;font-weight:600;margin-bottom:10px
}

/* --- tableau de bord --- */
.tb-tete{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.tb-ligne{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.tb-ligne:last-child{border-bottom:0}
.pastille{width:10px;height:10px;border-radius:99px;flex:none}
.tb-ligne .nom{flex:1;min-width:0;font-weight:600;font-size:15px;white-space:normal;word-break:break-word}
.tb-mont{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.tb-mont small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.vide-msg{color:var(--muted);font-size:14px;padding:14px 0}

/* --- Sprint 2 : jauges par rubrique --- */
.jauge-r{height:9px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.jauge-r > i{display:block;height:100%;border-radius:99px;transition:width .2s ease;min-width:0}
.env{
  display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:12px;margin-bottom:8px
}
.env:active{transform:translateY(1px)}
.env.alerte{border-color:var(--red-bd4)}
.env-haut{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.env-haut .nom{flex:1;min-width:0;font-weight:600;font-size:15px;white-space:normal;word-break:break-word}
.env-mont{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;flex:none}
.env-mont small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.env-bas{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:7px;font-size:12px;font-variant-numeric:tabular-nums}
.c-vert{color:var(--green)}
.c-orange{color:var(--orange)}
.c-rouge{color:var(--red)}
.c-neutre{color:var(--muted)}
.chev{color:var(--muted);font-size:18px;flex:none;line-height:1}
.tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 7px;flex:none}

/* --- bouton flottant « + » --- */
.fab{
  position:fixed;z-index:45;right:20px;bottom:calc(22px + env(safe-area-inset-bottom));
  width:62px;height:62px;border-radius:99px;border:0;background:var(--gold-fill);color:var(--on-gold);
  font-size:32px;font-weight:800;line-height:1;display:grid;place-items:center;
  box-shadow:var(--ombre-pop)
}
.fab:active{transform:translateY(1px)}
@media (min-width:620px){ .fab{right:calc(50% - 280px + 8px)} }
body.avec-onglets .fab{bottom:calc(78px + var(--navh) + env(safe-area-inset-bottom))}

/* --- Sprint 5A : menu de navigation fixe en bas --- */
.nav-tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  display:none;
  background:var(--nav-bg);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)
}
body.avec-onglets .nav-tabs{display:block}
.nav-tabs-in{
  max-width:560px;margin:0 auto;display:flex;align-items:stretch
}
.nav-tab{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:transparent;border:0;color:var(--muted);padding:9px 2px 8px;min-width:0
}
.nav-tab .nav-ic{font-size:21px;line-height:1}
.nav-tab .nav-lab{font-size:10.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.nav-tab[aria-current="true"]{color:var(--gold)}
.nav-tab:active{opacity:.7}

/* --- feuille plein écran (saisie de dépense) --- */
.sheet{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-top{
  position:sticky;top:0;z-index:2;background:var(--sheet-top-bg);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)
}
.sheet-top-in{max-width:560px;margin:0 auto;padding:10px var(--pad);display:flex;align-items:center;gap:10px}
.sheet-titre{font-weight:800;font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{
  width:38px;height:38px;flex:none;border-radius:11px;border:1px solid var(--line);
  background:var(--surface-2);display:grid;place-items:center;font-size:19px;line-height:1;padding:0
}
.sheet-body{max-width:560px;margin:0 auto;padding:18px var(--pad) 120px}

.grille-rub{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.tuile{
  display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface);
  border:1px solid var(--line);border-radius:14px;padding:12px 6px 10px;min-height:104px
}
.tuile:active{transform:translateY(1px)}
.tuile .ico{width:44px;height:44px;font-size:22px}
.tuile .t-nom{
  font-size:11.5px;line-height:1.15;font-weight:600;text-align:center;width:100%;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden
}
.tuile .jauge-r{width:100%;height:5px;margin-top:auto}

.montant-xl{
  width:100%;background:transparent;border:0;border-bottom:2px solid var(--line);
  font-size:40px;font-weight:800;letter-spacing:-.03em;text-align:center;
  font-variant-numeric:tabular-nums;padding:4px 0 8px
}
.montant-xl:focus{border-bottom-color:var(--gold);outline:none}
.devise{text-align:center;color:var(--muted);font-size:13px;font-weight:700;letter-spacing:.14em;margin:6px 0 18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  border:1px solid var(--line);background:var(--surface-2);border-radius:99px;
  padding:9px 13px;font-size:13px;font-weight:600
}
.chip[aria-pressed="true"]{background:var(--gold-fill);border-color:var(--gold-fill);color:var(--on-gold)}
.info-env{
  border-radius:11px;padding:10px 12px;font-size:13px;font-weight:600;margin:0 0 16px;
  background:var(--surface);border:1px solid var(--line);color:var(--muted)
}
.info-env.vert{background:var(--green-soft);border-color:var(--green-bd3);color:var(--green)}
.info-env.orange{background:var(--orange-soft);border-color:var(--orange-bd3);color:var(--orange)}
.info-env.rouge{background:var(--red-soft);border-color:var(--red-bd3);color:var(--red)}
.rub-choisie{
  display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:10px 12px;margin-bottom:18px;width:100%;text-align:left
}
.rub-choisie .nom{flex:1;min-width:0;font-weight:700;font-size:15px;white-space:normal;word-break:break-word}
.rub-choisie .chg{font-size:12px;color:var(--gold);font-weight:700;flex:none}

/* --- liste des dépenses --- */
.dep{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.dep:last-child{border-bottom:0}
.dep-main{
  display:flex;align-items:center;gap:12px;flex:1;min-width:0;background:transparent;border:0;
  padding:12px 0;text-align:left
}
.d-txt{flex:1;min-width:0}
.d-lib{font-weight:600;font-size:15px;white-space:normal;word-break:break-word}
.d-date{font-size:12px;color:var(--muted)}
.d-mont{font-weight:700;font-variant-numeric:tabular-nums;flex:none}

/* --- message de confirmation --- */
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));
  z-index:90;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;
  padding:11px 18px;font-size:14px;font-weight:700;box-shadow:var(--ombre-pop);
  transition:opacity .25s ease
}
body.avec-onglets .toast{bottom:calc(150px + var(--navh) + env(safe-area-inset-bottom))}

/* --- Sprint 3 : regroupement par groupe --- */
.grp{margin:20px 0 9px}
.grp-t{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:7px}
.grp-nom{font-size:13px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.grp-mont{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600;flex:none}
.grp .jauge-r{height:6px}

/* --- Sprint 3 : avis (nouveau cycle, rappel de sauvegarde) --- */
.avis{
  background:var(--gold-soft);border:1px solid var(--gold-bd35);
  border-radius:var(--r);padding:13px 14px;margin-bottom:12px
}
.avis-t{font-weight:800;font-size:15px;color:var(--gold);margin-bottom:3px}
.avis-p{margin:0 0 10px;font-size:13.5px;color:var(--muted);line-height:1.4}
.avis .btn{margin-top:0}
.avis .row-btns{margin-top:0}

/* --- Sprint 3 : historique --- */
.cyc{
  display:block;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);padding:13px;margin-bottom:8px
}
.cyc:active{transform:translateY(1px)}
.cyc-h{display:flex;align-items:center;gap:8px}
.cyc-per{font-weight:700;font-size:15px;flex:1;min-width:0}
.cyc-g{display:flex;gap:16px;margin-top:9px}
.cyc-g div{font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.cyc-g b{display:block;color:var(--text);font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.cyc-g b.c-rouge{color:var(--red)}
.cyc-g b.c-vert{color:var(--green)}

/* --- Sprint 3 : lignes en lecture seule --- */
.ro{padding:11px 0;border-bottom:1px solid var(--line)}
.ro:last-child{border-bottom:0}
.ro-h{display:flex;align-items:center;gap:10px}
.ro-h .nom{flex:1;min-width:0;font-weight:600;font-size:14.5px;white-space:normal;word-break:break-word}
.ro-m{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:14.5px;flex:none}
.ro-m small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.ro-b{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:6px;font-size:12px;font-variant-numeric:tabular-nums}
.ro .jauge-r{margin-top:7px}
.ro .ico{width:30px;height:30px;font-size:15px}
.lecture{
  display:inline-block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:3px 9px;font-weight:700
}

/* ==============================================================
   Sprint 4 — code d'accès, réglages, lissage, épargne valorisée
   ============================================================== */
.c-attente{color:var(--bleu)}
.btn[disabled]{opacity:.4;pointer-events:none}

/* --- écran verrouillé + clavier du code --- */
.verrou{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:26px}
.verrou h1{margin-bottom:4px}
.verrou .sub{margin-bottom:6px}
.code-bloc{display:flex;flex-direction:column;align-items:center;width:100%}
.points{display:flex;gap:16px;margin:16px 0 2px}
.pt{width:14px;height:14px;border-radius:99px;border:1.5px solid var(--line);background:transparent}
.pt.on{background:var(--gold-fill);border-color:var(--gold-fill)}
.err-code{min-height:20px;margin:8px 0 0;font-size:13.5px;font-weight:600;color:var(--red)}
.clav{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:290px;margin:14px auto 0}
.tou{height:58px;border-radius:14px;border:1px solid var(--line);background:var(--surface);
     font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.tou:active{transform:translateY(1px)}
.tou-vide{border:0;background:transparent;pointer-events:none}
.lien{background:transparent;border:0;color:var(--muted);font-size:13.5px;
      text-decoration:underline;padding:14px 10px;margin-top:6px}

/* --- écran Réglages --- */
.regl{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);
      border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;margin-bottom:8px}
.regl:active{transform:translateY(1px)}
.regl-nom{font-weight:600;font-size:15px}
.regl-sous{font-size:12.5px;color:var(--muted);margin-top:1px}

/* --- gestion des rubriques : ligne + bouton modifier --- */
.rub-row{display:flex;align-items:stretch;gap:8px;margin-bottom:8px}
.rub-row .rub{flex:1;min-width:0;margin-bottom:0}
.mini{width:46px;flex:none;border-radius:var(--r);border:1px solid var(--line);
      background:var(--surface);font-size:16px;padding:0}

/* --- assistant de lissage (F9) --- */
.sous-ligne{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.lien-liss{background:transparent;border:0;padding:0;color:var(--gold);font-size:12px;
           font-weight:700;text-align:left}
.lissage{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;
         padding:13px;margin:-2px 0 10px}
.liss-t{font-weight:800;font-size:14px;margin-bottom:3px}
.liss-p{margin:0 0 11px;font-size:12.5px;color:var(--muted);line-height:1.4}
.liss-ligne{display:flex;align-items:center;gap:10px}
.liss-lab{flex:1;font-size:13.5px;font-weight:600}
.liss-res{font-size:13px;font-weight:700;color:var(--gold);margin:0 0 11px}

/* --- épargne valorisée (F10) --- */
.info-env.attente{background:var(--bleu-soft);border-color:var(--bleu-bd3);color:var(--bleu)}
.avis-vert{background:var(--green-soft);border-color:var(--green-bd35)}
.avis-vert .avis-t{color:var(--green)}
.bravo{font-size:12.5px;font-weight:700;color:var(--green);margin-top:6px}

/* --- à propos --- */
.ap{padding:9px 0;display:flex;gap:9px;align-items:flex-start;font-size:14px;line-height:1.4}
.ap span:first-child{flex:none}
.mission{font-size:17px;font-weight:700;line-height:1.35;margin:0 0 6px}

/* --- lien texte simple --- */
.lien{background:transparent;border:0;color:var(--gold);font-weight:700;font-size:13px;padding:2px 0}

/* ==============================================================
   Sprint 6A — nature des revenus, budget suggéré, ajustement de caisse
   ============================================================== */
.natures{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:-2px 0 10px 4px}
.chip-s{padding:6px 11px;font-size:12.5px}
.natures + .champ-date{margin-top:-2px}
.dont{margin-top:6px}
.dont-l{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted);
        font-variant-numeric:tabular-nums;padding:1px 0}
.rb{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);font-size:12.5px;
    color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.4}
.rb-p{margin-top:3px}
.sugg{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.sugg-t{flex:1;min-width:0;font-size:12.5px;color:var(--muted);line-height:1.4}
.sugg-t b{color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap}
.sugg-lab{color:var(--text);font-weight:700}
.sugg-ok{flex:none;padding:7px 13px;font-size:13px;border-color:var(--gold-bd5);color:var(--gold);background:var(--gold-soft)}
.sugg-x{flex:none;width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:transparent;
        color:var(--muted);font-size:18px;line-height:1;padding:0}
.sugg-rep{margin:-4px 0 10px;padding:9px 12px;border:1px dashed var(--line);border-radius:12px;background:var(--surface)}
.sugg-carte{margin:-4px 0 0;padding:11px 12px;border:1px dashed var(--line);border-radius:var(--r);background:var(--surface)}
.env-in{display:block;width:100%;text-align:left;background:transparent;border:0;padding:0;color:inherit}
.env-in:active{transform:translateY(1px)}
.pill-aj{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:700;letter-spacing:.03em;color:var(--muted);
         background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:1px 7px;vertical-align:1px}
.natures .pill-aj{margin-left:0}
.ajust-ecart{text-align:center;margin:4px 0 16px}
.ajust-ecart .big{font-size:32px}
.ajust-ecart p{margin:4px 0 12px}
.ajust-ecart .doux{text-align:left}
/* bannière « Une nouvelle version est prête » : sous l'en-tête, jamais sur une feuille */
#maj-banner{
  position:fixed;left:12px;right:12px;top:calc(62px + env(safe-area-inset-top));z-index:55;
  max-width:536px;margin:0 auto;display:flex;align-items:center;gap:10px;
  background:var(--surface-2);border:1px solid var(--gold-bd45);border-radius:14px;
  padding:10px 10px 10px 14px;box-shadow:var(--ombre-pop);font-size:13.5px;font-weight:600
}
#maj-banner .mb-text{flex:1;line-height:1.35}
#maj-banner .mb-btn{flex:none;border:0;border-radius:10px;padding:9px 12px;font-size:13px;font-weight:800;
                    background:var(--gold-fill);color:var(--on-gold)}
/* ==============================================================
   Sprint 6B — étiquettes, « Pour qui ? », raccourcis, recherche, fusion
   ============================================================== */
.etiqs{margin:-6px 0 16px}
.etiqs .chips{justify-content:center}
.chip-autre{background:transparent;border-style:dashed;color:var(--muted)}
.etiq-autre{display:flex;gap:8px;margin-top:10px}
.etiq-autre[hidden]{display:none}
.etiq-autre .input{flex:1;min-width:0}
.chips-sous{margin-top:8px}
.raccourcis{margin:0 0 14px}
.chip-modele{background:var(--gold-soft);border-color:var(--gold-bd45);color:var(--text);
             max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.j-outils{display:flex;gap:8px;align-items:center;margin:14px 0 0}
.j-rech{flex:1;min-width:0;padding:9px 12px;font-size:14px}
.chip-filtre{margin-top:10px;background:var(--gold-fill);border-color:var(--gold-fill);color:var(--on-gold)}
.j-res{margin:-2px 0 8px}
.pers{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:0;
      border-bottom:1px solid var(--line);padding:12px 0}
.pers:last-child{border-bottom:0}
.interr-ligne{display:flex;align-items:center;gap:12px}
.interr{position:relative;width:50px;height:30px;flex:none;border-radius:99px;border:1px solid var(--line);
        background:var(--surface-2);padding:0}
.interr-pt{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:99px;background:var(--muted);
           transition:left .15s ease}
.interr[aria-checked="true"]{background:var(--gold-fill);border-color:var(--gold-fill)}
.interr[aria-checked="true"] .interr-pt{left:23px;background:var(--on-gold)}
.voir-plus{display:block;margin:6px auto 4px;padding:10px 4px}
.assist{margin:0 0 18px}
.assist-t{font-weight:800;font-size:15px;margin:0 0 4px}
.assist-n{margin:-2px 0 8px}
.assist-m{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-top:1px}
.fusion-l{margin-bottom:10px}
.fusion-t{font-weight:800;font-size:15px;margin-bottom:6px}
.fusion-l .small{line-height:1.4}
.fusion-l .tiny{margin-top:5px}

/* correctif : « .app » annulait la marge basse de « main » sur les écrans sans onglets ;
   les écrans à onglets gardent exactement la même marge qu'avant */
main.app{padding-bottom:calc(100px + env(safe-area-inset-bottom))}
body.avec-onglets main.app{padding-bottom:calc(120px + var(--navh) + 78px)}


/* ==============================================================
   Sprint 6C — thème clair, navigation, Aujourd'hui, Mon état, Mes habitudes
   ============================================================== */
html{background:var(--bg)}
::placeholder{color:var(--ph);opacity:1}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
/* ombre douce des cartes : « none » en sombre (rendu inchangé) */
.card,.tb-tete,.env,.rub,.repart,.cyc,.regl,.ligne,.menu,.tuile,.lissage,.sugg-rep,.sugg-carte,.avis{box-shadow:var(--ombre-carte)}
/* en-tête : bandeau MonDjai */
.top-in.avec-hd{align-items:center}
.hd-actions{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
.hd-actions[hidden],.eyebrow[hidden]{display:none}
.hd-btn{height:34px;border-radius:11px;border:1px solid var(--hd-btn-bd);background:var(--hd-btn-bg);color:var(--hd-btn-text);
  font-size:12.5px;font-weight:700;padding:0 10px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;min-width:0}
.hd-btn:active{opacity:.75}
main.app{position:relative}
main.app > *:not(.band-ext){position:relative;z-index:1}
/* le bandeau descend jusqu'au milieu de la première carte (thème clair seulement) */
.band-ext{display:none}
html[data-theme="clair"] .band-ext{display:block;position:absolute;z-index:0;top:0;left:50%;width:100vw;margin-left:-50vw;
  background:#141922;border-radius:0 0 26px 26px;height:150px}
html[data-theme="clair"] .band-tete{
  --text:#ffffff;--muted:#b4bcc9;--line:rgba(255,255,255,.2);--surface-2:rgba(255,255,255,.16);
  --green:#5ed3a0;--orange:#ffb347;--red:#ff8f85;--gold:#f5a623;
  background:transparent;border:0;box-shadow:none;color:var(--text);padding:4px 2px 16px;margin-bottom:6px}
/* barre du bas */
html[data-theme="clair"] .nav-tab[aria-current="true"]{color:var(--text)}
html[data-theme="clair"] .nav-tab[aria-current="true"] .nav-ic{background:var(--gold-fill);border-radius:99px;width:54px;height:30px;
  display:grid;place-items:center;font-size:19px}
.nav-tab .nav-ic{display:grid;place-items:center;width:54px;height:30px}
.nav-tab{padding-top:6px}
.nav-tab .nav-lab{font-size:10px;letter-spacing:-.01em}
/* Aujourd'hui */
.carte-jour{padding:6px 14px 4px}
.cj-haut{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:8px 0 6px;border-bottom:1px solid var(--line)}
.cj-titre{font-weight:800;font-size:15px}
.cj-total{font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.carte-jour .vide-msg{padding:10px 0}
.lien-ligne{display:flex;justify-content:flex-end;margin:6px 0 0}
.avis-fort{margin:0 0 10px;font-size:14px;font-weight:600;line-height:1.4;color:var(--text)}
/* Mon état / Mes habitudes */
.sel3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:12px;padding:3px;margin:0 0 14px}
.sel3 button{border:0;background:transparent;border-radius:9px;padding:9px 4px;font-size:14px;font-weight:700;color:var(--muted)}
.sel3 button[aria-pressed="true"]{background:var(--gold-fill);color:var(--on-gold)}
.sel2{grid-template-columns:repeat(2,1fr)}
.per-nav{display:flex;align-items:center;gap:8px;margin:0 0 12px}
.per-nav .per-t{flex:1;min-width:0;text-align:center;font-weight:800;font-size:15px;line-height:1.25}
.per-nav .per-t small{display:block;font-weight:600;font-size:12px;color:var(--muted)}
.per-nav button{width:40px;height:40px;flex:none;border-radius:11px;border:1px solid var(--line);background:var(--surface);
  font-size:20px;line-height:1;padding:0;color:var(--text);box-shadow:var(--ombre-carte)}
.per-nav button[disabled]{opacity:.35;pointer-events:none}
.reste-card{margin-bottom:12px}
.reste-card .lab{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.reste-card .big{margin-top:2px}
.reste-card .env-bas{margin-top:8px}
.lig-per{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:0;
  border-bottom:1px solid var(--line);padding:13px 0;color:inherit}
.lig-per:last-child{border-bottom:0}
.lig-per .lp-t{flex:1;min-width:0;font-weight:600;font-size:15px}
.lig-per .lp-t small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.lig-per .lp-m{font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.lig-per .lp-m.zero{font-weight:500;color:var(--muted)}
.j-resume{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.carte-mis{display:block;width:100%;text-align:left;margin-bottom:12px;color:inherit}
.carte-mis .cm-haut{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
.carte-mis .cm-haut .chev{margin-left:auto}
.carte-mis .big{margin:4px 0 2px}
.carte-mis .jauge-r{margin-top:8px}
.cm-obj{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;padding:2px 0}
.cm-obj span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips-theme{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
/* barres fines HTML/CSS de « Mes habitudes » */
.hb{padding:9px 0;border-bottom:1px solid var(--line)}
.hb:last-child{border-bottom:0}
.hb-h{display:flex;align-items:baseline;gap:8px;font-size:14.5px}
.hb-h .hb-n{flex:1;min-width:0;font-weight:600;white-space:normal;word-break:break-word}
.hb-h .hb-m{font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.hb-s{font-size:12px;color:var(--muted);margin-top:1px}
.hb-barre{position:relative;height:6px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);margin-top:6px}
.hb-barre > i{display:block;height:100%;border-radius:99px;min-width:3px}
.hb-barre > b{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:2px;background:var(--text);opacity:.7}
.hb-note{font-size:12px;color:var(--muted);margin:8px 0 0}
.hb-info{margin:0 0 12px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);
  font-size:13.5px;line-height:1.4;box-shadow:var(--ombre-carte)}

/* ---- Sprint 6D : accompagnement ---- */
.rythme{margin-top:10px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;font-size:13px}
.rythme .r-m{font-weight:600}
.lien-pt{background:none;border:0;color:var(--gold);text-decoration:underline;font:inherit;font-size:12px;padding:8px 4px;min-height:36px;cursor:pointer}
.stepper{display:flex;align-items:center;gap:8px;flex:none}
.stepper .btn{min-width:44px;padding:0 12px;min-height:44px}
.stepper-v{min-width:56px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>

<script>
"use strict";
/* ==============================================================

   (Sprint 6C — thème clair « bandeau MonDjai » (sombre au choix),

  {v:"habitudes",  ic:"📈", lab:"Mes habitudes"},

];
function estOnglet(v){ return ONGLETS.some(function(t){ return t.v === v; }); }

/* ---------- utilitaires ---------- */
function uid(){ return "r" + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function fmt(n){
  n = Math.round(Number(n) || 0);
  var neg = n < 0; n = Math.abs(n);
  return (neg ? "-" : "") + String(n).replace(/\B(?=(\d{3})+(?!\d))/g, NBSP);
}
function fmtF(n){ return fmt(n) + NBSP + "F"; }
function pct(n){ return Math.round(Number(n)||0) + NBSP + "%"; }
function chiffres(s){ var d = String(s).replace(/[^0-9]/g,""); return d ? parseInt(d,10) : 0; }
function el(tag, cls, txt){
  var e = document.createElement(tag);
  if(cls) e.className = cls;
  if(txt !== undefined && txt !== null) e.textContent = txt;
  return e;
}

/* ---------- dates ---------- */
function p2(n){ return (n < 10 ? "0" : "") + n; }
function iso(d){ return d.getFullYear() + "-" + p2(d.getMonth()+1) + "-" + p2(d.getDate()); }
function aujourdhui(){ return iso(new Date()); }
function deIso(s){
  var p = String(s || "").split("-");
  var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  return isNaN(d.getTime()) ? new Date() : d;
}
function dateLisible(s){
  if(s === aujourdhui()) return "Aujourd'hui";
  var h = new Date(); h.setDate(h.getDate() - 1);
  if(s === iso(h)) return "Hier";
  var d = deIso(s);
  var txt = d.getDate() + " " + MOIS[d.getMonth()];
  if(d.getFullYear() !== new Date().getFullYear()) txt += " " + d.getFullYear();
  return txt;
}
function dateCourte(s){
  var d = deIso(s);
  return d.getDate() + " " + MOIS[d.getMonth()].slice(0,4) + ".";
}
function dateComplete(s){
  var d = deIso(s);
  return d.getDate() + " " + MOIS[d.getMonth()] + " " + d.getFullYear();
}
/* Prochaine paie : le jour choisi, ramené au dernier jour si le mois est plus court.
   Le jour peut être passé en paramètre (utile avant que l'état ne soit chargé). */
function paieDuMois(annee, mois, jourOpt){
  var dernier = new Date(annee, mois + 1, 0).getDate();
  var js = (jourOpt === undefined) ? S.jourSalaire : jourOpt;
  var j = (js === "dernier") ? dernier : Math.min(Number(js) || 1, dernier);
  return new Date(annee, mois, j);
}
/* Sprint 3 — date de paie la plus récente à ce jour : début théorique du cycle */
function debutCycleTheorique(jourOpt, refIso){
  var t = refIso ? deIso(refIso) : new Date();
  t.setHours(0,0,0,0);
  var js = (jourOpt === undefined) ? S.jourSalaire : jourOpt;
  if(js === null || js === undefined) return iso(t);
  var c = paieDuMois(t.getFullYear(), t.getMonth(), js);
  if(c.getTime() > t.getTime()) c = paieDuMois(t.getFullYear(), t.getMonth() - 1, js);
  return iso(c);
}
/* Première date de paie strictement postérieure à une date donnée */
function paieApres(dateIso){
  var d = deIso(dateIso); d.setHours(0,0,0,0);
  var c = paieDuMois(d.getFullYear(), d.getMonth());
  if(c.getTime() <= d.getTime()) c = paieDuMois(d.getFullYear(), d.getMonth() + 1);
  return c;
}
function prochainePaie(){
  if(S.jourSalaire === null || S.jourSalaire === undefined) return null;
  var t = new Date(); t.setHours(0,0,0,0);
  var c = paieDuMois(t.getFullYear(), t.getMonth());
  if(c.getTime() <= t.getTime()) c = paieDuMois(t.getFullYear(), t.getMonth() + 1);
  return c;
}
function joursAvantPaie(){
  var p = prochainePaie();
  if(!p) return null;
  var t = new Date(); t.setHours(0,0,0,0);
  return Math.max(1, Math.round((p.getTime() - t.getTime()) / 86400000));
}
function motJours(n){ return n + (n > 1 ? " jours" : " jour"); }

/* ==============================================================
   ÉTAT
   S.revenus, S.rubriques[].montant et S.depenses décrivent
   TOUJOURS le cycle en cours. Les cycles clos sont recopiés
   dans S.cycles, du plus récent au plus ancien.
   ============================================================== */
var S = charger();
var vue = S.onboarded ? "dashboard" : "revenus";
var rubOuverte = null;    /* id de la rubrique affichée en détail */
var cycleOuvert = null;   /* id du cycle archivé consulté */
var brouillonCycle = null;/* nouveau cycle en préparation */
var deverrouille = !S.pin;/* Sprint 4 — tant que c'est faux, aucun montant n'est affiché */
var retours = {};         /* Sprint 4 — d'où l'on vient, pour le bouton retour */

function neuf(){
  return {
    version: VERSION_SCHEMA,
    onboarded: false,
    jourSalaire: null,
    revenus: [{id: uid(), libelle: "Salaire net", montant: 0, date: null}],
    rubriques: rubriquesNeuves(),   /* Sprint 6B — 9 familles actives, catalogue détaillé inactif */
    depenses: [],
    previsions: [],        /* Sprint 5B — dépenses prévues, non comptabilisées tant que non validées (F4bis) */
    cycleId: uid(),
    cycleDebut: aujourdhui(),
    cycles: [],
    rappelSauvegarde: false,
    derniereSauvegarde: null,
    pin: null,              /* Sprint 4 — code à 4 chiffres, ou null */
    epargneFelicitee: null, /* Sprint 4 — total épargné du cycle qu'on vient de clôturer */
    joursSansDepense: [],   /* Sprint 6D */
    reglages: {themeInfoVu: true},   /* Sprint 6C : installation neuve = pas de message « nouveau thème » */ /* Sprint 6A — lus par reglage(cle), valeurs par défaut dans REGLAGES_DEFAUT */

  };
}
/* Sprint 6B — rubriques d'une nouvelle installation : les 9 familles, actives,
   avec leurs étiquettes proposées ; puis le catalogue détaillé, inactif. */
function rubriquesNeuves(){
  var ids = {};
  var familles = FAMILLES.map(function(f){
    ids[f.id] = true;
    var o = {id:f.id, nom:f.nom, icone:f.icone, couleur:f.couleur, groupe:f.groupe,
             active:true, montant:0, perso:false, periodicite:"mensuel", montantReel:0};
    if(ETIQUETTES_FAMILLES[f.id]) o.etiquettes = ETIQUETTES_FAMILLES[f.id].slice();
    return o;
  });
  var detail = RUBRIQUES_F3.filter(function(r){ return !ids[r.id]; }).map(function(r){
    return {id:r.id, nom:r.nom, icone:r.icone, couleur:r.couleur, groupe:r.groupe,
            active:false, montant:0, perso:false, periodicite:"mensuel", montantReel:0};
  });
  return familles.concat(detail);
}

/* Remise en forme et migration silencieuse.
   Sert au chargement local ET à la restauration d'un fichier.
   Renvoie null si le contenu n'a rien d'un état MonDjai. */
function normaliser(o){
  if(!o || typeof o !== "object") return null;
  if(!Array.isArray(o.rubriques) || !Array.isArray(o.revenus)) return null;

  var rubs = o.rubriques.filter(function(r){
    return r && typeof r.id === "string" && typeof r.nom === "string";
  }).map(function(r){
    var o2 = {
      id: r.id, nom: r.nom,
      icone: r.icone || "\uD83D\uDCB8",
      couleur: r.couleur || COULEURS[0],
      groupe: r.groupe || "Vie courante",
      active: !!r.active,
      montant: Number(r.montant) || 0,
      perso: !!r.perso,
      /* Sprint 4 — lissage mémorisé sur la rubrique (F9) */
      periodicite: estPeriodicite(r.periodicite) ? r.periodicite : "mensuel",
      montantReel: Number(r.montantReel) || 0
    };
    /* Sprint 6D — échéance facultative (jour du mois) : recopiée seulement si elle existe */
    if(Number(r.echeance) >= 1 && Number(r.echeance) <= 31) o2.echeance = Math.round(Number(r.echeance));
    /* Sprint 6B — étiquettes mémorisées : recopiées seulement si elles existent */
    if(Array.isArray(r.etiquettes)){
      o2.etiquettes = r.etiquettes.filter(function(e){ return typeof e === "string" && e.trim(); });
    }
    return o2;
  });
  if(!rubs.length) return null;
  o.rubriques = rubs;

  o.revenus = o.revenus.filter(function(r){ return r && typeof r === "object"; })
    .map(function(r){
      return completerRevenu({id: r.id || uid(), libelle: String(r.libelle || ""), montant: Number(r.montant) || 0,
              /* Sprint 5B — date propre à ce revenu (jamais celle du salaire par défaut) */
              date: (typeof r.date === "string" && r.date) ? r.date : null}, r);  /* Sprint 6A : nature, ajustement */
    });
  if(!o.revenus.length) o.revenus = [{id: uid(), libelle: "Salaire net", montant: 0, date: null}];

  o.depenses = (Array.isArray(o.depenses) ? o.depenses : []).filter(function(d){
    return d && typeof d.rubrique === "string" && Number(d.montant) > 0;
  }).map(function(d){
    return completerDepense({id: d.id || uid(), rubrique: d.rubrique, montant: Number(d.montant) || 0,
            libelle: String(d.libelle || ""), date: d.date || aujourdhui(), cree: Number(d.cree) || 0}, d);
  });

  /* Sprint 5B — dépenses prévues (F4bis) : une date future, jamais comptée
     dans le solde tant qu'elle n'a pas été validée. */
  o.previsions = (Array.isArray(o.previsions) ? o.previsions : []).filter(function(d){
    return d && typeof d.rubrique === "string" && Number(d.montant) > 0;
  }).map(function(d){
    return completerDepense({id: d.id || uid(), rubrique: d.rubrique, montant: Number(d.montant) || 0,
            libelle: String(d.libelle || ""), date: d.date || aujourdhui(), cree: Number(d.cree) || 0}, d);
  });

  if(o.jourSalaire !== "dernier"){
    var j = Number(o.jourSalaire);
    o.jourSalaire = (j >= 1 && j <= 31) ? j : null;
  }
  o.onboarded = !!o.onboarded;

  /* --- Sprint 3 : les données existantes deviennent le premier cycle --- */
  if(!o.cycleId) o.cycleId = uid();
  if(!o.cycleDebut) o.cycleDebut = debutCycleTheorique(o.jourSalaire);
  o.cycles = (Array.isArray(o.cycles) ? o.cycles : []).filter(function(c){
    return c && typeof c === "object" && Array.isArray(c.rubriques);
  }).map(function(c){
    return {
      id: c.id || uid(),
      debut: c.debut || aujourdhui(),
      fin: c.fin || c.debut || aujourdhui(),
      jourSalaire: (c.jourSalaire === undefined ? o.jourSalaire : c.jourSalaire),
      revenus: (Array.isArray(c.revenus) ? c.revenus : []).map(function(r){
        return completerRevenu({id: r.id || uid(), libelle: String(r.libelle || ""), montant: Number(r.montant) || 0,
                date: (typeof r.date === "string" && r.date) ? r.date : null}, r);
      }),
      rubriques: c.rubriques.filter(function(r){ return r && typeof r.id === "string"; })
        .map(function(r){
          return {id: r.id, nom: String(r.nom || "Rubrique"), icone: r.icone || "\uD83D\uDCB8",
                  couleur: r.couleur || COULEURS[0], groupe: r.groupe || "Vie courante",
                  montant: Number(r.montant) || 0};
        }),
      depenses: (Array.isArray(c.depenses) ? c.depenses : []).filter(function(d){
        return d && typeof d.rubrique === "string";
      }).map(function(d){
        return completerDepense({id: d.id || uid(), rubrique: d.rubrique, montant: Number(d.montant) || 0,
                libelle: String(d.libelle || ""), date: d.date || c.debut || aujourdhui(),
                cree: Number(d.cree) || 0}, d);
      })
    };
  });
  o.rappelSauvegarde = !!o.rappelSauvegarde;
  if(typeof o.derniereSauvegarde !== "string") o.derniereSauvegarde = null;

  /* --- Sprint 4 : code d'accès et félicitations d'épargne --- */
  o.pin = (typeof o.pin === "string" && /^[0-9]{4}$/.test(o.pin)) ? o.pin : null;
  o.epargneFelicitee = (o.epargneFelicitee === null || o.epargneFelicitee === undefined)
    ? null : (Number(o.epargneFelicitee) || 0);

  /* --- Sprint 6B : raccourcis de saisie (8 au plus), créés vides --- */
  o.modeles = (Array.isArray(o.modeles) ? o.modeles : []).filter(function(m){
    return m && typeof m.rubrique === "string" && Number(m.montant) > 0;
  }).slice(0, MAX_MODELES).map(function(m){
    return completerSaisie({id: m.id || uid(), rubrique: m.rubrique, montant: Number(m.montant) || 0,
                            libelle: String(m.libelle || "")}, m);
  });

  /* --- Sprint 6D : jours déclarés « rien à noter » (dates ISO), créés vides --- */
  o.joursSansDepense = (Array.isArray(o.joursSansDepense) ? o.joursSansDepense : [])
    .filter(function(j){ return typeof j === "string" && /^\d{4}-\d{2}-\d{2}$/.test(j); })
    .filter(function(j, i, a){ return a.indexOf(j) === i; }).sort().slice(-400);

  /* --- Sprint 6A : socle des réglages, créé à vide (jamais réécrit s'il existe) --- */
  if(!o.reglages || typeof o.reglages !== "object" || Array.isArray(o.reglages)) o.reglages = {};

  o.version = VERSION_SCHEMA;
  return o;
}

function charger(){
  try{
    var brut = localStorage.getItem(CLE);
    if(brut){
      var o = normaliser(JSON.parse(brut));
      if(o) return o;
    }
  }catch(e){}
  return neuf();
}
function sauver(){
  try{ localStorage.setItem(CLE, JSON.stringify(S)); }catch(e){}
  try{ if(window.MDStock) window.MDStock.miroir(); }catch(e){}   /* copie de secours (IndexedDB) */
}

/* ---------- calculs ---------- */
function totalRevenus(){
  return S.revenus.reduce(function(t,r){ return t + (Number(r.montant)||0); }, 0);
}
function actives(){
  return S.rubriques.filter(function(r){ return r.active; });
}
function totalReparti(){
  return actives().reduce(function(t,r){ return t + (Number(r.montant)||0); }, 0);
}
function reste(){ return totalRevenus() - totalReparti(); }
function libelleJour(){
  if(S.jourSalaire === "dernier") return "le dernier jour du mois";
  if(S.jourSalaire === 1) return "le 1er de chaque mois";
  if(S.jourSalaire) return "le " + S.jourSalaire + " de chaque mois";
  return "—";
}
function rubriqueParId(id){
  for(var i = 0; i < S.rubriques.length; i++){ if(S.rubriques[i].id === id) return S.rubriques[i]; }
  return null;
}
function depensesDe(id){
  return S.depenses.filter(function(d){ return d.rubrique === id; });
}
function depenseRub(id){
  return depensesDe(id).reduce(function(t,d){ return t + (Number(d.montant)||0); }, 0);
}
function totalDepense(){
  return S.depenses.reduce(function(t,d){ return t + (Number(d.montant)||0); }, 0);
}
function disponible(){ return totalRevenus() - totalDepense(); }

/* ==============================================================
   SPRINT 6A — RÉGLAGES (socle)
   Chaque lecture passe par reglage(cle) ; une valeur absente ou
   abîmée retombe sur REGLAGES_DEFAUT.
   ============================================================== */
function reglage(cle){
  var r = (S && S.reglages && typeof S.reglages === "object") ? S.reglages : {};
  var d = REGLAGES_DEFAUT[cle];
  if(Object.prototype.hasOwnProperty.call(r, cle) && r[cle] !== undefined && r[cle] !== null){
    if(Array.isArray(d)) return Array.isArray(r[cle]) ? r[cle].slice() : d.slice();
    if(typeof d === "boolean") return !!r[cle];
    return r[cle];
  }
  return Array.isArray(d) ? d.slice() : d;
}
function regler(cle, valeur){
  if(!S.reglages || typeof S.reglages !== "object" || Array.isArray(S.reglages)) S.reglages = {};
  S.reglages[cle] = valeur;
  sauver();
}

/* ==============================================================
   SPRINT 6C — THÈME CLAIR / SOMBRE
   Une seule source de couleurs : les variables CSS (deux jeux).
   reglages.theme = 'clair' | 'auto' | 'sombre' ; absent = 'clair'.
   Le script du <head> pose déjà data-theme avant le premier affichage ;
   ces fonctions le tiennent à jour quand le choix change.
   ============================================================== */
var THEMES = [
  {cle: "clair",  lab: "Clair"},
  {cle: "auto",   lab: "Automatique"},
  {cle: "sombre", lab: "Sombre"}
];
var COULEUR_BARRE_STATUT = {clair: "#141922", sombre: "#0F1218"};
function themeChoisi(){
  var t = reglage("theme");
  return (t === "auto" || t === "sombre") ? t : "clair";
}
function systemeSombre(){
  try{ return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches); }catch(e){ return false; }
}
function themeEffectif(){
  var t = themeChoisi();
  return (t === "sombre" || (t === "auto" && systemeSombre())) ? "sombre" : "clair";
}
function appliquerTheme(){
  var t = themeEffectif();
  document.documentElement.setAttribute("data-theme", t);
  var m = document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute("content", COULEUR_BARRE_STATUT[t]);
}
/* Automatique : suit le téléphone en direct */
try{
  var mqSombre = window.matchMedia("(prefers-color-scheme: dark)");
  var surChangementTheme = function(){
    if(themeChoisi() !== "auto") return;
    appliquerTheme();
    if(!feuille) rafraichirSurPlace();
  };
  if(mqSombre.addEventListener) mqSombre.addEventListener("change", surChangementTheme);
  else if(mqSombre.addListener) mqSombre.addListener(surChangementTheme);
}catch(e){}
/* Couleur d'enveloppe : version plus foncée en thème clair (les couleurs d'origine restent en sombre) */
function teinte(c){
  if(themeEffectif() !== "clair") return c;
  var m = /^#?([0-9a-f]{6})$/i.exec(String(c || ""));
  if(!m) return c;
  var n = parseInt(m[1], 16), f = 0.78;
  return "#" + [16, 8, 0].map(function(s){
    return ("0" + Math.round(((n >> s) & 255) * f).toString(16)).slice(-2);
  }).join("");
}
/* Message unique « Nouveau thème clair » pour les installations existantes */
var themeInfoEnCours = false;
function carteThemeInfo(ec){
  if(!S.onboarded) return;
  if(!themeInfoEnCours){
    var choisi = S.reglages && Object.prototype.hasOwnProperty.call(S.reglages, "theme");
    if(choisi || reglage("themeInfoVu")) return;
    themeInfoEnCours = true;
    regler("themeInfoVu", true);      /* vu une fois : jamais reproposé après rechargement */
  }
  var a = el("div", "avis");
  a.setAttribute("data-test", "carte-theme");
  a.appendChild(el("p", "avis-fort", "Nouveau thème clair — Réglages › Affichage pour revenir au sombre"));
  var b = el("button", "btn btn-ghost", "OK"); b.type = "button";
  b.addEventListener("click", function(){ themeInfoEnCours = false; render(); });
  a.appendChild(b);
  ec.appendChild(a);
}

/* ==============================================================
   SPRINT 6A — NATURE DES REVENUS
   ============================================================== */
function estNature(cle){ return cle === "regulier" || cle === "exceptionnel" || cle === "emprunt"; }
function natureDe(rev){ return (rev && estNature(rev.nature)) ? rev.nature : NATURE_DEFAUT; }
function natureInfo(cle){
  for(var i = 0; i < NATURES.length; i++){ if(NATURES[i].cle === cle) return NATURES[i]; }
  return NATURES[0];
}
/* Totaux par nature. L'emprunt reçu compte dans le total des revenus
   (c'est de l'argent réel) mais jamais dans le régulier ni l'exceptionnel. */
function totauxNatures(liste){
  var t = {regulier: 0, exceptionnel: 0, emprunt: 0};
  (liste || []).forEach(function(r){ t[natureDe(r)] += Number(r.montant) || 0; });
  return t;
}
function revenuRegulier(){ return totauxNatures(S.revenus).regulier; }
/* Recopie des champs ajoutés au 6A — à appeler partout où un revenu ou une
   dépense est reconstruit champ par champ (le « piège connu »). */
function completerRevenu(o, r){
  if(r && estNature(r.nature)) o.nature = r.nature;
  if(r && r.ajustement === true) o.ajustement = true;
  if(r && r.partProposee === true) o.partProposee = true;   /* Sprint 6D — part déjà proposée pour ce revenu */
  return o;
}
function completerDepense(o, d){
  if(d && d.ajustement === true) o.ajustement = true;
  return completerSaisie(o, d);
}
/* Sprint 6B — étiquette et « pour qui » : recopiés seulement s'ils sont renseignés
   (dépenses, prévisions, cycles archivés, raccourcis) */
function completerSaisie(o, d){
  if(d && typeof d.etiquette === "string" && d.etiquette.trim()) o.etiquette = d.etiquette;
  if(d && typeof d.pour === "string" && d.pour.trim()) o.pour = d.pour;
  return o;
}
/* « dont régulier · exceptionnel · emprunt » — seulement si plusieurs natures sont utilisées */
function dessinerDontNatures(cible, liste){
  cible.innerHTML = "";
  var t = totauxNatures(liste);
  var utilisees = NATURES.filter(function(n){ return t[n.cle] > 0; });
  cible.hidden = utilisees.length < 2;
  if(cible.hidden) return;
  utilisees.forEach(function(n){
    var l = el("div", "dont-l");
    l.appendChild(el("span", null, "dont " + n.dont));
    l.appendChild(el("span", null, fmtF(t[n.cle])));
    cible.appendChild(l);
  });
}
/* Trois pastilles sous le nom et le montant : un tap pour choisir */
function pastillesNature(rev, apres){
  var w = el("div", "natures");
  w.setAttribute("role", "group");
  w.setAttribute("aria-label", "Nature de " + (rev.libelle || "ce revenu"));
  var actuelle = natureDe(rev);
  NATURES.forEach(function(n){
    var c = el("button", "chip chip-s", n.lab);
    c.type = "button";
    c.setAttribute("aria-pressed", actuelle === n.cle ? "true" : "false");
    c.addEventListener("click", function(){
      rev.nature = n.cle;
      w.querySelectorAll(".chip").forEach(function(x){ x.setAttribute("aria-pressed", "false"); });
      c.setAttribute("aria-pressed", "true");
      if(apres) apres();
    });
    w.appendChild(c);
  });
  return w;
}
/* Un ajustement de caisse garde sa nature (exceptionnelle) : pastille grise */
function pastilleAjustementRevenu(){

/* ==============================================================
   SPRINT 6A — AJUSTEMENT DE CAISSE
   Les lignes ajustement:true comptent dans « Il vous reste » et dans le
   total dépensé, mais sont exclues des suggestions de budget (et, aux
   sprints suivants, du rythme, des mises de côté et de « Mes habitudes »).
   ============================================================== */
function estAjustement(x){ return !!x && x.ajustement === true; }
function estAClasser(r){ return !!r && r.id === ID_ACLASSER; }
function horsAjustements(liste){ return (liste || []).filter(function(x){ return !estAjustement(x); }); }
function assurerRubriqueAClasser(){
  var r = rubriqueParId(ID_ACLASSER);
  if(!r){
    r = {id: ID_ACLASSER, nom: RUBRIQUE_ACLASSER.nom, icone: RUBRIQUE_ACLASSER.icone,
         couleur: RUBRIQUE_ACLASSER.couleur, groupe: RUBRIQUE_ACLASSER.groupe,
         active: true, montant: 0, perso: false, periodicite: "mensuel", montantReel: 0};
    S.rubriques.push(r);
  }
  return r;
}
/* écart = argent réellement disponible − solde de l'application */
function appliquerAjustement(ecart){
  ecart = Math.round(Number(ecart) || 0);
  if(!ecart) return null;
  var ligne;
  if(ecart < 0){
    assurerRubriqueAClasser();
    ligne = {id: uid(), rubrique: ID_ACLASSER, montant: -ecart, libelle: LIBELLE_AJUSTEMENT,
             date: aujourdhui(), cree: Date.now(), ajustement: true};
    S.depenses.push(ligne);
  }else{
    ligne = {id: uid(), libelle: LIBELLE_AJUSTEMENT, montant: ecart, date: aujourdhui(),
             nature: "exceptionnel", ajustement: true};
    S.revenus.push(ligne);
  }
  sauver();
  return ligne;
}

/* ==============================================================
   SPRINT 6A — BUDGET SUGGÉRÉ
   Rubrique active, hors épargne et hors « À classer », budget 0, au moins
   SUGGESTION_MIN_DEPENSES dépenses (hors ajustements) : dépensé arrondi
   au multiple supérieur de SUGGESTION_ARRONDI. Jamais appliqué tout seul.
   ============================================================== */
function arrondiSuggestion(m){ return Math.ceil((Number(m) || 0) / SUGGESTION_ARRONDI) * SUGGESTION_ARRONDI; }
function calculSuggestion(r, depenses, budget){
  if(!r || !r.active || estEpargne(r) || estAClasser(r)) return null;
  if((Number(budget) || 0) > 0) return null;
  var lignes = horsAjustements(depenses).filter(function(d){
    return d.rubrique === r.id && (Number(d.montant) || 0) > 0;
  });
  if(lignes.length < SUGGESTION_MIN_DEPENSES) return null;
  var total = lignes.reduce(function(t, d){ return t + (Number(d.montant) || 0); }, 0);
  return {depense: total, montant: arrondiSuggestion(total), nb: lignes.length};
}
function suggestionIgnoree(id){ return reglage("suggestionsIgnorees").indexOf(id) >= 0; }
function suggestionBudget(r){
  if(!r || suggestionIgnoree(r.id)) return null;
  return calculSuggestion(r, S.depenses, r.montant);
}
function fixerSuggestion(r, montant){
  r.montant = montant;
  if((r.periodicite || "mensuel") === "mensuel") r.montantReel = montant;
  sauver();
}
function ignorerSuggestion(id){
  var l = reglage("suggestionsIgnorees").filter(function(x){ return typeof x === "string"; });
  if(l.indexOf(id) < 0) l.push(id);
  regler("suggestionsIgnorees", l);
}
/* « Sans enveloppe · dépensé … F · fixer à … F ? »  [Fixer]  [×] */
function blocSuggestion(sug, onFixer, onIgnorer, classe){

  t.appendChild(el("b", null, fmtF(sug.montant)));

  w.appendChild(t);

  bF.type = "button";

  bF.addEventListener("click", function(e){ e.stopPropagation(); onFixer(sug.montant); });
  var bX = el("button", "sugg-x", "×");

  bX.setAttribute("aria-label", "Ignorer cette suggestion");

/* Redessine l'écran sans remonter en haut de la page */
function rafraichirSurPlace(){
