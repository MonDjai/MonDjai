<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MonDjai — Budget par enveloppes</title>
<meta name="description" content="MonDjai : le budget personnel par enveloppes, en FCFA.">
<meta name="theme-color" content="#0F1218">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MonDjai">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-512.png">
<link rel="apple-touch-icon" href="./icon-512.png">
<style>
/* ============================================================
   MonDjai — feuille de style (tout est dans ce fichier)
   ============================================================ */
:root{
  color-scheme:dark;
  --bg:#0F1218;
  --surface:#171C25;
  --surface-2:#1F2632;
  --line:#2A323F;
  --text:#ECEFF5;
  --muted:#98A2B4;
  --gold:#F2A93B;
  --gold-soft:rgba(242,169,59,.13);
  --green:#3FB27F;
  --green-soft:rgba(63,178,127,.13);
  --orange:#E8901F;
  --orange-soft:rgba(232,144,31,.14);
  --red:#E5484D;
  --red-soft:rgba(229,72,77,.13);
  --r:14px;
  --pad:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}

/* --- structure --- */
.app{max-width:560px;margin:0 auto;padding:0 var(--pad)}
header.top{
  position:sticky;top:0;z-index:20;background:rgba(15,18,24,.92);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
.top-in{max-width:560px;margin:0 auto;padding:12px var(--pad);display:flex;align-items:baseline;gap:10px}
.mark{font-weight:800;letter-spacing:-.03em;font-size:19px}
.mark em{font-style:normal;color:var(--gold)}
.eyebrow{
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  font-weight:700;margin-left:auto
}
main{padding-top:20px;padding-bottom:200px}

h1{font-size:24px;line-height:1.2;letter-spacing:-.02em;margin:0 0 6px;font-weight:800}
.sub{color:var(--muted);font-size:14px;margin:0 0 22px}
h2{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px;font-weight:700}

/* --- blocs --- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card + .card{margin-top:10px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.big{font-size:30px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}

/* --- boutons --- */
.btn{
  border:1px solid var(--line);background:var(--surface-2);color:var(--text);
  border-radius:11px;padding:12px 14px;font-weight:600;font-size:15px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%
}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--gold);color:#141414;border-color:var(--gold);font-weight:700}
.btn-primary[disabled]{opacity:.35;pointer-events:none}
.btn-ghost{background:transparent}
.btn-line{width:auto;padding:9px 12px;font-size:14px;border-radius:10px}
.btn-danger{color:var(--red);border-color:rgba(229,72,77,.35);background:transparent}
.row-btns{display:flex;gap:8px}
.row-btns .btn{flex:1}

/* --- jour de salaire --- */
.jours{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.jour{
  border:1px solid var(--line);background:var(--surface);border-radius:9px;
  padding:0;height:40px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)
}
.jour[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#141414;font-weight:800}
.jour-dernier{margin-top:8px}
.jour-dernier[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#141414}

/* --- champs --- */
.ligne{
  display:flex;align-items:center;gap:10px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:8px
}
.ligne .lib{
  flex:1;min-width:0;background:transparent;border:0;padding:6px 0;font-size:15px;font-weight:600
}
.ligne .lib::placeholder{color:var(--muted);font-weight:500}
.money{
  width:130px;text-align:right;background:var(--surface-2);border:1px solid var(--line);
  border-radius:9px;padding:9px 10px;font-variant-numeric:tabular-nums;font-weight:700;font-size:15px
}
.money:focus{border-color:var(--gold);outline:none}
.money.vide{color:var(--muted);font-weight:600}
.del{
  background:transparent;border:0;color:var(--muted);font-size:20px;line-height:1;
  padding:6px 2px;width:28px;flex:none
}
.total-ligne{display:flex;align-items:baseline;justify-content:space-between;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}

/* --- menu ajout revenu --- */
.menu{margin-top:8px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.menu button{display:block;width:100%;text-align:left;background:transparent;border:0;padding:13px 14px;font-size:15px}
.menu button + button{border-top:1px solid var(--line)}

/* --- rubriques --- */
.rub{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:11px 12px;margin-bottom:8px
}
.rub[aria-pressed="true"]{border-color:rgba(242,169,59,.5);background:var(--gold-soft)}
.ico{
  width:36px;height:36px;flex:none;border-radius:10px;display:grid;place-items:center;
  font-size:18px;background:var(--surface-2)
}
.rub .nom{flex:1;min-width:0;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.check{
  width:22px;height:22px;flex:none;border-radius:7px;border:1.5px solid var(--line);
  display:grid;place-items:center;font-size:13px;color:transparent
}
.rub[aria-pressed="true"] .check{background:var(--gold);border-color:var(--gold);color:#141414;font-weight:900}
.perso-tag{font-size:11px;color:var(--muted);flex:none}

/* --- formulaire rubrique perso --- */
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px}
.input,select.input{
  width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:15px
}
.input:focus{border-color:var(--gold);outline:none}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:34px;height:34px;border-radius:10px;border:2px solid transparent}
.sw[aria-pressed="true"]{border-color:var(--text)}
.emojis{display:flex;flex-wrap:wrap;gap:6px}
.em{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:18px}
.em[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft)}

/* --- répartition --- */
.repart{
  display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);
  border-left:3px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:8px
}
.repart .nom{flex:1;min-width:0;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.repart .pct{display:block;font-weight:500;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.reste-ici{
  background:transparent;border:1px solid var(--line);border-radius:9px;color:var(--muted);
  font-size:11px;font-weight:700;padding:7px 8px;flex:none;letter-spacing:.04em
}

/* --- jauge (élément signature) --- */
.jauge-wrap{margin:2px 0 10px}
.jauge{
  display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--surface-2);
  border:1px solid var(--line)
}
.seg{height:100%;flex:none;transition:width .18s ease}
.seg-vide{
  flex:1;background:repeating-linear-gradient(135deg,transparent 0 5px,rgba(255,255,255,.06) 5px 10px)
}

/* --- barre collante --- */
.sticky{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:rgba(15,18,24,.94);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
  padding:12px var(--pad) calc(12px + env(safe-area-inset-bottom))
}
.sticky-in{max-width:560px;margin:0 auto}
.reste-line{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:10px}
.reste-line .lab{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.reste-val{font-size:26px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.deficit{color:var(--red)}
.ok{color:var(--green)}
.banner{
  background:var(--red-soft);border:1px solid rgba(229,72,77,.35);color:var(--red);
  border-radius:11px;padding:11px 12px;font-weight:700;font-size:14px;margin-bottom:10px
}
.doux{
  background:var(--gold-soft);border:1px solid rgba(242,169,59,.3);color:var(--gold);
  border-radius:11px;padding:10px 12px;font-size:13px;font-weight:600;margin-bottom:10px
}

/* --- tableau de bord --- */
.tb-tete{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.tb-ligne{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.tb-ligne:last-child{border-bottom:0}
.pastille{width:10px;height:10px;border-radius:99px;flex:none}
.tb-ligne .nom{flex:1;min-width:0;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-mont{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.tb-mont small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.vide-msg{color:var(--muted);font-size:14px;padding:14px 0}

/* --- Sprint 2 : jauges par rubrique --- */
.jauge-r{height:9px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.jauge-r > i{display:block;height:100%;border-radius:99px;transition:width .2s ease;min-width:0}
.env{
  display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:12px;margin-bottom:8px
}
.env:active{transform:translateY(1px)}
.env.alerte{border-color:rgba(229,72,77,.4)}
.env-haut{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.env-haut .nom{flex:1;min-width:0;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.env-mont{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;flex:none}
.env-mont small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.env-bas{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:7px;font-size:12px;font-variant-numeric:tabular-nums}
.c-vert{color:var(--green)}
.c-orange{color:var(--orange)}
.c-rouge{color:var(--red)}
.c-neutre{color:var(--muted)}
.chev{color:var(--muted);font-size:18px;flex:none;line-height:1}
.tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 7px;flex:none}

/* --- bouton flottant « + » --- */
.fab{
  position:fixed;z-index:40;right:20px;bottom:calc(22px + env(safe-area-inset-bottom));
  width:62px;height:62px;border-radius:99px;border:0;background:var(--gold);color:#141414;
  font-size:32px;font-weight:800;line-height:1;display:grid;place-items:center;
  box-shadow:0 8px 24px rgba(0,0,0,.45)
}
.fab:active{transform:translateY(1px)}
@media (min-width:620px){ .fab{right:calc(50% - 280px + 8px)} }

/* --- feuille plein écran (saisie de dépense) --- */
.sheet{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-top{
  position:sticky;top:0;z-index:2;background:rgba(15,18,24,.96);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)
}
.sheet-top-in{max-width:560px;margin:0 auto;padding:10px var(--pad);display:flex;align-items:center;gap:10px}
.sheet-titre{font-weight:800;font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{
  width:38px;height:38px;flex:none;border-radius:11px;border:1px solid var(--line);
  background:var(--surface-2);display:grid;place-items:center;font-size:19px;line-height:1;padding:0
}
.sheet-body{max-width:560px;margin:0 auto;padding:18px var(--pad) 120px}

.grille-rub{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.tuile{
  display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface);
  border:1px solid var(--line);border-radius:14px;padding:12px 6px 10px;min-height:104px
}
.tuile:active{transform:translateY(1px)}
.tuile .ico{width:44px;height:44px;font-size:22px}
.tuile .t-nom{
  font-size:11.5px;line-height:1.15;font-weight:600;text-align:center;width:100%;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden
}
.tuile .jauge-r{width:100%;height:5px;margin-top:auto}

.montant-xl{
  width:100%;background:transparent;border:0;border-bottom:2px solid var(--line);
  font-size:40px;font-weight:800;letter-spacing:-.03em;text-align:center;
  font-variant-numeric:tabular-nums;padding:4px 0 8px
}
.montant-xl:focus{border-bottom-color:var(--gold);outline:none}
.devise{text-align:center;color:var(--muted);font-size:13px;font-weight:700;letter-spacing:.14em;margin:6px 0 18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  border:1px solid var(--line);background:var(--surface-2);border-radius:99px;
  padding:9px 13px;font-size:13px;font-weight:600
}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#141414}
.info-env{
  border-radius:11px;padding:10px 12px;font-size:13px;font-weight:600;margin:0 0 16px;
  background:var(--surface);border:1px solid var(--line);color:var(--muted)
}
.info-env.vert{background:var(--green-soft);border-color:rgba(63,178,127,.3);color:var(--green)}
.info-env.orange{background:var(--orange-soft);border-color:rgba(232,144,31,.3);color:var(--orange)}
.info-env.rouge{background:var(--red-soft);border-color:rgba(229,72,77,.3);color:var(--red)}
.rub-choisie{
  display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:10px 12px;margin-bottom:18px;width:100%;text-align:left
}
.rub-choisie .nom{flex:1;min-width:0;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rub-choisie .chg{font-size:12px;color:var(--gold);font-weight:700;flex:none}

/* --- liste des dépenses --- */
.dep{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.dep:last-child{border-bottom:0}
.dep-main{
  display:flex;align-items:center;gap:12px;flex:1;min-width:0;background:transparent;border:0;
  padding:12px 0;text-align:left
}
.d-txt{flex:1;min-width:0}
.d-lib{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.d-date{font-size:12px;color:var(--muted)}
.d-mont{font-weight:700;font-variant-numeric:tabular-nums;flex:none}

/* --- message de confirmation --- */
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));
  z-index:90;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;
  padding:11px 18px;font-size:14px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.45);
  transition:opacity .25s ease
}

/* --- Sprint 3 : regroupement par groupe --- */
.grp{margin:20px 0 9px}
.grp-t{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:7px}
.grp-nom{font-size:13px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.grp-mont{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600;flex:none}
.grp .jauge-r{height:6px}

/* --- Sprint 3 : avis (nouveau cycle, rappel de sauvegarde) --- */
.avis{
  background:var(--gold-soft);border:1px solid rgba(242,169,59,.35);
  border-radius:var(--r);padding:13px 14px;margin-bottom:12px
}
.avis-t{font-weight:800;font-size:15px;color:var(--gold);margin-bottom:3px}
.avis-p{margin:0 0 10px;font-size:13.5px;color:var(--muted);line-height:1.4}
.avis .btn{margin-top:0}
.avis .row-btns{margin-top:0}

/* --- Sprint 3 : historique --- */
.cyc{
  display:block;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);padding:13px;margin-bottom:8px
}
.cyc:active{transform:translateY(1px)}
.cyc-h{display:flex;align-items:center;gap:8px}
.cyc-per{font-weight:700;font-size:15px;flex:1;min-width:0}
.cyc-g{display:flex;gap:16px;margin-top:9px}
.cyc-g div{font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.cyc-g b{display:block;color:var(--text);font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.cyc-g b.c-rouge{color:var(--red)}
.cyc-g b.c-vert{color:var(--green)}

/* --- Sprint 3 : lignes en lecture seule --- */
.ro{padding:11px 0;border-bottom:1px solid var(--line)}
.ro:last-child{border-bottom:0}
.ro-h{display:flex;align-items:center;gap:10px}
.ro-h .nom{flex:1;min-width:0;font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ro-m{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:14.5px;flex:none}
.ro-m small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.ro-b{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:6px;font-size:12px;font-variant-numeric:tabular-nums}
.ro .jauge-r{margin-top:7px}
.ro .ico{width:30px;height:30px;font-size:15px}
.lecture{
  display:inline-block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:3px 9px;font-weight:700
}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <span class="mark">Mon<em>Djai</em></span>
    <span class="eyebrow" id="eyebrow"></span>
  </div>
</header>

<main class="app" id="ecran"></main>
<div id="barre"></div>

<script>
"use strict";
/* ==============================================================
   MonDjai — Sprint 3
   (Sprint 1 : jour de paie, revenus, rubriques, répartition)
   (Sprint 2 : saisie de dépense en 3 taps, tableau de bord à
    jauges, détail des dépenses par rubrique)
   (Sprint 3 : cycles budgétaires, historique, sauvegarde et
    restauration JSON, affichage par groupes)
   Tout est local : aucun appel réseau, aucune bibliothèque.
   ============================================================== */

/* ==============================================================
   Rubriques préconfigurées — section F3 du cahier des charges V3.
   defaut:true = cochée au premier lancement (✔ dans le document)
   groupe      = stocké dès le Sprint 1, affiché à partir du Sprint 3
   ============================================================== */
var RUBRIQUES_F3 = [
  /* --- Fixes --- */
  {id:"loyer",       nom:"Loyer / Logement",              icone:"\uD83C\uDFE0", couleur:"#F2A93B", groupe:"Fixes", defaut:true},
  {id:"famille",     nom:"Famille (soutien régulier)",    icone:"\uD83E\uDD1D", couleur:"#E0A44C", groupe:"Fixes", defaut:true},
  {id:"eauelec",     nom:"Factures eau & électricité",    icone:"\uD83D\uDCA1", couleur:"#F2C94C", groupe:"Fixes", defaut:true},
  {id:"creditdata",  nom:"Crédit & Data",                 icone:"\uD83D\uDCF1", couleur:"#E8B04B", groupe:"Fixes", defaut:true},

/* ---------- utilitaires ---------- */
function uid(){ return "r" + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function fmt(n){
  n = Math.round(Number(n) || 0);
  var neg = n < 0; n = Math.abs(n);
  return (neg ? "-" : "") + String(n).replace(/\B(?=(\d{3})+(?!\d))/g, NBSP);
}
function fmtF(n){ return fmt(n) + NBSP + "F"; }
function pct(n){ return Math.round(Number(n)||0) + NBSP + "%"; }
function chiffres(s){ var d = String(s).replace(/[^0-9]/g,""); return d ? parseInt(d,10) : 0; }
function el(tag, cls, txt){
  var e = document.createElement(tag);
  if(cls) e.className = cls;
  if(txt !== undefined && txt !== null) e.textContent = txt;
  return e;
}

/* ---------- dates ---------- */
function p2(n){ return (n < 10 ? "0" : "") + n; }
function iso(d){ return d.getFullYear() + "-" + p2(d.getMonth()+1) + "-" + p2(d.getDate()); }
function aujourdhui(){ return iso(new Date()); }
function deIso(s){
  var p = String(s || "").split("-");
  var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  return isNaN(d.getTime()) ? new Date() : d;
}
function dateLisible(s){
  if(s === aujourdhui()) return "Aujourd'hui";
  var h = new Date(); h.setDate(h.getDate() - 1);
  if(s === iso(h)) return "Hier";
  var d = deIso(s);
  var txt = d.getDate() + " " + MOIS[d.getMonth()];
  if(d.getFullYear() !== new Date().getFullYear()) txt += " " + d.getFullYear();
  return txt;
}
function dateCourte(s){
  var d = deIso(s);
  return d.getDate() + " " + MOIS[d.getMonth()].slice(0,4) + ".";
}
function dateComplete(s){
  var d = deIso(s);
  return d.getDate() + " " + MOIS[d.getMonth()] + " " + d.getFullYear();
}
/* Prochaine paie : le jour choisi, ramené au dernier jour si le mois est plus court.
   Le jour peut être passé en paramètre (utile avant que l'état ne soit chargé). */
function paieDuMois(annee, mois, jourOpt){
  var dernier = new Date(annee, mois + 1, 0).getDate();
  var js = (jourOpt === undefined) ? S.jourSalaire : jourOpt;
  var j = (js === "dernier") ? dernier : Math.min(Number(js) || 1, dernier);
  return new Date(annee, mois, j);
}
/* Sprint 3 — date de paie la plus récente à ce jour : début théorique du cycle */
function debutCycleTheorique(jourOpt, refIso){
  var t = refIso ? deIso(refIso) : new Date();
  t.setHours(0,0,0,0);
  var js = (jourOpt === undefined) ? S.jourSalaire : jourOpt;
  if(js === null || js === undefined) return iso(t);
  var c = paieDuMois(t.getFullYear(), t.getMonth(), js);
  if(c.getTime() > t.getTime()) c = paieDuMois(t.getFullYear(), t.getMonth() - 1, js);
  return iso(c);
}
/* Première date de paie strictement postérieure à une date donnée */
function paieApres(dateIso){
  var d = deIso(dateIso); d.setHours(0,0,0,0);
  var c = paieDuMois(d.getFullYear(), d.getMonth());
  if(c.getTime() <= d.getTime()) c = paieDuMois(d.getFullYear(), d.getMonth() + 1);
  return c;
}
function prochainePaie(){
  if(S.jourSalaire === null || S.jourSalaire === undefined) return null;
  var t = new Date(); t.setHours(0,0,0,0);
  var c = paieDuMois(t.getFullYear(), t.getMonth());
  if(c.getTime() <= t.getTime()) c = paieDuMois(t.getFullYear(), t.getMonth() + 1);
  return c;
}
function joursAvantPaie(){
  var p = prochainePaie();
  if(!p) return null;
  var t = new Date(); t.setHours(0,0,0,0);
  return Math.max(1, Math.round((p.getTime() - t.getTime()) / 86400000));
}
function motJours(n){ return n + (n > 1 ? " jours" : " jour"); }

              active:!!r.defaut, montant:0, perso:false};
    }),

/* Remise en forme et migration silencieuse.
   Sert au chargement local ET à la restauration d'un fichier.
   Renvoie null si le contenu n'a rien d'un état MonDjai. */
function normaliser(o){
  if(!o || typeof o !== "object") return null;
  if(!Array.isArray(o.rubriques) || !Array.isArray(o.revenus)) return null;

  var rubs = o.rubriques.filter(function(r){
    return r && typeof r.id === "string" && typeof r.nom === "string";
  }).map(function(r){
    return {
      id: r.id, nom: r.nom,
      icone: r.icone || "\uD83D\uDCB8",
      couleur: r.couleur || COULEURS[0],
      groupe: r.groupe || "Vie courante",
      active: !!r.active,
      montant: Number(r.montant) || 0,
      perso: !!r.perso
    };
  });
  if(!rubs.length) return null;
  o.rubriques = rubs;

  o.revenus = o.revenus.filter(function(r){ return r && typeof r === "object"; })
    .map(function(r){
      return {id: r.id || uid(), libelle: String(r.libelle || ""), montant: Number(r.montant) || 0};
    });
  if(!o.revenus.length) o.revenus = [{id: uid(), libelle: "Salaire net", montant: 0}];

  o.depenses = (Array.isArray(o.depenses) ? o.depenses : []).filter(function(d){
    return d && typeof d.rubrique === "string" && Number(d.montant) > 0;
  }).map(function(d){
    return {id: d.id || uid(), rubrique: d.rubrique, montant: Number(d.montant) || 0,
            libelle: String(d.libelle || ""), date: d.date || aujourdhui(), cree: Number(d.cree) || 0};
  });

  if(o.jourSalaire !== "dernier"){
    var j = Number(o.jourSalaire);
    o.jourSalaire = (j >= 1 && j <= 31) ? j : null;
  }
  o.onboarded = !!o.onboarded;

  /* --- Sprint 3 : les données existantes deviennent le premier cycle --- */
  if(!o.cycleId) o.cycleId = uid();
  if(!o.cycleDebut) o.cycleDebut = debutCycleTheorique(o.jourSalaire);
  o.cycles = (Array.isArray(o.cycles) ? o.cycles : []).filter(function(c){
    return c && typeof c === "object" && Array.isArray(c.rubriques);
  }).map(function(c){
    return {
      id: c.id || uid(),
      debut: c.debut || aujourdhui(),
      fin: c.fin || c.debut || aujourdhui(),
      jourSalaire: (c.jourSalaire === undefined ? o.jourSalaire : c.jourSalaire),
      revenus: (Array.isArray(c.revenus) ? c.revenus : []).map(function(r){
        return {id: r.id || uid(), libelle: String(r.libelle || ""), montant: Number(r.montant) || 0};
      }),
      rubriques: c.rubriques.filter(function(r){ return r && typeof r.id === "string"; })
        .map(function(r){
          return {id: r.id, nom: String(r.nom || "Rubrique"), icone: r.icone || "\uD83D\uDCB8",
                  couleur: r.couleur || COULEURS[0], groupe: r.groupe || "Vie courante",
                  montant: Number(r.montant) || 0};
        }),
      depenses: (Array.isArray(c.depenses) ? c.depenses : []).filter(function(d){
        return d && typeof d.rubrique === "string";
      }).map(function(d){
        return {id: d.id || uid(), rubrique: d.rubrique, montant: Number(d.montant) || 0,
                libelle: String(d.libelle || ""), date: d.date || c.debut || aujourdhui(),
                cree: Number(d.cree) || 0};
      })
    };
  });
  o.rappelSauvegarde = !!o.rappelSauvegarde;
  if(typeof o.derniereSauvegarde !== "string") o.derniereSauvegarde = null;
  o.version = 4;
  return o;
}

function charger(){
  try{
    var brut = localStorage.getItem(CLE);
    if(brut){
      var o = normaliser(JSON.parse(brut));
      if(o) return o;
    }
  }catch(e){}
  return neuf();
}
function sauver(){
  try{ localStorage.setItem(CLE, JSON.stringify(S)); }catch(e){}
}

/* ---------- calculs ---------- */
function totalRevenus(){
  return S.revenus.reduce(function(t,r){ return t + (Number(r.montant)||0); }, 0);
}
function actives(){
  return S.rubriques.filter(function(r){ return r.active; });
}
function totalReparti(){
  return actives().reduce(function(t,r){ return t + (Number(r.montant)||0); }, 0);
}
function reste(){ return totalRevenus() - totalReparti(); }
function libelleJour(){
  if(S.jourSalaire === "dernier") return "le dernier jour du mois";
  if(S.jourSalaire === 1) return "le 1er de chaque mois";
  if(S.jourSalaire) return "le " + S.jourSalaire + " de chaque mois";
  return "—";
}
function rubriqueParId(id){
  for(var i = 0; i < S.rubriques.length; i++){ if(S.rubriques[i].id === id) return S.rubriques[i]; }
  return null;
}
function depensesDe(id){
  return S.depenses.filter(function(d){ return d.rubrique === id; });
}
function depenseRub(id){
  return depensesDe(id).reduce(function(t,d){ return t + (Number(d.montant)||0); }, 0);
}
function totalDepense(){
  return S.depenses.reduce(function(t,d){ return t + (Number(d.montant)||0); }, 0);
}
function disponible(){ return totalRevenus() - totalDepense(); }
/* Tri : les plus récentes d'abord */
function triDepenses(liste){
  return liste.slice().sort(function(a,b){
    if(a.date === b.date) return (b.cree||0) - (a.cree||0);
    return a.date < b.date ? 1 : -1;
  });
}
/* F5 : vert < 70 % · orange 70–99 % · rouge en dépassement */
function etatJauge(depense, affecte){
  if(affecte <= 0) return depense > 0 ? "rouge" : "neutre";
  var p = depense / affecte * 100;
  if(p > 100) return "rouge";
  if(p >= 70) return "orange";
  return "vert";
}
function couleurEtat(e){
  return e === "rouge" ? "var(--red)" : e === "orange" ? "var(--orange)"
       : e === "vert" ? "var(--green)" : "var(--muted)";
}
function classeEtat(e){
  return e === "rouge" ? "c-rouge" : e === "orange" ? "c-orange" : e === "vert" ? "c-vert" : "c-neutre";
}
/* petite jauge : dépensé / affecté */
function jaugeRub(depense, affecte){
  var wrap = el("div", "jauge-r");
  var b = document.createElement("i");
  var base = Math.max(affecte, depense, 1);
  var p = Math.min(100, depense / base * 100);
  b.style.width = (depense > 0 ? Math.max(p, 3) : 0) + "%";
  b.style.background = couleurEtat(etatJauge(depense, affecte));
  wrap.appendChild(b);
  return wrap;
}

/* ==============================================================
   SPRINT 3 — CYCLES BUDGÉTAIRES (F1)
   ============================================================== */

/* Le cycle en cours est-il arrivé à échéance ? */
function cycleAEcheance(){
  if(!S.onboarded || S.jourSalaire === null || S.jourSalaire === undefined) return false;
  var t = new Date(); t.setHours(0,0,0,0);
  return t.getTime() >= paieApres(S.cycleDebut || aujourdhui()).getTime();
}
function periodeCycle(c){
  return dateComplete(c.debut) + " → " + dateComplete(c.fin);
}
function cycleParId(id){
  for(var i = 0; i < S.cycles.length; i++){ if(S.cycles[i].id === id) return S.cycles[i]; }
  return null;
}
/* Photographie du cycle en cours, telle qu'elle sera archivée */
function instantaneCycle(){
  return {
    id: S.cycleId || uid(),
    debut: S.cycleDebut || aujourdhui(),
    fin: aujourdhui(),
    jourSalaire: S.jourSalaire,
    revenus: S.revenus.map(function(r){
      return {id: r.id, libelle: r.libelle, montant: Number(r.montant) || 0};
    }),
    /* on garde les rubriques qui ont reçu un montant, porté une dépense, ou qui sont actives */
    rubriques: S.rubriques.filter(function(r){
      return r.active || (Number(r.montant) || 0) > 0 || depenseRub(r.id) > 0;
    }).map(function(r){
      return {id: r.id, nom: r.nom, icone: r.icone, couleur: r.couleur,
              groupe: r.groupe, montant: Number(r.montant) || 0};
    }),
    depenses: S.depenses.map(function(d){
      return {id: d.id, rubrique: d.rubrique, montant: Number(d.montant) || 0,
              libelle: d.libelle || "", date: d.date, cree: d.cree || 0};
    })
  };
}
/* --- calculs sur un cycle archivé --- */
function cycRevenus(c){
  return c.revenus.reduce(function(t,r){ return t + (Number(r.montant)||0); }, 0);
}
function cycReparti(c){
  return c.rubriques.reduce(function(t,r){ return t + (Number(r.montant)||0); }, 0);
}
function cycDepenseRub(c, id){
  return c.depenses.reduce(function(t,d){
    return t + (d.rubrique === id ? (Number(d.montant)||0) : 0);
  }, 0);
}
function cycDepense(c){
  return c.depenses.reduce(function(t,d){ return t + (Number(d.montant)||0); }, 0);
}

/* Préparer un nouveau cycle : revenus et répartition préremplis, modifiables */
function ouvrirNouveauCycle(){
  brouillonCycle = {
    revenus: S.revenus.map(function(r){
      return {id: uid(), libelle: r.libelle, montant: Number(r.montant) || 0};
    }),
    montants: {}
  };
  actives().forEach(function(r){ brouillonCycle.montants[r.id] = Number(r.montant) || 0; });
  aller("nouveauCycle");
}
function brTotalRevenus(){
  if(!brouillonCycle) return 0;
  return brouillonCycle.revenus.reduce(function(t,r){ return t + (Number(r.montant)||0); }, 0);
}
function brTotalReparti(){
  if(!brouillonCycle) return 0;
  return actives().reduce(function(t,r){ return t + (Number(brouillonCycle.montants[r.id])||0); }, 0);
}
/* Clôture de l'ancien cycle, ouverture du nouveau */
function validerNouveauCycle(){
  if(!brouillonCycle) return;
  var b = brouillonCycle;
  S.cycles.unshift(instantaneCycle());       /* le plus récent en tête */
  S.cycleId = uid();
  S.cycleDebut = aujourdhui();
  S.revenus = b.revenus.map(function(r){
    return {id: uid(), libelle: r.libelle || "Revenu", montant: Number(r.montant) || 0};
  });
  if(!S.revenus.length) S.revenus = [{id: uid(), libelle: "Salaire net", montant: 0}];
  S.rubriques.forEach(function(r){
    r.montant = r.active ? (Number(b.montants[r.id]) || 0) : 0;
  });
  S.depenses = [];
  S.rappelSauvegarde = true;                 /* rappel doux à chaque clôture (F7) */
  brouillonCycle = null;
  sauver();
  aller("dashboard");
  toast("Nouveau cycle démarré ✓");
}

   ============================================================== */
/* Groupes réellement représentés, dans l'ordre du cahier des charges.
   Les groupes vides ne sont jamais renvoyés. */
function groupesPresents(liste){
  var vus = [], out = [];
  liste.forEach(function(r){
    var g = r.groupe || "Autres";
    if(vus.indexOf(g) < 0) vus.push(g);
  });
  GROUPES.forEach(function(g){ if(vus.indexOf(g) >= 0) out.push(g); });
  vus.forEach(function(g){ if(out.indexOf(g) < 0) out.push(g); });
  return out;
}
function membresGroupe(liste, g){
  return liste.filter(function(r){ return (r.groupe || "Autres") === g; });
}
/* En-tête de groupe : nom + sous-total dépensé / affecté */
function enteteGroupe(nom, affecte, depense){
  var h = el("div", "grp");
  var t = el("div", "grp-t");
  t.appendChild(el("span", "grp-nom", nom));
  t.appendChild(el("span", "grp-mont", fmtF(depense) + " / " + fmtF(affecte)));
  h.appendChild(t);
  h.appendChild(jaugeRub(depense, affecte));
  return h;
}

/* ==============================================================
   SPRINT 3 — SAUVEGARDE ET RESTAURATION (F7)
   Tout se passe sur l'appareil : aucun envoi, aucun réseau.
   ============================================================== */
function sauvegarderDonnees(){
  var ok = false;
  try{
    var texte = JSON.stringify(S, null, 2);
    var blob = new Blob([texte], {type: "application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "mondjai-sauvegarde-" + aujourdhui() + ".json";
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){
      if(a.parentNode) a.parentNode.removeChild(a);
      URL.revokeObjectURL(url);
    }, 1500);
    ok = true;
  }catch(e){ ok = false; }
  if(ok){
    S.derniereSauvegarde = aujourdhui();

function restaurerDonnees(){
  var input = document.createElement("input");
  input.type = "file";
  input.accept = "application/json,.json";
  input.style.display = "none";
  document.body.appendChild(input);
  input.addEventListener("change", function(){
    var f = input.files && input.files[0];
    if(!f){ if(input.parentNode) input.parentNode.removeChild(input); return; }
    var lecteur = new FileReader();
    lecteur.onload = function(){
      var objet = null;
      try{ objet = normaliser(JSON.parse(String(lecteur.result))); }catch(e){ objet = null; }
      if(!objet){
        alert("Ce fichier n'est pas une sauvegarde MonDjai valide.\n\nChoisissez un fichier « mondjai-sauvegarde-….json » créé par l'application. Vos données actuelles n'ont pas été touchées.");
      }else{
        var res = objet.cycles.length;
        var msg = "Restaurer cette sauvegarde ?\n\n"
                + "Elle contient " + objet.rubriques.length + " rubriques, "
                + objet.depenses.length + " dépenses dans le cycle en cours et "
                + res + (res > 1 ? " cycles archivés" : " cycle archivé") + ".\n\n"
                + "Toutes les données actuellement sur cet appareil seront remplacées.";
        if(confirm(msg)){
          S = objet;
          sauver();
          rubOuverte = null; cycleOuvert = null; brouillonCycle = null;
          vue = S.onboarded ? "dashboard" : "revenus";
          render();
          toast("Sauvegarde restaurée ✓");
        }
      }
      if(input.parentNode) input.parentNode.removeChild(input);
    };
    lecteur.onerror = function(){
      alert("Le fichier n'a pas pu être lu. Vos données actuelles n'ont pas été touchées.");
      if(input.parentNode) input.parentNode.removeChild(input);
    };
    lecteur.readAsText(f);
  });
  input.click();
}

/* ---------- champ montant ---------- */
function champMontant(valeur, onChange){
  var i = document.createElement("input");
  i.type = "text";
  i.inputMode = "numeric";
  i.className = "money" + (valeur ? "" : " vide");
  i.value = valeur ? fmt(valeur) : "0";
  i.setAttribute("aria-label", "Montant en francs CFA");
  i.addEventListener("focus", function(){ if(chiffres(i.value) === 0) i.value = ""; });
  i.addEventListener("input", function(){
    var v = chiffres(i.value);
    i.value = v ? fmt(v) : "";
    i.classList.toggle("vide", v === 0);
    onChange(v);
  });
  i.addEventListener("blur", function(){
    var v = chiffres(i.value);
    i.value = fmt(v);
    i.classList.toggle("vide", v === 0);
  });
  return i;
}

/* ---------- petit message de confirmation ---------- */
function toast(txt){
  var t = el("div", "toast", txt);
  document.body.appendChild(t);
  setTimeout(function(){ t.style.opacity = "0"; }, 1300);
  setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 1700);
}

/* --- jauge segmentée (élément signature) --- */
function dessinerJauge(jauge){
  jauge.innerHTML = "";
  var tot = totalRevenus(), rep = totalReparti();
  var base = Math.max(tot, rep);
  if(base <= 0){ jauge.appendChild(el("div", "seg seg-vide")); return; }
  actives().forEach(function(r){
    var m = Number(r.montant) || 0;
    if(m <= 0) return;
    var s = el("div", "seg");
    s.style.width = (m / base * 100) + "%";
    s.style.background = rep > tot ? "var(--red)" : r.couleur;
    jauge.appendChild(s);
  });
  if(rep < tot){
    var v = el("div", "seg seg-vide");
    v.style.flex = "none";
    v.style.width = ((tot - rep) / base * 100) + "%";
    jauge.appendChild(v);
  }
}

/* ==============================================================

   1) bouton « + » flottant  2) grille des rubriques
   3) montant (+ libellé facultatif + date) → validation
   ============================================================== */
var feuille = null; /* feuille plein écran ouverte, ou null */

function boutonPlus(parent, rubriquePrechoisie){
  var f = el("button", "fab", "+");
  f.type = "button";

  f.addEventListener("click", function(){
    ouvrirDepense({rubrique: rubriquePrechoisie || null});
  });
  parent.appendChild(f);
  return f;

function fermerFeuille(viaRetour){
  if(!feuille) return;
  if(feuille.parentNode) feuille.parentNode.removeChild(feuille);
  feuille = null;
  document.body.style.overflow = "";
  if(!viaRetour){ try{ history.back(); }catch(e){} }
}
window.addEventListener("popstate", function(){
  if(feuille) fermerFeuille(true);
});
document.addEventListener("keydown", function(e){
  if(e.key === "Escape" && feuille) fermerFeuille(false);
});

function ouvrirDepense(opts){
  opts = opts || {};
  var edition = opts.edit || null;
  var etat = {
    rubrique: edition ? edition.rubrique : (opts.rubrique || null),
    montant:  edition ? (Number(edition.montant)||0) : 0,
    libelle:  edition ? (edition.libelle || "") : "",
    date:     edition ? edition.date : aujourdhui()
  };

  var sh = el("div", "sheet");
  sh.setAttribute("role", "dialog");
  sh.setAttribute("aria-modal", "true");

  var top = el("div", "sheet-top");
  var topIn = el("div", "sheet-top-in");
  var bRetour = el("button", "icon-btn", "‹");
  bRetour.type = "button"; bRetour.setAttribute("aria-label", "Retour aux rubriques");
  var titre = el("div", "sheet-titre", edition ? "Modifier la dépense" : "Nouvelle dépense");
  var bFermer = el("button", "icon-btn", "×");
  bFermer.type = "button"; bFermer.setAttribute("aria-label", "Fermer");
  bFermer.addEventListener("click", function(){ fermerFeuille(false); });
  bRetour.addEventListener("click", function(){ etat.rubrique = null; dessiner(); });
  topIn.appendChild(bRetour); topIn.appendChild(titre); topIn.appendChild(bFermer);
  top.appendChild(topIn);
  sh.appendChild(top);

  var body = el("div", "sheet-body");
  sh.appendChild(body);

  document.body.appendChild(sh);
  document.body.style.overflow = "hidden";
  feuille = sh;
  try{ history.pushState({mdFeuille:1}, ""); }catch(e){}

  function dessiner(){
    body.innerHTML = "";
    bRetour.hidden = (etat.rubrique === null);
    if(etat.rubrique === null) etapeGrille(); else etapeMontant();
  }

  /* ---- Tap 2 : la grille des rubriques ---- */
  function etapeGrille(){
    var act = actives();
    body.appendChild(el("p", "sub", act.length ? "Dans quelle enveloppe ?" : "Aucune enveloppe active pour l'instant."));
    if(!act.length){
      var b = el("button", "btn", "Choisir mes rubriques");
      b.type = "button";
      b.addEventListener("click", function(){ fermerFeuille(false); aller("rubriques"); });
      body.appendChild(b);
      return;
    }
    var g = el("div", "grille-rub");
    act.forEach(function(r){
      var t = el("button", "tuile");
      t.type = "button";
      var ic = el("span", "ico", r.icone);
      ic.style.background = "rgba(255,255,255,.05)";
      ic.style.boxShadow = "inset 0 0 0 1px " + r.couleur + "55";
      t.appendChild(ic);
      t.appendChild(el("span", "t-nom", r.nom));
      t.appendChild(jaugeRub(depenseRub(r.id), Number(r.montant)||0));
      t.addEventListener("click", function(){ etat.rubrique = r.id; dessiner(); });
      g.appendChild(t);
    });
    body.appendChild(g);
  }

  /* ---- Tap 3 : montant, libellé facultatif, date ---- */
  function etapeMontant(){
    var r = rubriqueParId(etat.rubrique);
    if(!r){ etat.rubrique = null; dessiner(); return; }

    /* rappel de l'enveloppe choisie (retap = changer) */
    var choisie = el("button", "rub-choisie");
    choisie.type = "button";
    var ic = el("span", "ico", r.icone);
    ic.style.background = "rgba(255,255,255,.05)";
    ic.style.boxShadow = "inset 0 0 0 1px " + r.couleur + "55";
    choisie.appendChild(ic);
    choisie.appendChild(el("span", "nom", r.nom));
    choisie.appendChild(el("span", "chg", "Changer"));
    choisie.addEventListener("click", function(){ etat.rubrique = null; dessiner(); });
    body.appendChild(choisie);

    /* montant */
    var im = document.createElement("input");
    im.type = "text"; im.inputMode = "numeric";
    im.className = "montant-xl";
    im.value = etat.montant ? fmt(etat.montant) : "";
    im.placeholder = "0";
    im.setAttribute("aria-label", "Montant de la dépense en francs CFA");
    im.addEventListener("input", function(){
      var v = chiffres(im.value);
      im.value = v ? fmt(v) : "";
      etat.montant = v;
      majInfo();
    });
    body.appendChild(im);
    body.appendChild(el("div", "devise", "FRANCS CFA"));

    /* information sur l'enveloppe — on informe, on ne bloque jamais */
    var info = el("div", "info-env");
    body.appendChild(info);

    /* libellé facultatif */
    var fL = el("div", "field");
    fL.appendChild(el("label", null, "Libellé (facultatif)"));
    var iL = document.createElement("input");
    iL.type = "text"; iL.className = "input"; iL.maxLength = 60;
    iL.placeholder = "Ex. : gbaka, marché, taxi…";
    iL.value = etat.libelle;
    iL.addEventListener("input", function(){ etat.libelle = iL.value; });
    fL.appendChild(iL);
    body.appendChild(fL);

    /* date : aujourd'hui par défaut, modifiable */
    var fD = el("div", "field");
    fD.appendChild(el("label", null, "Date"));
    var chips = el("div", "chips");
    chips.style.marginBottom = "8px";
    var hier = new Date(); hier.setDate(hier.getDate() - 1);
    var raccourcis = [{lab:"Aujourd'hui", val: aujourdhui()}, {lab:"Hier", val: iso(hier)}];
    var iD = document.createElement("input");
    iD.type = "date"; iD.className = "input"; iD.value = etat.date;
    iD.setAttribute("aria-label", "Date de la dépense");
    raccourcis.forEach(function(rc){
      var c = el("button", "chip", rc.lab);
      c.type = "button";
      c.setAttribute("aria-pressed", etat.date === rc.val ? "true" : "false");
      c.addEventListener("click", function(){
        etat.date = rc.val; iD.value = rc.val;
        chips.querySelectorAll(".chip").forEach(function(x){ x.setAttribute("aria-pressed","false"); });
        c.setAttribute("aria-pressed","true");
      });
      chips.appendChild(c);
    });
    iD.addEventListener("change", function(){
      etat.date = iD.value || aujourdhui();
      chips.querySelectorAll(".chip").forEach(function(x, i){
        x.setAttribute("aria-pressed", etat.date === raccourcis[i].val ? "true" : "false");
      });
    });
    fD.appendChild(chips);
    fD.appendChild(iD);
    body.appendChild(fD);

    /* suppression si l'on modifie une dépense existante */
    if(edition){
      var bSup = el("button", "btn btn-danger", "Supprimer cette dépense");
      bSup.type = "button";
      bSup.style.marginTop = "18px";
      bSup.addEventListener("click", function(){
        if(confirm("Supprimer cette dépense de " + fmtF(edition.montant) + " ?")){
          supprimerDepense(edition.id);
          fermerFeuille(false);
          render();
          toast("Dépense supprimée");
        }
      });
      body.appendChild(bSup);
    }

    /* barre de validation */
    var bar = el("div", "sticky"), inn = el("div", "sticky-in");
    var bOk = el("button", "btn btn-primary", edition ? "Enregistrer les modifications" : "Enregistrer la dépense");
    bOk.type = "button";
    bOk.addEventListener("click", enregistrer);
    inn.appendChild(bOk);
    bar.appendChild(inn);
    sh.appendChild(bar);

    im.addEventListener("keydown", function(e){
      if(e.key === "Enter" && etat.montant > 0){ e.preventDefault(); enregistrer(); }
    });

    function majInfo(){
      var affecte = Number(r.montant) || 0;
      var dejaSansMoi = depenseRub(r.id) - (edition ? (Number(edition.montant)||0) : 0);
      var apres = dejaSansMoi + (Number(etat.montant)||0);
      var restant = affecte - apres;
      var etatC = etatJauge(apres, affecte);
      info.className = "info-env " + (affecte <= 0 ? "" : etatC === "rouge" ? "rouge" : etatC === "orange" ? "orange" : "vert");
      if(affecte <= 0){
        info.textContent = "Aucun montant n'est affecté à cette enveloppe pour l'instant.";
      }else if(restant >= 0){
        info.textContent = "Après cette dépense, il resterait " + fmtF(restant) + " dans « " + r.nom + " ».";
      }else{
        info.textContent = "Cette dépense dépasserait l'enveloppe de " + fmtF(-restant) + ". C'est possible, à vous de voir.";
      }
      bOk.disabled = !(Number(etat.montant) > 0);
    }
    majInfo();
    setTimeout(function(){ try{ im.focus(); }catch(e){} }, 60);
  }

  function enregistrer(){
    if(!(Number(etat.montant) > 0)) return;
    if(edition){
      edition.rubrique = etat.rubrique;
      edition.montant = Number(etat.montant) || 0;
      edition.libelle = (etat.libelle || "").trim();
      edition.date = etat.date || aujourdhui();
    }else{
      S.depenses.push({
        id: uid(),
        rubrique: etat.rubrique,
        montant: Number(etat.montant) || 0,
        libelle: (etat.libelle || "").trim(),
        date: etat.date || aujourdhui(),
        cree: Date.now()
      });
    }
    sauver();
    fermerFeuille(false);
    render();
    toast(edition ? "Modification enregistrée" : "Dépense enregistrée ✓");
  }

  dessiner();
}

function supprimerDepense(id){
  S.depenses = S.depenses.filter(function(d){ return d.id !== id; });
  sauver();
}

/* ==============================================================
   ÉCRAN 4 — Tableau de bord (F5)
   ============================================================== */
function vueDashboard(ec, ba){
  var tot = totalRevenus(), rep = totalReparti(), rst = tot - rep;
  var dep = totalDepense(), dispo = tot - dep;
  var jours = joursAvantPaie();
  var paie = prochainePaie();

  ec.appendChild(el("h1", null, "Tableau de bord"));
  ec.appendChild(el("p", "sub", "Cycle en cours depuis le " + dateComplete(S.cycleDebut) + "."));

  /* --- proposition de nouveau cycle au jour de paie (F1) --- */
  if(cycleAEcheance()){
    var av = el("div", "avis");
    av.appendChild(el("div", "avis-t", "C'est le jour de la paie"));
    av.appendChild(el("p", "avis-p",
      "Vous pouvez clôturer ce cycle et en démarrer un nouveau. Vos revenus et votre répartition seront préremplis à partir du cycle en cours, et resteront modifiables."));
    var bAv = el("button", "btn btn-primary", "J'ai reçu mon salaire");
    bAv.type = "button";
    bAv.addEventListener("click", ouvrirNouveauCycle);
    av.appendChild(bAv);
    ec.appendChild(av);
  }

  /* --- rappel doux de sauvegarde après une clôture (F7) --- */
  if(S.rappelSauvegarde){
    var rs = el("div", "avis");
    rs.appendChild(el("div", "avis-t", "Pensez à sauvegarder"));
    rs.appendChild(el("p", "avis-p",
      "Un cycle vient d'être archivé. Vos données vivent uniquement sur ce téléphone : un fichier de sauvegarde les met à l'abri."));
    var rb2 = el("div", "row-btns");
    var bS = el("button", "btn btn-primary", "Sauvegarder mes données"); bS.type = "button";
    bS.addEventListener("click", sauvegarderDonnees);
    var bP = el("button", "btn btn-ghost", "Plus tard"); bP.type = "button";
    bP.addEventListener("click", function(){ S.rappelSauvegarde = false; sauver(); render(); });
    rb2.appendChild(bP); rb2.appendChild(bS);
    rs.appendChild(rb2);
    ec.appendChild(rs);
  }

  /* --- en-tête : reste global + jours avant la prochaine paie --- */
  var tete = el("div", "tb-tete");
  tete.appendChild(el("div", "lab tiny muted", "IL VOUS RESTE"));
  var grand = el("div", "big", fmtF(Math.max(dispo, 0)));
  if(dispo < 0) grand.className = "big c-rouge";
  tete.appendChild(grand);

  if(jours){
    var phrase = el("div", "small");
    phrase.style.marginTop = "2px";
    phrase.textContent = dispo >= 0
      ? "pour " + motJours(jours) + ", jusqu'à la prochaine paie."
      : "Vous avez dépensé " + fmtF(-dispo) + " de plus que vos revenus, à " + motJours(jours) + " de la paie.";
    tete.appendChild(phrase);
    var quand = el("div", "tiny muted", "Prochaine paie : " + paie.getDate() + " " + MOIS[paie.getMonth()] + ".");
    quand.style.marginTop = "2px";
    tete.appendChild(quand);
  }

  var jg = jaugeRub(dep, tot);
  jg.style.marginTop = "12px";
  tete.appendChild(jg);

  var bas = el("div", "env-bas");
  bas.appendChild(el("span", "muted", "Dépensé : " + fmtF(dep) + " sur " + fmtF(tot)));
  if(jours && dispo > 0){
    bas.appendChild(el("span", "muted", "≈ " + fmtF(Math.floor(dispo / jours)) + " / jour"));
  }
  tete.appendChild(bas);
  ec.appendChild(tete);

  /* --- rappel du déficit de répartition (F2) --- */
  if(rst < 0){
    ec.appendChild(el("div", "banner", "Déficit à combler : " + fmtF(-rst)));
  }

  /* --- enveloppes regroupées par groupe, une jauge par rubrique --- */
  ec.appendChild(el("h2", null, "Vos enveloppes"));
  var act = actives();
  if(act.length === 0){
    var c0 = el("div", "card");
    c0.appendChild(el("div", "vide-msg", "Aucune rubrique active. Ouvrez « Rubriques » pour en choisir."));
    ec.appendChild(c0);
  }else{
    /* les groupes vides ne s'affichent pas */
    groupesPresents(act).forEach(function(g){
      var membres = membresGroupe(act, g);
      if(!membres.length) return;
      var affG = 0, depG = 0;
      membres.forEach(function(r){
        affG += Number(r.montant) || 0;
        depG += depenseRub(r.id);
      });
      ec.appendChild(enteteGroupe(g, affG, depG));
      membres.slice().sort(function(a,b){ return (b.montant||0) - (a.montant||0); })
        .forEach(function(r){ ec.appendChild(carteEnveloppe(r)); });
    });
  }

  /* --- enveloppes désactivées qui portent des dépenses --- */
  var orphelines = S.rubriques.filter(function(r){ return !r.active && depenseRub(r.id) > 0; });
  if(orphelines.length){
    ec.appendChild(el("h2", null, "Rubriques désactivées"));
    orphelines.forEach(function(r){ ec.appendChild(carteEnveloppe(r)); });
  }

  /* --- non affecté --- */
  var card = el("div", "card");
  var l2 = el("div", "tb-ligne");
  var p2b = el("span", "pastille");
  p2b.style.background = "var(--muted)";
  l2.appendChild(p2b);
  l2.appendChild(el("span", "ico", "🗂️"));
  l2.appendChild(el("span", "nom", "Non affecté"));
  var m2 = el("div", "tb-mont", fmtF(Math.max(0, rst)));
  m2.appendChild(el("small", null, "reste disponible"));
  l2.appendChild(m2);
  card.appendChild(l2);
  ec.appendChild(card);

  /* --- dernières dépenses --- */
  var recentes = triDepenses(S.depenses).slice(0, 5);
  if(recentes.length){
    ec.appendChild(el("h2", null, "Dernières dépenses"));
    var cr = el("div", "card");
    recentes.forEach(function(d){ cr.appendChild(ligneDepense(d, true)); });
    ec.appendChild(cr);
  }else{
    var vide = el("div", "card");
    vide.appendChild(el("div", "vide-msg", "Aucune dépense saisie. Appuyez sur le bouton « + » pour commencer."));
    ec.appendChild(vide);
  }

  /* --- cycle --- */
  ec.appendChild(el("h2", null, "Cycle"));
  var bCyc = el("button", "btn", "J'ai reçu mon salaire");
  bCyc.type = "button";
  bCyc.addEventListener("click", ouvrirNouveauCycle);
  ec.appendChild(bCyc);
  var aideCyc = el("p", "tiny muted",
    "Clôture ce cycle et en démarre un nouveau, en avance ou en retard, comme vous voulez. Prochaine paie prévue " +
    (paie ? "le " + paie.getDate() + " " + MOIS[paie.getMonth()] : libelleJour()) + ".");
  aideCyc.style.margin = "8px 0 0";
  ec.appendChild(aideCyc);

  /* --- modifier --- */
  ec.appendChild(el("h2", null, "Modifier"));
  var r1 = el("div", "row-btns");
  var b1 = el("button", "btn", "Répartition"); b1.type = "button";
  b1.addEventListener("click", function(){ aller("repartition"); });
  var b2 = el("button", "btn", "Rubriques"); b2.type = "button";
  b2.addEventListener("click", function(){ aller("rubriques"); });
  r1.appendChild(b1); r1.appendChild(b2);
  ec.appendChild(r1);
  var b3 = el("button", "btn", "Revenus et jour de paie"); b3.type = "button";
  b3.style.marginTop = "8px";
  b3.addEventListener("click", function(){ aller("revenus"); });
  ec.appendChild(b3);

  /* --- historique et données --- */
  ec.appendChild(el("h2", null, "Historique et données"));
  var n = S.cycles.length;
  var bH = el("button", "btn", n ? "Historique (" + n + (n > 1 ? " cycles)" : " cycle)") : "Historique");
  bH.type = "button";
  bH.addEventListener("click", function(){ aller("historique"); });
  ec.appendChild(bH);
  var bs = blocSauvegarde();
  bs.style.marginTop = "8px";
  ec.appendChild(bs);
  var aideS = el("p", "tiny muted", S.derniereSauvegarde
    ? "Dernière sauvegarde : " + dateComplete(S.derniereSauvegarde) + "."
    : "Aucune sauvegarde pour l'instant. Le fichier reste sur votre téléphone.");
  aideS.style.margin = "8px 0 0";
  ec.appendChild(aideS);

  var b4 = el("button", "btn btn-danger", "Réinitialiser MonDjai"); b4.type = "button";
  b4.style.marginTop = "26px";
  b4.addEventListener("click", function(){
    if(confirm("Effacer toutes vos données MonDjai sur cet appareil — cycle en cours et cycles archivés ? Cette action est définitive.\n\nPensez à sauvegarder avant, si vous voulez pouvoir revenir en arrière.")){
      try{ localStorage.removeItem(CLE); }catch(e){}
      S = neuf();
      rubOuverte = null; cycleOuvert = null; brouillonCycle = null;
      vue = "revenus"; render();
    }
  });
  ec.appendChild(b4);

  var note = el("p", "tiny muted", "Vos données restent sur cet appareil.");
  note.style.margin = "14px 0 0";
  ec.appendChild(note);

  /* --- bouton « + » flottant (tap 1) --- */
  boutonPlus(ba, null);
}

/* --- carte d'une enveloppe avec sa jauge --- */
function carteEnveloppe(r){
  var affecte = Number(r.montant) || 0;
  var d = depenseRub(r.id);
  var etat = etatJauge(d, affecte);
  var reste = affecte - d;

  var b = el("button", "env" + (etat === "rouge" ? " alerte" : ""));
  b.type = "button";
  b.setAttribute("aria-label", "Voir les dépenses de " + r.nom);

  var haut = el("div", "env-haut");
  var ic = el("span", "ico", r.icone);
  ic.style.background = "rgba(255,255,255,.05)";
  ic.style.boxShadow = "inset 0 0 0 1px " + r.couleur + "55";
  haut.appendChild(ic);
  haut.appendChild(el("span", "nom", r.nom));
  if(!r.active) haut.appendChild(el("span", "tag", "désactivée"));
  var m = el("div", "env-mont", fmtF(d));
  m.appendChild(el("small", null, "sur " + fmtF(affecte)));
  haut.appendChild(m);
  haut.appendChild(el("span", "chev", "›"));
  b.appendChild(haut);

  b.appendChild(jaugeRub(d, affecte));

  var bas = el("div", "env-bas");
  var g = el("span", classeEtat(etat), affecte > 0 ? pct(d / affecte * 100) + " utilisé" : (d > 0 ? "hors enveloppe" : "rien d'affecté"));
  bas.appendChild(g);
  var dr = el("span", reste < 0 ? "c-rouge" : "muted",
    reste >= 0 ? "Reste " + fmtF(reste) : "Dépassement de " + fmtF(-reste));
  bas.appendChild(dr);
  b.appendChild(bas);

  b.addEventListener("click", function(){ ouvrirRubrique(r.id); });
  return b;
}

/* --- une ligne de dépense (modifiable / supprimable) --- */
function ligneDepense(d, avecRubrique){
  var r = rubriqueParId(d.rubrique);
  var ligne = el("div", "dep");

  var main = el("button", "dep-main");
  main.type = "button";
  main.setAttribute("aria-label", "Modifier cette dépense");
  var ic = el("span", "ico", r ? r.icone : "💸");
  if(r){
    ic.style.background = "rgba(255,255,255,.05)";
    ic.style.boxShadow = "inset 0 0 0 1px " + r.couleur + "55";
  }
  main.appendChild(ic);
  var txt = el("div", "d-txt");
  txt.appendChild(el("div", "d-lib", d.libelle || (r ? r.nom : "Dépense")));
  var sous = dateLisible(d.date);
  if(avecRubrique && r && d.libelle) sous += " · " + r.nom;
  txt.appendChild(el("div", "d-date", sous));
  main.appendChild(txt);
  main.appendChild(el("div", "d-mont", fmtF(d.montant)));
  main.addEventListener("click", function(){ ouvrirDepense({edit: d}); });
  ligne.appendChild(main);

  var sup = el("button", "del", "×");
  sup.type = "button";
  sup.title = "Supprimer";
  sup.setAttribute("aria-label", "Supprimer cette dépense de " + fmt(d.montant) + " francs");
  sup.addEventListener("click", function(){
    if(confirm("Supprimer cette dépense de " + fmtF(d.montant) + " ?")){
      supprimerDepense(d.id);
      render();
      toast("Dépense supprimée");
    }
  });
  ligne.appendChild(sup);
  return ligne;
}

/* ==============================================================
   ÉCRAN 5 — Détail d'une rubrique et de ses dépenses
   ============================================================== */
function vueRubriqueDetail(ec, ba){
  var r = rubriqueParId(rubOuverte);
  if(!r){ aller("dashboard"); return; }

  var affecte = Number(r.montant) || 0;
  var d = depenseRub(r.id);
  var etat = etatJauge(d, affecte);
  var reste = affecte - d;

  var bRet = el("button", "btn btn-ghost btn-line", "‹ Tableau de bord");
  bRet.type = "button";
  bRet.style.marginBottom = "14px";
  bRet.addEventListener("click", function(){ aller("dashboard"); });
  ec.appendChild(bRet);

  var t = el("h1", null, r.icone + " " + r.nom);
  ec.appendChild(t);
  ec.appendChild(el("p", "sub", r.groupe));

  /* résumé */
  var carte = el("div", "tb-tete");
  var haut = el("div", "env-haut");
  var bloc = el("div");
  bloc.style.flex = "1";
  bloc.appendChild(el("div", "lab tiny muted", "DÉPENSÉ"));
  var gr = el("div", "big", fmtF(d));
  if(etat === "rouge") gr.className = "big c-rouge";
  bloc.appendChild(gr);
  bloc.appendChild(el("div", "tiny muted", "sur " + fmtF(affecte) + " affectés"));
  haut.appendChild(bloc);
  carte.appendChild(haut);
  var jg = jaugeRub(d, affecte);
  jg.style.marginTop = "10px";
  carte.appendChild(jg);
  var bas = el("div", "env-bas");
  bas.appendChild(el("span", classeEtat(etat), affecte > 0 ? pct(d / affecte * 100) + " utilisé" : "rien d'affecté"));
  bas.appendChild(el("span", reste < 0 ? "c-rouge" : "muted",
    reste >= 0 ? "Reste " + fmtF(reste) : "Dépassement de " + fmtF(-reste)));
  carte.appendChild(bas);
  ec.appendChild(carte);

  if(reste < 0){
    var msg = el("p", "small muted", "L'enveloppe est dépassée. MonDjai ne bloque rien : à vous de décider où prendre la différence.");
    ec.appendChild(msg);
  }

  /* liste des dépenses */
  var liste = triDepenses(depensesDe(r.id));
  ec.appendChild(el("h2", null, liste.length ? "Ses dépenses (" + liste.length + ")" : "Ses dépenses"));
  var card = el("div", "card");
  if(!liste.length){
    card.appendChild(el("div", "vide-msg", "Aucune dépense dans cette enveloppe pour l'instant."));
  }else{
    liste.forEach(function(dep){ card.appendChild(ligneDepense(dep, false)); });
  }
  ec.appendChild(card);

  var aide = el("p", "tiny muted", "Appuyez sur une dépense pour la modifier, ou sur × pour la supprimer.");
  aide.style.margin = "10px 0 0";
  ec.appendChild(aide);

  /* modifier le montant affecté */
  var bRep = el("button", "btn", "Modifier la répartition");
  bRep.type = "button";
  bRep.style.marginTop = "18px";
  bRep.addEventListener("click", function(){ aller("repartition"); });
  ec.appendChild(bRep);

  /* « + » pré-réglé sur cette enveloppe : 2 taps */
  boutonPlus(ba, r.id);
}

/* ==============================================================
   ÉCRAN 6 — Nouveau cycle (F1)
   Revenus et répartition préremplis à partir du cycle en cours,
   modifiables avant validation. L'ancien cycle est archivé.
   ============================================================== */
function vueNouveauCycle(ec, ba){
  if(!brouillonCycle){ ouvrirNouveauCycle(); return; }
  var b = brouillonCycle;

  var bRet = el("button", "btn btn-ghost btn-line", "‹ Tableau de bord");
  bRet.type = "button";
  bRet.style.marginBottom = "14px";
  bRet.addEventListener("click", function(){ brouillonCycle = null; aller("dashboard"); });
  ec.appendChild(bRet);

  ec.appendChild(el("h1", null, "J'ai reçu mon salaire"));
  ec.appendChild(el("p", "sub",
    "Tout est prérempli à partir du cycle en cours : ajustez ce qui a changé, puis validez. Le cycle démarré le "
    + dateComplete(S.cycleDebut) + " sera archivé avec ses dépenses."));

  /* --- revenus du nouveau cycle --- */
  ec.appendChild(el("h2", null, "Revenus de ce cycle"));
  var liste = el("div");
  ec.appendChild(liste);

  function dessinerRevenus(){
    liste.innerHTML = "";
    b.revenus.forEach(function(rev, idx){
      var l = el("div", "ligne");
      var lib = document.createElement("input");
      lib.type = "text"; lib.className = "lib"; lib.value = rev.libelle;
      lib.placeholder = "Nom du revenu";
      lib.setAttribute("aria-label", "Nom du revenu");
      lib.addEventListener("input", function(){ rev.libelle = lib.value; });
      l.appendChild(lib);
      l.appendChild(champMontant(rev.montant, function(v){ rev.montant = v; maj(); }));
      if(idx > 0){
        var d = el("button", "del", "×");
        d.type = "button"; d.title = "Retirer ce revenu";
        d.setAttribute("aria-label", "Retirer " + (rev.libelle || "ce revenu"));
        d.addEventListener("click", function(){
          b.revenus = b.revenus.filter(function(x){ return x.id !== rev.id; });
          dessinerRevenus(); maj();
        });
        l.appendChild(d);
      }
      liste.appendChild(l);
    });
  }
  dessinerRevenus();

  var bAjout = el("button", "btn btn-ghost", "+ Ajouter un revenu");
  bAjout.type = "button";
  var menu = el("div", "menu");
  menu.hidden = true;
  TYPES_REVENU.forEach(function(t){
    var bt = el("button", null, t);
    bt.type = "button";
    bt.addEventListener("click", function(){
      b.revenus.push({id: uid(), libelle: (t === "Autre" ? "" : t), montant: 0});
      menu.hidden = true; dessinerRevenus(); maj();
    });
    menu.appendChild(bt);
  });
  bAjout.addEventListener("click", function(){ menu.hidden = !menu.hidden; });
  ec.appendChild(bAjout);
  ec.appendChild(menu);

  var tot = el("div", "total-ligne");
  tot.appendChild(el("span", "muted small", "Total des revenus"));
  var totVal = el("span", "big");
  tot.appendChild(totVal);
  ec.appendChild(tot);

  /* --- répartition du nouveau cycle, par groupe --- */
  ec.appendChild(el("h2", null, "Répartition"));
  var act = actives();
  var pcts = {}, champs = {};
  if(!act.length){
    var c0 = el("div", "card");
    c0.appendChild(el("div", "vide-msg", "Aucune rubrique active. Ouvrez « Rubriques » pour en choisir."));
    ec.appendChild(c0);
  }else{
    groupesPresents(act).forEach(function(g){
      var membres = membresGroupe(act, g);
      if(!membres.length) return;
      var h = el("div", "grp");
      var ht = el("div", "grp-t");
      ht.appendChild(el("span", "grp-nom", g));
      var sous = el("span", "grp-mont", "");
      ht.appendChild(sous);
      h.appendChild(ht);
      h.dataset.groupe = g;
      ec.appendChild(h);
      pcts["__grp_" + g] = sous;

      membres.forEach(function(r){
        var row = el("div", "repart");
        row.style.borderLeftColor = r.couleur;
        row.appendChild(el("span", "ico", r.icone));
        var bloc = el("div");
        bloc.style.flex = "1"; bloc.style.minWidth = "0";
        bloc.appendChild(el("div", "nom", r.nom));
        var p = el("span", "pct", "0 %");
        pcts[r.id] = p;
        bloc.appendChild(p);
        row.appendChild(bloc);

        var bReste = el("button", "reste-ici", "+ reste");
        bReste.type = "button";
        bReste.title = "Mettre tout le reste dans cette rubrique";
        row.appendChild(bReste);

        var champ = champMontant(b.montants[r.id] || 0, function(v){ b.montants[r.id] = v; maj(); });
        champs[r.id] = champ;
        row.appendChild(champ);

        bReste.addEventListener("click", function(){
          var rst = brTotalRevenus() - brTotalReparti();
          if(rst <= 0) return;
          b.montants[r.id] = (Number(b.montants[r.id]) || 0) + rst;
          champ.value = fmt(b.montants[r.id]);
          champ.classList.remove("vide");
          maj();
        });
        ec.appendChild(row);
      });
    });
  }

  /* --- barre --- */
  var bar = el("div", "sticky"), inn = el("div", "sticky-in");
  var banniere = el("div", "banner");
  banniere.hidden = true;
  var rl = el("div", "reste-line");
  var gauche = el("div");
  gauche.appendChild(el("div", "lab", "Reste à répartir"));
  var val = el("div", "reste-val");
  gauche.appendChild(val);
  rl.appendChild(gauche);
  var droite = el("div", "tiny muted num");
  droite.style.textAlign = "right";
  rl.appendChild(droite);

  var rowB = el("div", "row-btns");
  var bAnn = el("button", "btn btn-ghost", "Annuler"); bAnn.type = "button";
  bAnn.addEventListener("click", function(){ brouillonCycle = null; aller("dashboard"); });
  var bOk = el("button", "btn btn-primary", "Démarrer le cycle"); bOk.type = "button";
  bOk.addEventListener("click", function(){
    var dep = totalDepense();
    var msg = "Démarrer un nouveau cycle ?\n\nLe cycle en cours (depuis le " + dateComplete(S.cycleDebut) + ") "
            + "sera archivé avec ses " + S.depenses.length + (S.depenses.length > 1 ? " dépenses" : " dépense")
            + " (" + fmt(dep) + " F). Vous le retrouverez dans l'Historique.";
    if(confirm(msg)) validerNouveauCycle();
  });
  rowB.appendChild(bAnn); rowB.appendChild(bOk);

  inn.appendChild(banniere); inn.appendChild(rl); inn.appendChild(rowB);
  bar.appendChild(inn); ba.appendChild(bar);

  function maj(){
    var t = brTotalRevenus(), rep = brTotalReparti(), rst = t - rep;
    totVal.textContent = fmtF(t);
    act.forEach(function(r){
      var m = Number(b.montants[r.id]) || 0;
      pcts[r.id].textContent = (t > 0 ? Math.round(m / t * 100) : 0) + "%";
    });
    groupesPresents(act).forEach(function(g){
      if(!pcts["__grp_" + g]) return;
      var s = 0;
      membresGroupe(act, g).forEach(function(r){ s += Number(b.montants[r.id]) || 0; });
      pcts["__grp_" + g].textContent = fmtF(s);
    });
    droite.textContent = "Réparti : " + fmtF(rep) + " / " + fmtF(t);
    if(rst < 0){
      val.textContent = fmtF(0);
      val.className = "reste-val deficit";
      banniere.hidden = false;
      banniere.textContent = "Déficit à combler : " + fmtF(-rst);
    }else{
      val.textContent = fmtF(rst);
      val.className = "reste-val" + (rst === 0 ? " ok" : "");
      banniere.hidden = true;
    }
    bOk.disabled = !(t > 0);
  }
  maj();
}

/* ==============================================================
   ÉCRAN 7 — Historique des cycles (F6)
   ============================================================== */
function vueHistorique(ec, ba){
  var bRet = el("button", "btn btn-ghost btn-line", "‹ Tableau de bord");
  bRet.type = "button";
  bRet.style.marginBottom = "14px";
  bRet.addEventListener("click", function(){ aller("dashboard"); });
  ec.appendChild(bRet);

  ec.appendChild(el("h1", null, "Historique"));
  ec.appendChild(el("p", "sub", "Vos cycles clôturés, du plus récent au plus ancien."));

  if(!S.cycles.length){
    var c0 = el("div", "card");
    c0.appendChild(el("div", "vide-msg",
      "Aucun cycle archivé pour l'instant. Votre premier cycle apparaîtra ici le jour où vous démarrerez le suivant."));
    ec.appendChild(c0);
  }else{
    S.cycles.forEach(function(c){
      var rev = cycRevenus(c), dep = cycDepense(c), ecart = rev - dep;
      var b = el("button", "cyc");
      b.type = "button";
      b.setAttribute("aria-label", "Ouvrir le cycle du " + periodeCycle(c));

      var h = el("div", "cyc-h");
      h.appendChild(el("span", "cyc-per", periodeCycle(c)));
      h.appendChild(el("span", "chev", "›"));
      b.appendChild(h);

      var g = el("div", "cyc-g");
      var d1 = el("div", null, "REVENUS");
      d1.insertBefore(el("b", null, fmtF(rev)), d1.firstChild);
      var d2 = el("div", null, "DÉPENSÉ");
      d2.insertBefore(el("b", null, fmtF(dep)), d2.firstChild);
      var d3 = el("div", null, ecart >= 0 ? "RESTÉ" : "DÉPASSEMENT");
      d3.insertBefore(el("b", ecart >= 0 ? "c-vert" : "c-rouge", fmtF(Math.abs(ecart))), d3.firstChild);
      g.appendChild(d1); g.appendChild(d2); g.appendChild(d3);
      b.appendChild(g);

      b.appendChild(jaugeRub(dep, rev));
      b.addEventListener("click", function(){ ouvrirCycle(c.id); });
      ec.appendChild(b);
    });
  }

  ec.appendChild(el("h2", null, "Vos données"));
  ec.appendChild(blocSauvegarde());
  var aide = el("p", "tiny muted",
    "La sauvegarde contient tout : cycles archivés, rubriques, répartition et dépenses. Gardez le fichier quelque part de sûr — c'est votre seule copie.");
  aide.style.margin = "10px 0 0";
  ec.appendChild(aide);
}

/* ==============================================================
   ÉCRAN 8 — Un cycle archivé, en lecture seule (F6)
   ============================================================== */
function vueCycleArchive(ec, ba){
  var c = cycleParId(cycleOuvert);
  if(!c){ aller("historique"); return; }

  var rev = cycRevenus(c), rep = cycReparti(c), dep = cycDepense(c);
  var ecart = rev - dep;

  var bRet = el("button", "btn btn-ghost btn-line", "‹ Historique");
  bRet.type = "button";
  bRet.style.marginBottom = "14px";
  bRet.addEventListener("click", function(){ aller("historique"); });
  ec.appendChild(bRet);

  ec.appendChild(el("h1", null, "Cycle clôturé"));
  var sub = el("p", "sub", periodeCycle(c));
  ec.appendChild(sub);
  var badge = el("span", "lecture", "Lecture seule");
  ec.appendChild(badge);

  /* --- synthèse --- */
  var tete = el("div", "tb-tete");
  tete.style.marginTop = "16px";
  tete.appendChild(el("div", "lab tiny muted", "DÉPENSÉ SUR CE CYCLE"));
  var grand = el("div", "big", fmtF(dep));
  if(dep > rev) grand.className = "big c-rouge";
  tete.appendChild(grand);
  tete.appendChild(el("div", "tiny muted", "sur " + fmtF(rev) + " de revenus"));
  var jg = jaugeRub(dep, rev);
  jg.style.marginTop = "12px";
  tete.appendChild(jg);
  var bas = el("div", "env-bas");
  bas.appendChild(el("span", "muted", "Réparti : " + fmtF(rep)));
  bas.appendChild(el("span", ecart >= 0 ? "c-vert" : "c-rouge",
    ecart >= 0 ? "Resté " + fmtF(ecart) : "Dépassement de " + fmtF(-ecart)));
  tete.appendChild(bas);
  ec.appendChild(tete);

  /* --- revenus --- */
  ec.appendChild(el("h2", null, "Revenus"));
  var cr = el("div", "card");
  if(!c.revenus.length){
    cr.appendChild(el("div", "vide-msg", "Aucun revenu enregistré sur ce cycle."));
  }else{
    c.revenus.forEach(function(r){
      var l = el("div", "ro");
      var h = el("div", "ro-h");
      h.appendChild(el("span", "nom", r.libelle || "Revenu"));
      h.appendChild(el("div", "ro-m", fmtF(r.montant)));
      l.appendChild(h);
      cr.appendChild(l);
    });
    var lt = el("div", "ro");
    var ht = el("div", "ro-h");
    ht.appendChild(el("span", "nom muted", "Total"));
    ht.appendChild(el("div", "ro-m", fmtF(rev)));
    lt.appendChild(ht);
    cr.appendChild(lt);
  }
  ec.appendChild(cr);

  /* --- répartition, dépensé et écarts, par groupe --- */
  ec.appendChild(el("h2", null, "Répartition et dépenses"));
  var rubs = c.rubriques.filter(function(r){
    return (Number(r.montant) || 0) > 0 || cycDepenseRub(c, r.id) > 0;
  });
  if(!rubs.length){
    var c1 = el("div", "card");
    c1.appendChild(el("div", "vide-msg", "Rien n'a été réparti ni dépensé sur ce cycle."));
    ec.appendChild(c1);
  }else{
    groupesPresents(rubs).forEach(function(g){
      var membres = membresGroupe(rubs, g);
      if(!membres.length) return;
      var affG = 0, depG = 0;
      membres.forEach(function(r){
        affG += Number(r.montant) || 0;
        depG += cycDepenseRub(c, r.id);
      });
      ec.appendChild(enteteGroupe(g, affG, depG));

      var carte = el("div", "card");
      membres.slice().sort(function(a,b){ return (b.montant||0) - (a.montant||0); }).forEach(function(r){
        var aff = Number(r.montant) || 0;
        var d = cycDepenseRub(c, r.id);
        var e = aff - d;
        var etat = etatJauge(d, aff);

        var l = el("div", "ro");
        var h = el("div", "ro-h");
        var ic = el("span", "ico", r.icone);
        ic.style.background = "rgba(255,255,255,.05)";
        ic.style.boxShadow = "inset 0 0 0 1px " + r.couleur + "55";
        h.appendChild(ic);
        h.appendChild(el("span", "nom", r.nom));
        var m = el("div", "ro-m", fmtF(d));
        m.appendChild(el("small", null, "sur " + fmtF(aff)));
        h.appendChild(m);
        l.appendChild(h);
        l.appendChild(jaugeRub(d, aff));
        var b2 = el("div", "ro-b");
        b2.appendChild(el("span", classeEtat(etat),
          aff > 0 ? pct(d / aff * 100) + " utilisé" : (d > 0 ? "hors enveloppe" : "rien d'affecté")));
        b2.appendChild(el("span", e < 0 ? "c-rouge" : "muted",
          e >= 0 ? "Écart : + " + fmtF(e) : "Écart : − " + fmtF(-e)));
        l.appendChild(b2);
        carte.appendChild(l);
      });
      ec.appendChild(carte);
    });

    var nonAff = rev - rep;
    if(nonAff > 0){
      var cn = el("div", "card");
      cn.style.marginTop = "10px";
      var ln = el("div", "tb-ligne");
      var pa = el("span", "pastille");
      pa.style.background = "var(--muted)";
      ln.appendChild(pa);
      ln.appendChild(el("span", "ico", "\uD83D\uDDC2\uFE0F"));
      ln.appendChild(el("span", "nom", "Non affecté"));
      var mn = el("div", "tb-mont", fmtF(nonAff));
      mn.appendChild(el("small", null, "jamais réparti"));
      ln.appendChild(mn);
      cn.appendChild(ln);
      ec.appendChild(cn);
    }
  }

  /* --- journal des dépenses du cycle --- */
  var liste = triDepenses(c.depenses);
  ec.appendChild(el("h2", null, liste.length
    ? "Ses dépenses (" + liste.length + ")" : "Ses dépenses"));
  var cd = el("div", "card");
  if(!liste.length){
    cd.appendChild(el("div", "vide-msg", "Aucune dépense n'a été saisie sur ce cycle."));
  }else{
    liste.forEach(function(d){
      var r = null;
      for(var i = 0; i < c.rubriques.length; i++){ if(c.rubriques[i].id === d.rubrique) r = c.rubriques[i]; }
      var l = el("div", "ro");
      var h = el("div", "ro-h");
      var ic = el("span", "ico", r ? r.icone : "\uD83D\uDCB8");
      if(r){
        ic.style.background = "rgba(255,255,255,.05)";
        ic.style.boxShadow = "inset 0 0 0 1px " + r.couleur + "55";
      }
      h.appendChild(ic);
      var txt = el("div");
      txt.style.flex = "1"; txt.style.minWidth = "0";
      txt.appendChild(el("div", "d-lib", d.libelle || (r ? r.nom : "Dépense")));
      var sous2 = dateCourte(d.date) + (r && d.libelle ? " · " + r.nom : "");
      txt.appendChild(el("div", "d-date", sous2));
      h.appendChild(txt);
      h.appendChild(el("div", "ro-m", fmtF(d.montant)));
      l.appendChild(h);
      cd.appendChild(l);
    });
  }
  ec.appendChild(cd);

  var note = el("p", "tiny muted",
    "Un cycle archivé ne se modifie plus : c'est la photo de votre mois, telle qu'elle était à la clôture.");
  note.style.margin = "12px 0 0";
  ec.appendChild(note);
}

/* ---------- démarrage ----------
   On réécrit tout de suite l'état migré : même si l'utilisateur
   ne touche à rien, ses données anciennes sont déjà au format
   des cycles, sans qu'il ait rien vu ni rien perdu. */
sauver();
render();

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").catch(function(){});
  });
}
</script>
