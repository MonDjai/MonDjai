/* ==============================================================
   SPRINT 7A — FEUILLE « NOUVEAU REVENU » (et modification d'un revenu)
   Type (liste déroulante) · Montant · Libellé · Nature · Date · Enregistrer.
   revenus[].type n'est écrit que lorsque l'utilisateur choisit un type ;
   la nature n'est écrite que si elle est choisie (règle du 6A).
   ============================================================== */
function ouvrirRevenu(opts){
  opts = opts || {};
  var edition = opts.edit || null;
  var ajust = !!edition && estAjustement(edition);
  var premiere = !!edition && S.revenus.length > 0 && S.revenus[0].id === edition.id;
  var cleDef = reglage("dernierTypeRevenu");
  if(!typeRevenu(cleDef)) cleDef = TYPE_REVENU_DEFAUT;
  var tDep = edition ? typeRevenu(edition.type) : typeRevenu(typeRevenu(opts.type) ? opts.type : cleDef);   /* 7C : opts.type (+ Dette) */
  var etat = {
    type: tDep ? tDep.cle : "",
    montant: edition ? (Number(edition.montant) || 0) : 0,
    date: edition ? (edition.date || null) : aujourdhui()
  };
  /* objet donné aux pastilles du 6A : nature préréglée selon le type (création) */
  var nat = {libelle: edition ? (edition.libelle || "") : "",
             nature: edition ? (estNature(edition.nature) ? edition.nature : undefined) : tDep.nature};
  var natureChoisie = !edition;
  var montantAvant = etat.montant;
  /* Sprint 7C — prêt relié : remboursement d'un prêt donné (nature « remboursement ») ou dette
     suivie (nature Emprunt, « Suivre ce remboursement », activé par défaut à la création) */
  var lienAvant = edition ? pretParId(edition.pret) : null;
  var natureAvant = edition ? natureDe(edition) : null;
  var detteLiee = !!(lienAvant && lienAvant.sens === "dette" && lienAvant.origine === edition.id);
  var ep = {
    pret: (lienAvant && lienAvant.sens === "donne") ? lienAvant.id : "",
    choisi: !!edition,            /* en modification, le choix enregistré (prêt ou « Sans suivi ») est gardé */
    mode: "partiel",
    suivi: edition ? detteLiee : true,
    qui: detteLiee ? lienAvant.qui : "",
    mensualite: detteLiee ? lienAvant.mensualite : 0,
    echeance: detteLiee ? (lienAvant.echeance || "") : ""
  };
  var libAuto = (lienAvant && lienAvant.sens === "donne" && edition.libelle === libelleRemb(lienAvant)) ? edition.libelle : null;

  var f = creerFeuille(edition ? "Modifier le revenu" : "Nouveau revenu");
  f.sh.setAttribute("data-test", "feuille-revenu");
  var corps = f.body;

  /* Type */
  var sel = null;
  if(!ajust){
    var fT = el("div", "field");
    var lT = el("label", null, "Type");
    lT.setAttribute("for", "rev-type");
    fT.appendChild(lT);
    sel = document.createElement("select");
    sel.className = "input"; sel.id = "rev-type";
    sel.setAttribute("data-test", "type-revenu");
    if(!etat.type){
      var o0 = document.createElement("option"); o0.value = ""; o0.textContent = "—"; sel.appendChild(o0);
    }
    TYPES_REVENU.forEach(function(t){
      var o = document.createElement("option"); o.value = t.cle; o.textContent = t.lab; sel.appendChild(o);
    });
    sel.value = etat.type;
    fT.appendChild(sel);
    corps.appendChild(fT);
  }

  /* Montant */
  var im = document.createElement("input");
  im.type = "text"; im.inputMode = "numeric"; im.className = "montant-xl";
  im.placeholder = "0"; im.setAttribute("autocomplete", "off");
  im.setAttribute("aria-label", "Montant du revenu en francs CFA");
  im.setAttribute("data-test", "montant-revenu");
  im.value = etat.montant ? fmt(etat.montant) : "";
  corps.appendChild(im);
  corps.appendChild(el("div", "devise", "FRANCS CFA"));

  /* Libellé */
  var fL = el("div", "field");
  var lL = el("label", null, "Libellé");
  lL.setAttribute("for", "rev-lib");
  fL.appendChild(lL);
  var iL = document.createElement("input");
  iL.type = "text"; iL.className = "input"; iL.id = "rev-lib"; iL.maxLength = 60;
  iL.placeholder = "Revenu";
  iL.setAttribute("data-test", "libelle-revenu");
  iL.value = edition ? (edition.libelle || "") : libelleDuType(tDep);
  if(!edition) libAuto = iL.value;   /* Sprint 7C — libellé proposé, remplaçable tant qu'il n'est pas écrit à la main */
  fL.appendChild(iL);
  corps.appendChild(fL);

  /* Nature : les 3 pastilles du 6A (un ajustement garde la sienne) */
  var fN = el("div", "field");
  fN.appendChild(el("label", null, "Nature"));
  var zoneNat = el("div");
  zoneNat.setAttribute("data-test", "nature-revenu");
  fN.appendChild(zoneNat);
  corps.appendChild(fN);
  /* Sprint 7C — zone du prêt relié, sous la nature */
  var zonePret = el("div", "field zone-pret");
  zonePret.setAttribute("data-test", "zone-pret");
  corps.appendChild(zonePret);
  function dessinerNature(){
    zoneNat.innerHTML = "";
    if(ajust){ zoneNat.appendChild(pastilleAjustementRevenu()); return; }
    /* Sprint 7C — remboursement : pastille grise fixe (et « Prêt · qui » si un prêt est choisi) */
    if(natureDe(nat) === NATURE_REMBOURSEMENT){
      var wR = el("div", "natures");
      wR.appendChild(pastillesRemb(pretParId(ep.pret)));
      zoneNat.appendChild(wR);
      return;
    }
    zoneNat.appendChild(pastillesNature(nat, function(){ natureChoisie = true; suiviParDefaut(); dessinerPret(); }));
  }
  /* un revenu qui devient un emprunt pendant sa modification : « Suivre » activé par défaut,
     comme à la création (un emprunt déjà saisi n'est jamais suivi sans un tap) */
  function suiviParDefaut(){
    if(edition && !detteLiee && natureAvant !== "emprunt" && natureDe(nat) === "emprunt") ep.suivi = true;
  }
  function lienRevenuActif(){
    var n = natureDe(nat);
    return !ajust && ((n === NATURE_REMBOURSEMENT && !!ep.pret) || (n === "emprunt" && ep.suivi));
  }
  /* une ligne reliée n'est jamais dans le futur */
  function majDateLien(){
    if(!iD) return;
    var lie = lienRevenuActif();
    if(lie) iD.max = aujourdhui(); else iD.removeAttribute("max");
    if(lie && etat.date && etat.date > aujourdhui()){ etat.date = aujourdhui(); iD.value = etat.date; majChips(); }
  }
  function poserMontant(v){
    etat.montant = v;
    im.value = v ? fmt(v) : "";
    maj();
  }
  function preselectionnerPret(){
    var p = pretPreselectionne();   /* le plus proche de son échéance, sinon le plus ancien */
    ep.pret = p ? p.id : "";
  }
  function majLibellePret(){
    var tR = typeRevenu(TYPE_REMBOURSEMENT);
    var v = ep.pret ? libelleRemb(pretParId(ep.pret)) : libelleDuType(tR);
    var lib = propre(iL.value);
    if(!lib || lib === propre(libelleDuType(tR)) || (libAuto && lib === propre(libAuto))){ iL.value = v; libAuto = v; }
  }
  function chipPret(txt, presse, test, fn){
    var c = el("button", "chip chip-s", txt);
    c.type = "button";
    c.setAttribute("aria-pressed", presse ? "true" : "false");
    if(test) c.setAttribute("data-pret", test);
    c.addEventListener("click", fn);
    return c;
  }
  function dessinerPret(){
    zonePret.innerHTML = "";
    var n = natureDe(nat);
    zonePret.hidden = true;
    if(ajust){ majDateLien(); return; }
    if(n === NATURE_REMBOURSEMENT){
      zonePret.hidden = false;
      var l = pretsOuverts("donne");
      var courant = pretParId(ep.pret);
      if(courant && l.indexOf(courant) < 0) l = [courant].concat(l);
      if(!l.length){
        var aucun = el("p", "small muted", "Aucun prêt en cours");
        aucun.setAttribute("data-test", "aucun-pret");
        aucun.style.margin = "0";
        zonePret.appendChild(aucun);
        majDateLien();
        return;
      }
      zonePret.appendChild(el("label", null, "Quel prêt ?"));
      var rg = el("div", "chips chips-ligne");
      rg.setAttribute("role", "group");
      rg.setAttribute("aria-label", "Quel prêt ?");
      rg.setAttribute("data-test", "choix-pret");
      l.forEach(function(p){
        rg.appendChild(chipPret(nomPret(p) + " · reste " + fmtF(restePret(p)), ep.pret === p.id, p.id, function(){
          ep.pret = p.id; ep.choisi = true;
          if(ep.mode === "total") poserMontant(restePret(p));
          majLibellePret(); dessinerNature(); dessinerPret();
        }));
      });
      rg.appendChild(chipPret("Sans suivi", !ep.pret, "", function(){
        ep.pret = ""; ep.choisi = true;
        majLibellePret(); dessinerNature(); dessinerPret();
      }));
      zonePret.appendChild(rg);
      if(ep.pret){
        var rm = el("div", "chips");
        rm.setAttribute("role", "group");
        rm.setAttribute("aria-label", "Partiel ou totalité");
        rm.setAttribute("data-test", "remb-mode");
        [["partiel", "Partiel"], ["total", "Totalité"]].forEach(function(m){
          rm.appendChild(chipPret(m[1], ep.mode === m[0], "", function(){
            ep.mode = m[0];
            if(m[0] === "total"){ var pc = pretParId(ep.pret); if(pc) poserMontant(restePret(pc)); }
            dessinerPret();
          }));
        });
        zonePret.appendChild(rm);
      }
      majDateLien();
      return;
    }
    if(n === "emprunt"){
      zonePret.hidden = false;
      var li = el("div", "interr-ligne");
      var tx = el("div"); tx.style.flex = "1"; tx.style.minWidth = "0";
      tx.appendChild(el("div", "regl-nom", "Suivre ce remboursement"));
      tx.appendChild(el("div", "regl-sous", "Reste et mensualités, dans « Prêts et dettes »."));
      li.appendChild(tx);
      var sw = interrupteur(ep.suivi, function(v){ ep.suivi = v; dessinerPret(); }, "Suivre ce remboursement");
      sw.setAttribute("data-test", "suivre-dette");
      li.appendChild(sw);
      zonePret.appendChild(li);
      if(ep.suivi){
        zonePret.appendChild(champTexte("Auprès de qui ? (facultatif)", "dette-qui", ep.qui, POUR_QUI_MAX, function(v){ ep.qui = v; }, null));
        zonePret.appendChild(champSomme("Mensualité (facultatif)", "dette-mensualite", ep.mensualite, function(v){ ep.mensualite = v; }));
        zonePret.appendChild(champDateSeule("Fin prévue le (facultatif)", "dette-fin", ep.echeance, null, function(v){ ep.echeance = v; }));
      }
      majDateLien();
      return;
    }
    majDateLien();
  }
  function choixLien(){
    var n = natureDe(nat);
    return {pret: n === NATURE_REMBOURSEMENT ? ep.pret : "", suivi: n === "emprunt" && ep.suivi,
            qui: ep.qui, mensualite: ep.mensualite, echeance: ep.echeance};
  }
  if(!edition && natureDe(nat) === NATURE_REMBOURSEMENT) preselectionnerPret();
  dessinerNature();
  dessinerPret();
  if(!edition && natureDe(nat) === NATURE_REMBOURSEMENT) majLibellePret();
  if(sel){
    sel.addEventListener("change", function(){
      var t = typeRevenu(sel.value);
      if(!t) return;
      if(sel.options.length && sel.options[0].value === ""){ sel.remove(0); sel.value = t.cle; }
      var ancien = typeRevenu(etat.type);
      var lib = propre(iL.value);
      /* libellé remplacé seulement s'il n'a pas été écrit à la main */
      if(!lib || lib === propre(libelleDuType(ancien)) || (libAuto && lib === propre(libAuto))){ iL.value = libelleDuType(t); libAuto = iL.value; }
      etat.type = t.cle;
      nat.nature = t.nature; natureChoisie = true;
      /* Sprint 7C — « Remboursement d'un prêt donné » : prêt présélectionné, libellé « Remboursement · qui » */
      if(t.cle === TYPE_REMBOURSEMENT && !ep.choisi) preselectionnerPret();
      suiviParDefaut();
      dessinerNature();
      dessinerPret();
      if(t.cle === TYPE_REMBOURSEMENT) majLibellePret();
    });
  }

  /* Date : Aujourd'hui · Hier · autre date */
  var fD = el("div", "field");
  fD.appendChild(el("label", null, "Date"));
  var chips = el("div", "chips");
  chips.style.marginBottom = "8px";
  var hier = new Date(); hier.setDate(hier.getDate() - 1);
  var racc = [{lab: "Aujourd'hui", val: aujourdhui()}, {lab: "Hier", val: iso(hier)}];
  var iD = document.createElement("input");
  iD.type = "date"; iD.className = "input"; iD.value = etat.date || "";
  iD.setAttribute("aria-label", "Date de réception du revenu");
  function majChips(){
    Array.prototype.slice.call(chips.querySelectorAll(".chip")).forEach(function(x, i){
      x.setAttribute("aria-pressed", etat.date === racc[i].val ? "true" : "false");
    });
  }
  racc.forEach(function(rc){
    var c = el("button", "chip", rc.lab);
    c.type = "button";
    c.addEventListener("click", function(){ etat.date = rc.val; iD.value = rc.val; majChips(); });
    chips.appendChild(c);
  });
  iD.addEventListener("change", function(){
    etat.date = iD.value || (edition ? null : aujourdhui());
    if(!iD.value && etat.date) iD.value = etat.date;
    majChips();
    majDateLien();   /* Sprint 7C */
  });
  majChips();
  majDateLien();
  fD.appendChild(chips); fD.appendChild(iD);
  corps.appendChild(fD);

  /* Supprimer (modification), jamais la première ligne de revenus — comme l'écran Revenus */
  if(edition && !premiere){
    var bSup = el("button", "btn btn-danger", "Supprimer ce revenu");
    bSup.type = "button";
    bSup.style.marginTop = "18px";
    bSup.setAttribute("data-test", "supprimer-revenu");
    bSup.addEventListener("click", function(){
      if(confirm("Supprimer ce revenu de " + fmtF(edition.montant) + " ?")){
        var msgSup = lienSupprime(edition.id);   /* Sprint 7C */
        S.revenus = S.revenus.filter(function(x){ return x.id !== edition.id; });
        filePart = filePart.filter(function(x){ return x !== edition.id; });
        sauver(); fermerFeuille(false); render();
        toast(msgSup || "Revenu supprimé");
      }
    });
    corps.appendChild(bSup);
  }

  /* barre de validation */
  var bar = el("div", "sticky"), inn = el("div", "sticky-in");
  var bOk = el("button", "btn btn-primary", "Enregistrer");
  bOk.type = "button";
  bOk.setAttribute("data-test", "enregistrer-revenu");
  inn.appendChild(bOk); bar.appendChild(inn); f.sh.appendChild(bar);
  function maj(){ bOk.disabled = !edition && !(etat.montant > 0); }
  im.addEventListener("focus", function(){
    setTimeout(function(){ try{ im.scrollIntoView({block: "center", behavior: "smooth"}); }catch(e){} }, 250);
  });
  im.addEventListener("input", function(){
    var v = chiffres(im.value);
    im.value = v ? fmt(v) : "";
    etat.montant = v;
    maj();
  });
  im.addEventListener("keydown", function(e){
    if(e.key === "Enter" && !bOk.disabled){ e.preventDefault(); enregistrer(); }
  });
  bOk.addEventListener("click", enregistrer);
  maj();
  setTimeout(function(){ try{ im.focus(); }catch(e){} }, 60);

  function enregistrer(){
    var m = Number(etat.montant) || 0;
    if(!edition && !(m > 0)) return;
    var t = typeRevenu(etat.type);
    /* libellé laissé vide : celui du type, sinon « Revenu » */
    var lib = propre(iL.value) || libelleDuType(t) || "Revenu";
    if(edition){
      edition.libelle = lib;
      edition.montant = m;
      edition.date = etat.date || null;
      if(!ajust && natureChoisie && estNature(nat.nature)) edition.nature = nat.nature;
      if(!ajust && t) edition.type = t.cle;
      /* Sprint 7C — cohérence des lignes reliées (montant, date, nature, prêt choisi, suivi) */
      var msgLien = ajust ? "" : majLienRevenu(edition, {nature: natureAvant}, choixLien());
      sauver();
      if(!(montantAvant > 0) && m > 0) enfilerPart(edition);   /* 6D : un revenu qui passe de 0 à un montant */
      fermerFeuille(false);
      render();
      toast(msgLien || "Modification enregistrée");
      return;
    }
    var obj = {id: uid(), libelle: lib, montant: m, date: etat.date || aujourdhui(),
               nature: estNature(nat.nature) ? nat.nature : t.nature, type: t.cle};
    S.revenus.push(obj);
    var lienTxt = lierNouveauRevenu(obj, choixLien());   /* Sprint 7C — remboursement d'un prêt, ou dette suivie */
    regler("dernierTypeRevenu", t.cle);   /* (sauvegarde comprise) */
    enfilerPart(obj);                       /* 6D, sauf type sansPart (Tontine, Remboursement), emprunt ou régulier */
    fermerFeuille(false);
    render();                               /* ouvre la feuille de mise de côté s'il y a lieu */
    toastAnnuler(lienTxt || "Revenu ajouté ✓", function(){ annulerRevenuCree(obj.id); });
  }
}

/* ==============================================================

/* ==============================================================
   SPRINT 7A — GARDE-FOU « ANNULER »
   Après la création d'une dépense, d'une prévision, d'un revenu ou d'une
   part mise de côté : un message avec [Annuler] pendant ANNULER_DELAI_MS,
   au-dessus des feuilles, un seul message à la fois. Annuler retire la
   ligne créée, et seulement elle.
   ============================================================== */
function placerToast(t){
  if(!feuille || !t) return;
  var bar = null;
  try{ bar = feuille.querySelector(":scope > .sticky"); }catch(e){}
  t.style.bottom = ((bar ? bar.offsetHeight : 0) + 14) + "px";
}
function toastAnnuler(txt, surAnnuler){
  Array.prototype.slice.call(document.querySelectorAll(".toast")).forEach(function(x){ if(x.parentNode) x.parentNode.removeChild(x); });
  var t = el("div", "toast toast-annuler");
  t.setAttribute("role", "status");
  t.setAttribute("data-test", "toast-annuler");
  t.appendChild(el("span", "t-txt", txt));
  var b = el("button", null, "Annuler");
  b.type = "button";
  b.setAttribute("data-test", "bouton-annuler");
  var fini = false;
  b.addEventListener("click", function(){
    if(fini) return;
    fini = true;
    if(t.parentNode) t.parentNode.removeChild(t);
    surAnnuler();
  });
  t.appendChild(b);
  document.body.appendChild(t);
  placerToast(t);
  setTimeout(function(){
    fini = true;
    if(b.parentNode) b.parentNode.removeChild(b);
    t.style.opacity = "0";
  }, ANNULER_DELAI_MS);
  setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, ANNULER_DELAI_MS + 400);
  return t;
}
/* Dépense, prévision ou part : retire la ligne ; ferme « Garder en raccourci ⚡ ? » si elle est encore affichée */
function annulerDepenseCreee(id, prevision, proposition){
  var ec = document.getElementById("ecran");
  var av = ec ? ec.querySelector('[data-test="proposition-modele"]') : null;
  if(av && proposition){
    if(av.parentNode) av.parentNode.removeChild(av);
    regler("modelesProposes", proposition.avant);   /* la saisie annulée n'a jamais été proposée */
  }
  supprimerDepense(id, !!prevision);
  render();
  toast("Saisie annulée");
}
/* Revenu : retire la ligne, la sort de filePart et ferme sa feuille de mise de côté */
function annulerRevenuCree(id){
  filePart = filePart.filter(function(x){ return x !== id; });
  if(feuille && feuille.getAttribute("data-part-pour") === id) fermerFeuille(false);
  lienSupprime(id);   /* Sprint 7C — remboursement ou dette créés avec ce revenu */
  S.revenus = S.revenus.filter(function(r){ return r.id !== id; });
  sauver();
  render();
  toast("Saisie annulée");
}

/* ==============================================================
   SPRINT 7C — PRÊTS DONNÉS ET DETTES
   Un stockage à part, S.prets[], relié aux lignes par « pret » :
   · prêt donné → origine = dépense dans « Prêts donnés » ;
     remboursements = revenus de nature « remboursement » ;
   · dette → origine = revenu de nature Emprunt ;
     remboursements = dépenses dans « Mensualités (dettes) ».
   Une ligne porte au plus un prêt. Prêts et dettes d'avant l'application
   (« Déjà prêté avant », « Dette déjà en cours ») n'ont pas de ligne.
   Le suivi s'ajoute : il ne déplace aucun montant. Un prêt donné et le
   remboursement d'une dette restent des dépenses ordinaires ; un emprunt
   et un remboursement reçu restent des revenus ordinaires.
   Ton : « reste », « prévu le », « soldé » — jamais de rouge.
   ============================================================== */
function estIso(s){ return typeof s === "string" && RE_ISO_7C.test(s); }

/* Migration et restauration : chaque prêt est reconstruit champ par champ (ordre fixe) */
function normaliserPrets(liste){
  return (Array.isArray(liste) ? liste : []).filter(function(p){
    return !!p && typeof p === "object" && (p.sens === "donne" || p.sens === "dette")
      && Number(p.montant) > 0 && estIso(p.date);
  }).map(function(p){
    return {
      id: (typeof p.id === "string" && p.id) ? p.id : uid(),
      sens: p.sens,
      qui: propre(typeof p.qui === "string" ? p.qui : "", POUR_QUI_MAX),
      montant: Math.round(Number(p.montant)),
      date: p.date,
      echeance: estIso(p.echeance) ? p.echeance : null,
      mensualite: p.sens === "dette" ? Math.max(0, Math.round(Number(p.mensualite) || 0)) : 0,
      origine: (typeof p.origine === "string" && p.origine) ? p.origine : null,
      remboursements: (Array.isArray(p.remboursements) ? p.remboursements : []).filter(function(r){
        return !!r && typeof r === "object" && Number(r.montant) > 0 && estIso(r.date);
      }).map(function(r){
        return {id: (typeof r.id === "string" && r.id) ? r.id : uid(), date: r.date, montant: Math.round(Number(r.montant)),
                mode: r.mode === "total" ? "total" : "partiel",
                ligne: (typeof r.ligne === "string" && r.ligne) ? r.ligne : null};
      })
    };
  });
}

/* ---------- calculs ---------- */
function pretParId(id){
  if(!id) return null;
  var l = S.prets || [];
  for(var i = 0; i < l.length; i++){ if(l[i].id === id) return l[i]; }
  return null;
}
/* remboursé = somme des remboursements ; reste = max(0, montant − remboursé) ; soldé quand reste = 0 */
function rembourse(p){
  return (p.remboursements || []).reduce(function(t, r){ return t + (Number(r.montant) || 0); }, 0);
}
function restePret(p){ return Math.max(0, (Number(p.montant) || 0) - rembourse(p)); }
function remboursementsOrdonnes(p){
  return (p.remboursements || []).map(function(r, i){ return {r: r, i: i}; })
    .sort(function(a, b){ return a.r.date === b.r.date ? a.i - b.i : (a.r.date < b.r.date ? -1 : 1); })
    .map(function(x){ return x.r; });
}
/* date de solde = date du remboursement qui amène le reste à 0 */
function dateSolde(p){
  var cumul = 0, m = Number(p.montant) || 0, l = remboursementsOrdonnes(p);
  for(var i = 0; i < l.length; i++){
    cumul += Number(l[i].montant) || 0;
    if(cumul >= m) return l[i].date;
  }
  return null;
}
/* mode « total » dès que le reste atteint 0 */
function recalculerModes(p){
  var cumul = 0, m = Number(p.montant) || 0;
  remboursementsOrdonnes(p).forEach(function(r){
    cumul += Number(r.montant) || 0;
    r.mode = cumul >= m ? "total" : "partiel";
  });
}
/* une ligne du cycle en cours ou d'un cycle archivé */
function ligneParId(id){
  if(!id) return null;
  var i, c;
  for(i = 0; i < S.depenses.length; i++){ if(S.depenses[i].id === id) return {ligne: S.depenses[i], sorte: "depense", archive: false}; }
  for(i = 0; i < S.revenus.length; i++){ if(S.revenus[i].id === id) return {ligne: S.revenus[i], sorte: "revenu", archive: false}; }
  for(c = 0; c < S.cycles.length; c++){
    var cy = S.cycles[c];
    for(i = 0; i < (cy.depenses || []).length; i++){ if(cy.depenses[i].id === id) return {ligne: cy.depenses[i], sorte: "depense", archive: true}; }
    for(i = 0; i < (cy.revenus || []).length; i++){ if(cy.revenus[i].id === id) return {ligne: cy.revenus[i], sorte: "revenu", archive: true}; }
  }
  return null;
}
/* Nom affiché : qui, sinon le libellé de la ligne d'origine, sinon « Sans nom » */
function nomPret(p){
  if(!p) return "Sans nom";
  var q = propre(p.qui);
  if(q) return q;
  var o = ligneParId(p.origine);
  var lib = o ? propre(o.ligne.libelle) : "";
  return lib || "Sans nom";
}
/* « 31/10 », ou « 31/03/2027 » pour une autre année */
function jjmmAn(s){ return jjmm(s) + (deIso(s).getFullYear() !== new Date().getFullYear() ? "/" + deIso(s).getFullYear() : ""); }
function libelleRemb(p){ return "Remboursement · " + nomPret(p); }
/* Ouverts d'abord par échéance (sans échéance à la fin), puis par date */
function trierPrets(l){
  return l.slice().sort(function(a, b){
    var ea = a.echeance || "9999-12-31", eb = b.echeance || "9999-12-31";
    if(ea !== eb) return ea < eb ? -1 : 1;
    return a.date === b.date ? 0 : (a.date < b.date ? -1 : 1);
  });
}
function pretsOuverts(sens){
  return trierPrets((S.prets || []).filter(function(p){ return p.sens === sens && restePret(p) > 0; }));
}
/* « + Revenu › Remboursement d'un prêt donné » : le plus proche de son échéance, sinon le plus ancien */
function pretPreselectionne(){ var l = pretsOuverts("donne"); return l.length ? l[0] : null; }
/* actif sur le cycle : reste > 0, ou créé, ou remboursé depuis le début du cycle */
function estActifCycle(p, deb){
  return restePret(p) > 0 || p.date >= deb || (p.remboursements || []).some(function(r){ return r.date >= deb; });
}
function pretsActifs(){
  var deb = S.cycleDebut || aujourdhui();
  return (S.prets || []).filter(function(p){ return estActifCycle(p, deb); });
}
function resumePrets(liste, sens){
  var t = {nb: 0, montant: 0, rembourse: 0, reste: 0};
  liste.forEach(function(p){
    if(p.sens !== sens) return;
    t.nb++; t.montant += Number(p.montant) || 0; t.rembourse += rembourse(p); t.reste += restePret(p);
  });
  return t;
}
function texteResumePrets(){
  var l = S.prets || [];
  if(!l.length) return "Ce que vous avez prêté, ce que vous remboursez";
  var d = resumePrets(l, "donne"), e = resumePrets(l, "dette"), parts = [];
  if(d.reste > 0) parts.push("À recevoir " + fmtF(d.reste));
  if(e.reste > 0) parts.push("À rembourser " + fmtF(e.reste));
  return parts.length ? parts.join(" · ") : "Tout est soldé ✓";
}

/* ---------- création, liens, cohérence ---------- */
function creerPret(o){
  var p = {id: uid(), sens: o.sens, qui: propre(o.qui, POUR_QUI_MAX),
           montant: Math.round(Number(o.montant) || 0), date: estIso(o.date) ? o.date : aujourdhui(),
           echeance: estIso(o.echeance) ? o.echeance : null,
           mensualite: o.sens === "dette" ? Math.max(0, Math.round(Number(o.mensualite) || 0)) : 0,
           origine: o.origine || null, remboursements: []};
  if(!Array.isArray(S.prets)) S.prets = [];
  S.prets.push(p);
  return p;
}
function ajouterRemboursement(p, ligne, sansLigne){
  var r = {id: uid(), date: estIso(ligne.date) ? ligne.date : aujourdhui(), montant: Math.round(Number(ligne.montant) || 0),
           mode: "partiel", ligne: sansLigne ? null : ligne.id};
  p.remboursements.push(r);
  recalculerModes(p);
  return r;
}
function etiquetteRemb(p, idLigne){
  var r = null;
  p.remboursements.forEach(function(x){ if(x.ligne === idLigne) r = x; });
  return (r && r.mode === "total") ? ETQ_REMB_TOTAL : ETQ_REMB_PARTIEL;
}
function retirerRemboursementDeLigne(p, idLigne){
  if(!p) return;
  var n = p.remboursements.length;
  p.remboursements = p.remboursements.filter(function(r){ return r.ligne !== idLigne; });
  if(p.remboursements.length !== n) recalculerModes(p);
}
function majRemboursementDeLigne(p, ligne){
  p.remboursements.forEach(function(r){
    if(r.ligne !== ligne.id) return;
    if(Number(ligne.montant) > 0) r.montant = Math.round(Number(ligne.montant));
    if(estIso(ligne.date)) r.date = ligne.date;
  });
  recalculerModes(p);
}
/* Le montant (et la date) d'une ligne reliée suit sur le prêt ou le remboursement */
function synchroniserLigne(l){
  var p = l ? pretParId(l.pret) : null;
  if(!p) return;
  if(p.origine === l.id){
    if(Number(l.montant) > 0) p.montant = Math.round(Number(l.montant));
    if(estIso(l.date)) p.date = l.date;
    recalculerModes(p);
  }else{
    majRemboursementDeLigne(p, l);
  }
}
/* Retirer du suivi : supprime la fiche et le lien des lignes, jamais les lignes elles-mêmes
   (les cycles archivés, en lecture seule, gardent leurs liens) */
function retirerPret(id){
  S.prets = (S.prets || []).filter(function(p){ return p.id !== id; });
  S.depenses.forEach(function(d){ if(d.pret === id) delete d.pret; });
  S.revenus.forEach(function(r){ if(r.pret === id) delete r.pret; });
}
/* Ligne d'origine supprimée, annulée, changée de rubrique ou de nature :
   prêt retiré s'il n'a aucun remboursement ; sinon gardé avec origine null */
function detacherOrigine(p, ligne){
  if(ligne && ligne.pret === p.id) delete ligne.pret;
  if(p.remboursements.length){ p.origine = null; return "Le prêt reste suivi"; }
  S.prets = (S.prets || []).filter(function(x){ return x !== p; });
  return "";
}
/* Ligne supprimée ou annulée (dépense ou revenu) */
function lienSupprime(id){
  var msg = "";
  (S.prets || []).slice().forEach(function(p){
    if(p.origine === id){
      var m = detacherOrigine(p, null);
      if(m) msg = m;
    }
    retirerRemboursementDeLigne(p, id);
  });
  return msg;
}
/* Nouvelle dépense réelle (ou prévision validée) : « Prêts donnés » crée le prêt ;
   « Mensualités » avec une dette choisie devient un remboursement */
function lierNouvelleDepense(d, choix){
  choix = choix || {};
  if(d.rubrique === ID_PRETS_DONNES && !d.pret){
    var p = creerPret({sens: "donne", qui: d.pour || "", montant: d.montant, date: d.date, echeance: choix.echeance, origine: d.id});
    d.pret = p.id;
    return "pret";
  }
  if(d.rubrique === ID_MENSUALITES && choix.dette && !d.pret){
    var q = pretParId(choix.dette);
    if(q && q.sens === "dette"){
      ajouterRemboursement(q, d);
      d.pret = q.id;
      if(!d.etiquette) d.etiquette = etiquetteRemb(q, d.id);
      return "remb";
    }
  }
  return "";
}
/* Dépense modifiée. avant = {rubrique, pour} à l'ouverture ; choix = {echeance, dette}.
   Fusion de rubriques (6B) : le lien suit la ligne — seul un changement fait ici détache. */
function majLienDepense(d, avant, choix){
  choix = choix || {};
  var p = pretParId(d.pret);
  if(d.pret && !p) delete d.pret;   /* prêt retiré du suivi entre-temps */
  if(p && p.origine === d.id){
    if(avant.rubrique !== d.rubrique) return detacherOrigine(p, d);
    if(cleTexte(p.qui) === cleTexte(avant.pour)) p.qui = propre(d.pour || "", POUR_QUI_MAX);
    if(choix.echeance !== undefined) p.echeance = estIso(choix.echeance) ? choix.echeance : null;
    synchroniserLigne(d);
    return "";
  }
  var ancien = (p && p.sens === "dette") ? p : null;
  var cible = null;
  if(avant.rubrique === d.rubrique || d.rubrique === ID_MENSUALITES){
    cible = choix.dette ? pretParId(choix.dette) : null;
    if(cible && cible.sens !== "dette") cible = null;
  }
  if(ancien && ancien !== cible){ retirerRemboursementDeLigne(ancien, d.id); delete d.pret; }
  if(cible && cible === ancien){ majRemboursementDeLigne(cible, d); return ""; }
  if(cible){
    ajouterRemboursement(cible, d);
    d.pret = cible.id;
    if(!d.etiquette) d.etiquette = etiquetteRemb(cible, d.id);
  }
  return "";
}
/* Nouveau revenu : remboursement d'un prêt donné choisi, ou dette suivie (Emprunt) */
function lierNouveauRevenu(rev, choix){
  choix = choix || {};
  var n = natureDe(rev);
  if(n === NATURE_REMBOURSEMENT && choix.pret){
    var p = pretParId(choix.pret);
    if(p && p.sens === "donne"){
      if(rev.date && rev.date > aujourdhui()) rev.date = aujourdhui();
      ajouterRemboursement(p, rev);
      rev.pret = p.id;
      return "Remboursement noté ✓";
    }
  }
  if(n === "emprunt" && choix.suivi && Number(rev.montant) > 0){
    if(!rev.date || rev.date > aujourdhui()) rev.date = aujourdhui();
    var d = creerPret({sens: "dette", qui: choix.qui, montant: rev.montant, date: rev.date,
                       echeance: choix.echeance, mensualite: choix.mensualite, origine: rev.id});
    rev.pret = d.id;
    return "Dette notée ✓";
  }
  return "";
}
/* Revenu modifié dans la feuille. avant = {nature} à l'ouverture ; choix = {pret, suivi, qui, mensualite, echeance} */
function majLienRevenu(rev, avant, choix){
  choix = choix || {};
  var p = pretParId(rev.pret), n = natureDe(rev);
  if(rev.pret && !p) delete rev.pret;
  if(p && p.origine === rev.id){
    if(n !== "emprunt" || !choix.suivi) return detacherOrigine(p, rev);
    p.qui = propre(choix.qui, POUR_QUI_MAX);
    p.mensualite = Math.max(0, Math.round(Number(choix.mensualite) || 0));
    p.echeance = estIso(choix.echeance) ? choix.echeance : null;
    synchroniserLigne(rev);
    return "";
  }
  var ancien = (p && p.sens === "donne") ? p : null;
  var cible = (n === NATURE_REMBOURSEMENT && choix.pret) ? pretParId(choix.pret) : null;
  if(cible && cible.sens !== "donne") cible = null;
  if(ancien && ancien !== cible){ retirerRemboursementDeLigne(ancien, rev.id); delete rev.pret; }
  if(cible && cible === ancien){ majRemboursementDeLigne(cible, rev); return ""; }
  if(!rev.pret) lierNouveauRevenu(rev, {pret: cible ? cible.id : "", suivi: choix.suivi,
                                        qui: choix.qui, mensualite: choix.mensualite, echeance: choix.echeance});
  return "";
}
/* Écran Revenus : une pastille de nature touchée sur une ligne reliée */
function lienNatureChangee(rev){
  var p = pretParId(rev.pret);
  if(!p) return "";
  if(p.origine === rev.id && natureDe(rev) !== "emprunt") return detacherOrigine(p, rev);
  if(p.sens === "donne" && natureDe(rev) !== NATURE_REMBOURSEMENT){ retirerRemboursementDeLigne(p, rev.id); delete rev.pret; }
  return "";
}

/* ---------- Mensualités au cycle suivant ----------
   ajouts = mensualités des dettes créées avec un revenu (origine non nulle) pendant le cycle
   qui se termine et encore ouvertes ; retraits = mensualités des dettes soldées pendant ce
   cycle, sauf celles créées avec un revenu dans le même cycle (créée et soldée : rien ne change).
   Les dettes « déjà en cours » ne sont jamais ajoutées, et sont retirées quand elles sont soldées. */
function variationMensualites(){
  var deb = S.cycleDebut || aujourdhui(), fin = aujourdhui();
  var v = {ajouts: 0, nAjouts: 0, retraits: 0, nRetraits: 0};
  (S.prets || []).forEach(function(p){
    if(p.sens !== "dette") return;
    var m = Number(p.mensualite) || 0;
    if(!(m > 0)) return;
    var creeAvecRevenu = !!p.origine && p.date >= deb && p.date <= fin;
    if(restePret(p) > 0){
      if(creeAvecRevenu){ v.ajouts += m; v.nAjouts++; }
      return;
    }
    var ds = dateSolde(p);
    if(ds && ds >= deb && ds <= fin && !creeAvecRevenu){ v.retraits += m; v.nRetraits++; }
  });
  return v;
}
/* Budget proposé = max(0, budget actuel + ajouts − retraits), posé dans montants ET montantsOrigine
   (« Recalculer » du 5B le garde : les Fixes ne bougent pas) ; seule la validation l'applique */
function proposerMensualites(b){
  var r = rubriqueParId(ID_MENSUALITES);
  if(!b || !r || !r.active) return;
  var v = variationMensualites();
  if(!v.ajouts && !v.retraits) return;
  var m = Math.max(0, (Number(r.montant) || 0) + v.ajouts - v.retraits);
  b.montants[r.id] = m;
  b.montantsOrigine[r.id] = m;
  b.mensualites = v;
}
function noteMensualites(v){
  var parts = [];
  if(v.ajouts) parts.push("+" + fmtF(v.ajouts) + " " + (v.nAjouts > 1 ? "nouveaux emprunts" : "nouvel emprunt"));
  if(v.retraits) parts.push("−" + fmtF(v.retraits) + " " + (v.nRetraits > 1 ? "dettes soldées" : "dette soldée"));
  var n = el("div", "tiny muted note-mens");
  n.setAttribute("data-test", "note-mensualites");
  segments(n, parts);
  return n;
}

/* ---------- rubriques du suivi (Prêts donnés, Mensualités) ---------- */
function nomLibre(nom){
  return S.rubriques.some(function(x){ return cleTexte(x.nom) === cleTexte(nom); }) ? nom + SUFFIXE_SUIVI : nom;
}
function nomRubriqueSuivi(id){
  var r = rubriqueParId(id);
  return r ? r.nom : nomLibre(catalogueParId(id).nom);
}
/* Active la rubrique en un tap ; si l'id manque (nom déjà pris, 7B), elle est créée depuis le
   catalogue sous le nom « … (suivi) » */
function assurerRubriqueSuivi(id){
  var r = rubriqueParId(id);
  if(!r){
    var c = catalogueParId(id);
    r = rubriqueDuCatalogue(c);
    r.nom = nomLibre(c.nom);
    S.rubriques.push(r);
  }
  r.active = true;
  sauver();
  return r;
}
function zoneActivation(id, apres){
  var z = el("div", "field");
  var r = rubriqueParId(id);
  if(r && r.active){ z.hidden = true; return z; }
  var nom = nomRubriqueSuivi(id);
  z.appendChild(el("p", "small muted", "La rubrique « " + nom + " » n'est pas active."));
  var b = el("button", "btn btn-line", "Activer « " + nom + " »");
  b.type = "button";
  b.setAttribute("data-test", "activer-rubrique");
  b.addEventListener("click", function(){
    var x = assurerRubriqueSuivi(id);
    z.innerHTML = "";
    z.appendChild(el("p", "small c-vert", x.icone + " " + x.nom + " activée ✓"));
    if(apres) apres();
  });
  z.appendChild(b);
  return z;
}

  var fd = el("div", "field");
  fd.appendChild(el("label", null, lab));
  var i = document.createElement("input");
  i.type = "text"; i.inputMode = "numeric"; i.className = "input num"; i.placeholder = "0";
  i.setAttribute("autocomplete", "off");
  i.setAttribute("aria-label", lab);

  fd.appendChild(i);
  return fd;
}
function champTexte(lab, test, valeur, max, onChange, suggestions){
  var fd = el("div", "field");
  fd.appendChild(el("label", null, lab));
  var i = document.createElement("input");
  i.type = "text"; i.className = "input"; i.maxLength = max;
  i.setAttribute("aria-label", lab);
  i.setAttribute("data-test", test);
  i.value = valeur || "";
  i.addEventListener("input", function(){ onChange(i.value); });
  fd.appendChild(i);
  if(suggestions && suggestions.length){
    var rp = el("div", "chips chips-sous chips-ligne");
    suggestions.forEach(function(p){
      var c = el("button", "chip chip-s", p);
      c.type = "button";
      c.addEventListener("click", function(){ i.value = p; onChange(p); });
      rp.appendChild(c);
    });
    fd.appendChild(rp);
  }
  return fd;
}
function champDateSeule(lab, test, valeur, max, onChange){
  var fd = el("div", "field");
  fd.appendChild(el("label", null, lab));
  var i = document.createElement("input");
  i.type = "date"; i.className = "input";
  i.setAttribute("aria-label", lab);
  i.setAttribute("data-test", test);
  if(max) i.max = max;
  i.value = valeur || "";
  i.addEventListener("change", function(){
    var v = i.value || "";
    if(max && v && v > max){ v = max; i.value = v; }
    onChange(v);
  });
  fd.appendChild(i);
  return fd;
}
/* Date : Aujourd'hui · Hier · autre date, jamais future */
function champDatePassee(lab, test, etat, cle){
  var fd = el("div", "field");
  fd.appendChild(el("label", null, lab));
  var chips = el("div", "chips");
  chips.style.marginBottom = "8px";
  var hier = new Date(); hier.setDate(hier.getDate() - 1);
  var racc = [{lab: "Aujourd'hui", val: aujourdhui()}, {lab: "Hier", val: iso(hier)}];
  var i = document.createElement("input");
  i.type = "date"; i.className = "input"; i.max = aujourdhui();
  i.setAttribute("aria-label", lab);
  i.setAttribute("data-test", test);
  i.value = etat[cle] || "";
  function majC(){
    Array.prototype.slice.call(chips.querySelectorAll(".chip")).forEach(function(x, k){
      x.setAttribute("aria-pressed", etat[cle] === racc[k].val ? "true" : "false");
    });
  }
  racc.forEach(function(rc){
    var c = el("button", "chip", rc.lab);
    c.type = "button";
    c.addEventListener("click", function(){ etat[cle] = rc.val; i.value = rc.val; majC(); });
    chips.appendChild(c);
  });
  i.addEventListener("change", function(){
    var v = i.value || aujourdhui();
    if(v > aujourdhui()) v = aujourdhui();
    etat[cle] = v; i.value = v; majC();
  });
  majC();
  fd.appendChild(chips); fd.appendChild(i);
  return fd;
}

/* ---------- écran secondaire « Prêts et dettes » ---------- */
var pretsSoldesOuverts = {donne: false, dette: false};
function vuePrets(ec, ba){
  var orig = retourDe("prets");
  var rO = orig === "rubrique" ? rubriqueParId(rubOuverte) : null;
  ec.appendChild(boutonRetour(rO ? rO.nom : libelleVue(orig), orig));

  sectionPrets(ec, "dette");
  boutonPlus(ba, null);   /* le « + » flottant reste la saisie d'une dépense, comme sur les autres écrans */
}
function sectionPrets(ec, sens){
  var donne = sens === "donne";
  var tous = (S.prets || []).filter(function(p){ return p.sens === sens; });
  var t = resumePrets(tous, sens);
  ec.appendChild(el("h2", null, donne ? "Prêts donnés" : "Dettes"));
  var cr = el("div", "card sec-prets");
  cr.setAttribute("data-test", "section-" + sens);
  if(tous.length) cr.appendChild(figures3([[donne ? "Prêté" : "Emprunté", t.montant], ["Remboursé", t.rembourse], ["Reste", t.reste]], "sec-" + sens));
  else cr.appendChild(el("div", "vide-msg", donne ? "Aucun prêt suivi pour l'instant." : "Aucune dette suivie pour l'instant."));

/* [Remboursement reçu] (prêt donné) ou [Je rembourse] (dette) :
   Partiel · Totalité, montant, date jamais future */
function ouvrirRemboursement(p){
  var donne = p.sens === "donne";
  var reste = restePret(p);
  var mens = (!donne && p.mensualite > 0) ? (reste > 0 ? Math.min(p.mensualite, reste) : p.mensualite) : 0;
  var etat = {mode: "partiel", montant: mens, date: aujourdhui()};
  var f = creerFeuille(donne ? "Remboursement reçu" : "Je rembourse");
  f.sh.setAttribute("data-test", "feuille-remb");
  var c = el("div", "tb-tete");
  c.appendChild(el("div", "lab tiny muted", nomPret(p).toUpperCase()));
  c.appendChild(el("div", "big nw", fmtF(reste)));
  c.appendChild(el("div", "tiny muted", "reste sur " + fmtF(p.montant)));
  f.body.appendChild(c);

  var fM = el("div", "field");
  fM.appendChild(el("label", null, "Remboursement"));
  var chM = el("div", "chips");
  chM.setAttribute("role", "group");
  chM.setAttribute("aria-label", "Partiel ou totalité");
  chM.setAttribute("data-test", "remb-mode");
  fM.appendChild(chM);
  f.body.appendChild(fM);
  var im = montantXL("remb-montant", etat.montant, function(v){ etat.montant = v; maj(); });
  f.body.appendChild(im);
  f.body.appendChild(el("div", "devise", "FRANCS CFA"));
  function dessinerModes(){
    chM.innerHTML = "";
    [["partiel", "Partiel"], ["total", "Totalité"]].forEach(function(m){
      var b = el("button", "chip", m[1]);
      b.type = "button";
      b.setAttribute("aria-pressed", etat.mode === m[0] ? "true" : "false");
      b.addEventListener("click", function(){
        etat.mode = m[0];
        if(m[0] === "total") etat.montant = reste;
        else if(!donne && mens > 0) etat.montant = mens;   /* Partiel : la mensualité, si elle existe */
        im.value = etat.montant > 0 ? fmt(etat.montant) : "";
        dessinerModes(); maj();
      });
      chM.appendChild(b);
    });
  }
  dessinerModes();
  f.body.appendChild(champDatePassee("Date", "remb-date", etat, "date"));
  var actif = true;
  if(!donne){
    var r0 = rubriqueParId(ID_MENSUALITES);
    actif = !!(r0 && r0.active);
    f.body.appendChild(zoneActivation(ID_MENSUALITES, function(){ actif = true; maj(); }));
  }
  var bar = el("div", "sticky"), inn = el("div", "sticky-in");
  var bOk = bouton("btn btn-primary", "Enregistrer", enregistrer);
  bOk.setAttribute("data-test", "remb-enregistrer");
  inn.appendChild(bOk); bar.appendChild(inn); f.sh.appendChild(bar);
  function maj(){ bOk.disabled = !(etat.montant > 0 && actif); }
  maj();
  setTimeout(function(){ try{ im.focus(); }catch(e){} }, 60);

  function enregistrer(){
    var m = Number(etat.montant) || 0;
    if(!(m > 0) || !actif) return;
    var d = (etat.date && etat.date <= aujourdhui()) ? etat.date : aujourdhui();
    if(donne){
      var rev = {id: uid(), libelle: libelleRemb(p), montant: m, date: d, nature: NATURE_REMBOURSEMENT, type: TYPE_REMBOURSEMENT};
      S.revenus.push(rev);
      ajouterRemboursement(p, rev);
      rev.pret = p.id;
      sauver(); fermerFeuille(false); render();
      toastAnnuler("Remboursement noté ✓", function(){ annulerRevenuCree(rev.id); });
    }else{
      var rub = rubriqueParId(ID_MENSUALITES);
      if(!rub) return;
      var dep = {id: uid(), rubrique: rub.id, montant: m, libelle: libelleRemb(p), date: d, cree: Date.now()};
      S.depenses.push(dep);
      ajouterRemboursement(p, dep);
      dep.etiquette = etiquetteRemb(p, dep.id);
      dep.pret = p.id;
      sauver(); fermerFeuille(false); render();
      toastAnnuler("Remboursement noté ✓", function(){ annulerDepenseCreee(dep.id, false, null); });
    }
  }
}

/* [Modifier] : qui, échéance, mensualité ; le montant se change sur la ligne d'origine,
   ou ici si le prêt n'a pas de ligne d'origine */
function ouvrirModifierPret(p){
  var donne = p.sens === "donne";

    var note = el("p", "small muted", "Montant : " + fmtF(p.montant) + ". Il se change sur la ligne d'origine.");
    note.style.margin = "0 0 10px";

      f.body.appendChild(bO);
    }

  f.body.appendChild(champTexte(donne ? "À qui ?" : "Auprès de qui ?", "mp-qui", etat.qui, POUR_QUI_MAX, function(v){ etat.qui = v; }, donne ? personnesRecentes() : null));
  f.body.appendChild(champDateSeule(donne ? "Remboursement prévu le" : "Fin prévue le", "mp-echeance", etat.echeance, null, function(v){ etat.echeance = v; }));
  if(!donne) f.body.appendChild(champSomme("Mensualité", "mp-mensualite", etat.mensualite, function(v){ etat.mensualite = v; }));
  var bar = el("div", "sticky"), inn = el("div", "sticky-in");

    if(!pretParId(p.id)) return;
    p.qui = propre(etat.qui, POUR_QUI_MAX);
    p.echeance = estIso(etat.echeance) ? etat.echeance : null;
    if(!donne) p.mensualite = Math.max(0, Math.round(Number(etat.mensualite) || 0));
    if(!p.origine && etat.montant > 0) p.montant = Math.round(etat.montant);
    recalculerModes(p);
    sauver(); fermerFeuille(false); render();
    toast("Modification enregistrée");
  });
  bOk.setAttribute("data-test", "mp-enregistrer");
  inn.appendChild(bOk); bar.appendChild(inn); f.sh.appendChild(bar);
  function maj(){ bOk.disabled = !p.origine && !(etat.montant > 0); }

/* ==============================================================
   SPRINT 7D — LOUPE AU-DESSUS DU « + », REVENUS PAR JOUR · SEMAINE ·
   MOIS, MENU « MES ENVELOPPES », ÉTIQUETTES DU CATALOGUE PROPOSÉES,
   EXPORT EN IMAGE
   Règle du sprint : AUCUN calcul ne change et AUCUNE donnée n'est
   écrite. Les totaux de l'image viennent des fonctions existantes
   (totalRevenus, totalDepense, totauxNatures, totalEpargne, résumé
   des prêts du 7C). Tout est local : aucun appel réseau.
   ============================================================== */
var LOUPE_ECART_PX = 12;           /* écart entre le bas de la loupe et le haut du « + » (même axe vertical) */
var NAV_HAUTEUR_REF = 62;          /* hauteur du menu à une ligne (7C), sur laquelle les marges du « + » sont calées */
var ETIQUETTES_PROPOSEES_MAX = 8;  /* pastilles d'étiquettes proposées à la saisie (celles de l'utilisateur ne sont jamais retirées) */
var IMAGE_LARGEUR = 1080;          /* largeur de l'image exportée, en pixels ; la hauteur suit le contenu */
var IMAGE_RUBRIQUES_MAX = 8;       /* lignes « Par enveloppe », puis « + n autres · montant » */

/* ---------- menu du bas : --navh suit sa hauteur réelle (libellés sur deux lignes) ---------- */
function majHauteurMenu(){
  var n = document.querySelector("#onglets .nav-tabs-in");
  var h = (n && document.body.classList.contains("avec-onglets")) ? n.offsetHeight : 0;

/* ---------- Mon état › Dépenses : loupe ronde au-dessus du « + » ----------
   Comportement du 7A conservé : un tap ramène sur Jour, déplie le champ en haut
   de l'écran, fait défiler jusqu'à lui et y met le focus ; « × » le vide et le
   replie ; tant qu'une recherche est active, la loupe garde l'anneau doré. */
function boutonLoupe(parent){
  var ouverte = rechercheOuverte || !!cleTexte(filtreJournal.texte);
  var b = el("button", "loupe-flot", "🔍");
  b.type = "button";
  b.setAttribute("data-test", "loupe");
  b.setAttribute("aria-label", "Rechercher dans les dépenses");
  b.setAttribute("aria-expanded", ouverte ? "true" : "false");
  b.addEventListener("click", function(){

    else rafraichirSurPlace();

    if(!ch) return;
    montrerChamp(ch);
    try{ ch.focus({preventScroll: true}); }catch(e){ try{ ch.focus(); }catch(e2){} }
  });

  return b;
}
/* défile jusqu'au champ s'il n'est pas déjà en vue dans le haut de l'écran */
function montrerChamp(ch){
  try{
    var hd = document.querySelector("header.top");
    var haut = hd ? hd.getBoundingClientRect().bottom : 0;
    var r = ch.getBoundingClientRect();
    if(r.top >= haut && r.bottom <= window.innerHeight * 0.5) return;
    window.scrollTo(0, Math.max(0, Math.round(r.top + (window.pageYOffset || 0) - haut - 12)));
  }catch(e){}
}

/* ---------- Mon état › Revenus : Jour · Semaine · Mois ----------
   Date d'un revenu : sa date ; sans date, le début du cycle (règle du 7A).
   Une seule fonction pour tout l'écran : dateRevenu(). Les bornes de Revenus
   sont à part ; celles de Dépenses (borneBasse, borneHaute) ne changent pas. */
function dateRevenu(r){ return (r && r.date) || S.cycleDebut || aujourdhui(); }
function revenusPeriode(deb, fin){
  return revenusTries().filter(function(r){ var d = dateRevenu(r); return d >= deb && d <= fin; });
}
function totalLignes(l){ return (l || []).reduce(function(t, x){ return t + (Number(x.montant) || 0); }, 0); }
/* du jour du premier revenu jusqu'à aujourd'hui (ou jusqu'au dernier revenu, s'il est daté plus tard) ;
   sans aucun revenu : aujourd'hui seulement */
function borneBasseRevenus(){
  var m = null;
  S.revenus.forEach(function(r){ var d = dateRevenu(r); if(m === null || d < m) m = d; });
  return m || aujourdhui();
}
function borneHauteRevenus(){
  var m = null;
  S.revenus.forEach(function(r){ var d = dateRevenu(r); if(m === null || d > m) m = d; });
  return (m && m > aujourdhui()) ? m : aujourdhui();
}
function clampJourRevenus(j){
  var b = borneBasseRevenus(), h = borneHauteRevenus();
  j = j || aujourdhui();
  return j < b ? b : (j > h ? h : j);
}
/* « + Revenu » : feuille « Nouveau revenu » du 7A, à la date du jour */
function boutonPlusRevenu(){
  var b = el("button", "btn case-plus etat-plus-rev", "+ Revenu");
  b.type = "button";
  b.setAttribute("data-test", "etat-plus-revenu");
  b.addEventListener("click", function(){ ouvrirRevenu({}); });
  return b;
}
function motRevenus(n){ return n ? n + (n > 1 ? " revenus" : " revenu") : "Aucun revenu"; }
/* --- Jour : résumé, « + Revenu », les revenus du jour (un tap ouvre la modification) --- */
function etatRevenusJour(ec){
  var j = etatUI.jour;
  var bas = borneBasseRevenus(), haut = borneHauteRevenus();
  var lis = dateLisible(j), court = lis === "Aujourd'hui" || lis === "Hier";
  ec.appendChild(navigationPeriode(court ? lis : jourLong(j), court ? jourLong(j) : "",
    j > bas ? function(){ etatAller("jour", ajouterJours(j, -1), true, "revenus"); } : null,
    j < haut ? function(){ etatAller("jour", ajouterJours(j, 1), true, "revenus"); } : null));
  var l = revenusPeriode(j, j);
  ec.appendChild(resumePeriode(l.length, totalLignes(l), "Aucun revenu", ["revenu", "revenus"]));
  ec.appendChild(boutonPlusRevenu());
  if(!l.length) return;
  ec.appendChild(el("h2", null, "Revenus du jour"));
  var card = el("div", "card");
  card.setAttribute("data-test", "revenus-liste");
  l.forEach(function(r){ card.appendChild(ligneRevenu(r)); });
  ec.appendChild(card);
}
/* --- Semaine : « Semaine du … au … », résumé, puis les jours (un tap ouvre ce jour) --- */
function etatRevenusSemaine(ec){
  var l = lundiDe(etatUI.jour), s = dimancheDe(l);
  var bas = borneBasseRevenus(), haut = borneHauteRevenus();
  ec.appendChild(navigationPeriode(
    "Semaine du " + jourMois(l) + " au " + jourMois(s),
    "",
    l > lundiDe(bas) ? function(){ etatAller("semaine", ajouterJours(l, -7), true, "revenus"); } : null,
    l < lundiDe(haut) ? function(){ etatAller("semaine", ajouterJours(l, 7), true, "revenus"); } : null));
  var lgS = revenusPeriode(l, s);
  ec.appendChild(resumePeriode(lgS.length, totalLignes(lgS), "Aucun revenu", ["revenu", "revenus"]));
  ec.appendChild(boutonPlusRevenu());
  var j0 = l < bas ? bas : l, j1 = s > haut ? haut : s;
  var card = el("div", "card");
  card.setAttribute("data-test", "etat-jours");
  for(var j = j0; j <= j1; j = ajouterJours(j, 1)){
    (function(j){
      var lg = revenusPeriode(j, j), tot = totalLignes(lg);
      var b = el("button", "lig-per");
      b.type = "button";
      b.setAttribute("data-jour", j);
      var t = el("div", "lp-t", jourLong(j) + (j === aujourdhui() ? " · aujourd'hui" : ""));
      t.appendChild(el("small", null, motRevenus(lg.length)));
      b.appendChild(t);
      b.appendChild(el("div", tot ? "lp-m" : "lp-m zero", tot ? fmtF(tot) : "—"));
      b.appendChild(el("span", "chev", "›"));
      b.addEventListener("click", function(){ etatAller("jour", j, false, "revenus"); });
      card.appendChild(b);
    })(j);
  }
  ec.appendChild(card);
}

/* ---------- étiquettes du catalogue proposées aux rubriques existantes ----------

var ETIQUETTES_CATALOGUE_IDS = ["loyer", "abonnements", "mensualites", "scolarite", "transport", "nourrmaison",

/* anciennes rubriques sans id du catalogue (Sprint 7D) */
var ETIQUETTES_EQUIVALENTS = {

};
/* installation du 6B : reconnue à la présence de la rubrique d'id « maison » */
function estInstallation6B(){ return S.rubriques.some(function(r){ return !!r && r.id === "maison"; }); }
/* Rien pour : wifi, gaz, assurances, épargnes spécialisées, investissements, À classer,
   rubriques personnalisées, ni pour les 9 rubriques-familles d'une installation 6B. */

/* ==============================================================
   SPRINT 7D — EXPORT EN IMAGE
   PNG de IMAGE_LARGEUR px de large, hauteur calculée sur le contenu,
   toujours en thème clair (même image en clair et en sombre), polices
   du système. L'image ne montre que des totaux : aucun libellé, aucune
   personne, aucune étiquette, aucun nom de prêt.
   contenuImage() → données (fonction pure, testée dans jsdom) ;
   planImage() → mise en page mesurée ; dessinerPlanImage() → canvas.
   ============================================================== */
var IMAGE_POLICE = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
var IMAGE_COULEURS = {   /* thème clair « bandeau MonDjai », quel que soit le thème de l'application */
  fond: "#eff1f4", bandeau: "#141922", carte: "#ffffff", bord: "#e3e6eb", texte: "#151a22", muted: "#5a6372",
  bandeauTexte: "#ffffff", bandeauMuted: "#b4bcc9", ambre: "#f5a623", vert: "#137a52", rouge: "#c4382c",
  piste: "#e9ecf1", icoFond: "#f3f5f8", neutre: "#aab1bc"
};
var IMAGE_PIED = "Résumé indicatif · fait sur ce téléphone avec MonDjai";

function anneeDe(s){ return deIso(s).getFullYear(); }
function jourMoisAnnee(s){ return jourMois(s) + " " + anneeDe(s); }
function majusculeInitiale(t){ t = String(t || ""); return t ? t.charAt(0).toUpperCase() + t.slice(1) : t; }
/* « Cycle du 1 oct. au 31 oct. 2026 » */
function periodeCycleImage(deb, fin){
  return "Cycle du " + (anneeDe(deb) === anneeDe(fin) ? jourMois(deb) : jourMoisAnnee(deb)) + " au " + jourMoisAnnee(fin);
}
/* « Semaine du 12 au 18 oct. 2026 », « Semaine du 28 sept. au 4 oct. 2026 » */
function periodeSemaineImage(deb, fin){
  var a = deIso(deb), b = deIso(fin), d;
  if(a.getFullYear() !== b.getFullYear()) d = jourMoisAnnee(deb);
  else if(a.getMonth() !== b.getMonth()) d = jourMois(deb);
  else d = String(a.getDate());
  return "Semaine du " + d + " au " + jourMoisAnnee(fin);
}
function couleurGroupeImage(g){ var c = COULEURS_GROUPES[g]; return c ? c.clair.trait : IMAGE_COULEURS.neutre; }
/* « Par enveloppe » : rubriques avec une dépense sur la période (au Mois, aussi les rubriques
   actives qui ont un budget), du plus gros dépensé au plus petit ; IMAGE_RUBRIQUES_MAX lignes. */
function enveloppesImage(depenses, avecBudget){
  var par = {}, ordre = [];
  (depenses || []).forEach(function(d){
    if(!(d.rubrique in par)){ par[d.rubrique] = 0; ordre.push(d.rubrique); }
    par[d.rubrique] += Number(d.montant) || 0;
  });
  var lignes = [], vus = {};
  S.rubriques.forEach(function(r, i){
    var bud = (avecBudget && r.active) ? (Number(r.montant) || 0) : 0;
    if(!(r.id in par) && !(bud > 0)) return;
    vus[r.id] = true;
    lignes.push({icone: r.icone || "•", nom: r.nom || "Rubrique", depense: par[r.id] || 0,
                 budget: avecBudget ? bud : null, groupe: r.groupe || "", ordre: i});
  });
  /* une dépense dont la rubrique n'existe plus reste comptée, sous un nom neutre */
  ordre.forEach(function(id){
    if(vus[id]) return;
    lignes.push({icone: "•", nom: estAClasser({id: id}) ? RUBRIQUE_ACLASSER.nom : "Autre", depense: par[id],
                 budget: avecBudget ? 0 : null, groupe: "", ordre: S.rubriques.length + lignes.length});
  });
  if(!lignes.length) return null;
  lignes.sort(function(a, b){
    if(a.depense !== b.depense) return b.depense - a.depense;
    if((b.budget || 0) !== (a.budget || 0)) return (b.budget || 0) - (a.budget || 0);
    return a.ordre - b.ordre;
  });
  var montrees = lignes.slice(0, IMAGE_RUBRIQUES_MAX), reste = lignes.slice(IMAGE_RUBRIQUES_MAX);
  return {titre: "Par enveloppe",
          lignes: montrees.map(function(x){ return {icone: x.icone, nom: x.nom, depense: x.depense, budget: x.budget, groupe: x.groupe}; }),
          autres: reste.length ? {nb: reste.length, montant: totalLignes(reste.map(function(x){ return {montant: x.depense}; }))} : null};
}
/* « Prêts et dettes » (7C) : seulement s'il existe un prêt actif sur le cycle ; parts non nulles, sans aucun nom */
function pretsImage(){
  var act = pretsActifs();
  if(!act.length) return null;
  var td = resumePrets(act, "donne"), tt = resumePrets(act, "dette"), parts = [];
  if(td.reste > 0) parts.push({lab: "À recevoir", montant: td.reste});
  if(tt.reste > 0) parts.push({lab: "À rembourser", montant: tt.reste});
  return {titre: "Prêts et dettes", parts: parts, texte: parts.length ? "" : "Tout est soldé ✓"};
}
/* Contenu de l'image (fonction pure : aucune écriture). mode : "jour" | "semaine" | "mois" (défaut) */
function contenuImage(mode, jour){
  mode = (mode === "jour" || mode === "semaine") ? mode : "mois";
  jour = jour || aujourdhui();
  var deb, fin, periode, deps, revs;
  if(mode === "mois"){
    deb = debutEtat(); fin = finCycleEtat();
    periode = periodeCycleImage(deb, fin);
    deps = S.depenses.slice(); revs = S.revenus.slice();
  }else if(mode === "semaine"){
    deb = lundiDe(jour); fin = dimancheDe(deb);
    periode = periodeSemaineImage(deb, fin);
    deps = lignesPeriode(deb, fin); revs = revenusPeriode(deb, fin);
  }else{
    deb = jour; fin = jour;
    periode = majusculeInitiale(jourLong(jour)) + " " + anneeDe(jour);
    deps = lignesPeriode(deb, fin); revs = revenusPeriode(deb, fin);
  }
  var c = {mode: mode, debut: deb, fin: fin, fichier: "mondjai-bilan-" + mode + "-" + deb + ".png",
           titre: "MonDjai · Salaire", periode: periode, creee: "Créée le " + dateJJMMAAAA(aujourdhui()),
           principal: null, lignes: [], enveloppes: null, prets: null, pied: IMAGE_PIED};
  if(mode === "mois"){
    c.principal = {lab: "Il vous reste", montant: totalRevenus() - totalDepense(), sous: ""};
    var nat = totauxNatures(S.revenus);
    var utilisees = NATURES.filter(function(n){ return nat[n.cle] > 0; });
    c.lignes.push({lab: "Revenus", montant: totalRevenus(), sous: "",
                   dont: utilisees.length >= 2 ? utilisees.map(function(n){ return {lab: "dont " + n.dont, montant: nat[n.cle]}; }) : []});
    c.lignes.push({lab: "Dépenses", montant: totalDepense(), sous: motNombre(S.depenses.length, "dépense", "dépenses")});
    var ep = totalEpargne();
    if(ep > 0) c.lignes.push({lab: "Ma petite caisse", montant: ep, sous: "", vert: true});
  }else{
    c.principal = {lab: "Dépenses", montant: totalLignes(deps),
                   sous: deps.length ? motNombre(deps.length, "dépense", "dépenses") : "Aucune dépense"};
    if(revs.length) c.lignes.push({lab: "Revenus", montant: totalLignes(revs), sous: motNombre(revs.length, "revenu", "revenus")});
    c.lignes.push({lab: "Il vous reste ce cycle", montant: totalRevenus() - totalDepense(), sous: "", petit: true});
  }
  c.enveloppes = enveloppesImage(deps, mode === "mois");
  c.prets = pretsImage();
  return c;
}
function montantEnveloppeImage(e){ return e.budget > 0 ? fmt(e.depense) + " / " + fmtF(e.budget) : fmtF(e.depense); }
function texteAutresImage(a){ return "+ " + a.nb + (a.nb > 1 ? " autres" : " autre") + " · " + fmtF(a.montant); }
/* Les textes de l'image, ligne par ligne (tests, et description de l'aperçu pour les lecteurs d'écran) */
function textesImage(c){
  var t = [c.titre, c.periode, c.creee];
  if(c.principal) t.push(c.principal.lab + " " + fmtF(c.principal.montant) + (c.principal.sous ? " · " + c.principal.sous : ""));
  c.lignes.forEach(function(l){
    t.push(l.lab + " " + fmtF(l.montant) + (l.sous ? " · " + l.sous : ""));
    (l.dont || []).forEach(function(d){ t.push(d.lab + " " + fmtF(d.montant)); });
  });
  if(c.enveloppes){
    t.push(c.enveloppes.titre);
    c.enveloppes.lignes.forEach(function(e){ t.push(e.nom + " " + montantEnveloppeImage(e)); });
    if(c.enveloppes.autres) t.push(texteAutresImage(c.enveloppes.autres));
  }
  if(c.prets){
    t.push(c.prets.titre);
    c.prets.parts.forEach(function(p){ t.push(p.lab + " " + fmtF(p.montant)); });
    if(c.prets.texte) t.push(c.prets.texte);
  }
  t.push(c.pied);
  return t;
}

/* Mise en page : opérations de dessin positionnées. mesurer(texte, police) → largeur en px.
   Un montant n'est jamais tronqué (sa taille diminue au besoin) ; un nom se raccourcit avec « … ». */
function planImage(c, mesurer){
  var K = IMAGE_COULEURS, L = IMAGE_LARGEUR;
  var M = 56, P = 44, GAP = 28;
  var X0 = M, W = L - 2 * M, XI = X0 + P, WI = W - 2 * P, XD = XI + WI;
  var ops = [], y = 0;
  function pol(poids, taille){ return poids + " " + taille + "px " + IMAGE_POLICE; }
  function larg(t, poids, taille){ return Number(mesurer(String(t), pol(poids, taille))) || 0; }
  function txt(t, x, base, poids, taille, couleur, align, zone, montant){
    ops.push({t: "texte", texte: String(t), x: x, y: base, police: pol(poids, taille), couleur: couleur,
              align: align || "left", zone: zone || null, montant: !!montant, largeur: larg(t, poids, taille)});
  }
  function rect(x, yy, w, h, r, fill, bord){ ops.push({t: "rect", x: x, y: yy, w: w, h: h, r: r || 0, fill: fill, bord: bord || null, basSeul: false}); }
  function ajuster(t, poids, taille, max, min){ while(taille > min && larg(t, poids, taille) > max) taille -= 2; return taille; }
  function couper(t, poids, taille, max){
    t = String(t);
    if(larg(t, poids, taille) <= max) return t;
    var a = Array.from(t);
    while(a.length > 1 && larg(a.join("").replace(/\s+$/, "") + "…", poids, taille) > max) a.pop();
    return a.join("").replace(/\s+$/, "") + "…";
  }
  function carte(dessin){
    var haut = y, idx = ops.length;
    y += P;
    dessin();
    y += P;
    ops.splice(idx, 0, {t: "rect", x: X0, y: haut, w: W, h: y - haut, r: 30, fill: K.carte, bord: K.bord, basSeul: false});
    y += GAP;
  }
  function titreCarte(t){ var b = y + 26; txt(t.toUpperCase(), XI, b, 700, 27, K.muted); y = b + 20; }
  /* une ligne « libellé … montant » ; l = {lab, montant, sous, dont, vert, petit} */
  function ligneChiffre(l){
    var petit = !!l.petit, tl = petit ? 28 : 34, tm0 = petit ? 28 : 36, pm = petit ? 700 : 800;
    var m = fmtF(l.montant);
    var tm = ajuster(m, pm, tm0, Math.round(WI * 0.62), 18);
    var wM = larg(m, pm, tm);
    var base = y + (petit ? 38 : 46);
    var lab = couper(l.lab, 600, tl, WI - wM - 24);
    var zoneW = WI - larg(lab, 600, tl) - 24;
    txt(lab, XI, base, 600, tl, petit ? K.muted : K.texte);
    txt(m, XD, base, pm, tm, l.vert ? K.vert : (l.montant < 0 ? K.rouge : K.texte), "right", {x: XD - zoneW, w: zoneW}, true);
    y = base + (petit ? 12 : 16);
    if(l.sous){ var bs = y + 26; txt(l.sous, XI, bs, 500, 28, K.muted); y = bs + 8; }
    (l.dont || []).forEach(function(d){
      var md = fmtF(d.montant), td = ajuster(md, 600, 28, Math.round(WI * 0.5), 18), bd = y + 34;
      var labD = couper(d.lab, 500, 28, WI - 28 - larg(md, 600, td) - 24);
      var zD = WI - 28 - larg(labD, 500, 28) - 24;
      txt(labD, XI + 28, bd, 500, 28, K.muted);
      txt(md, XD, bd, 600, td, K.muted, "right", {x: XD - zD, w: zD}, true);
      y = bd + 6;
    });
    y += 10;
  }

  /* --- en-tête : bandeau MonDjai --- */
  var b1 = 64 + 46;
  var wMon = larg("Mon", 800, 52), wDjai = larg("Djai", 800, 52);
  txt("Mon", XI, b1, 800, 52, K.bandeauTexte);
  txt("Djai", XI + wMon, b1, 800, 52, K.ambre);
  txt(" · Salaire", XI + wMon + wDjai, b1, 700, 38, K.bandeauMuted);
  var tP = ajuster(c.periode, 800, 46, WI, 28);
  var b2 = b1 + 30 + Math.round(tP * 0.95);
  txt(c.periode, XI, b2, 800, tP, K.bandeauTexte, "left", {x: XI, w: WI});
  var b3 = b2 + 46;
  txt(c.creee, XI, b3, 600, 29, K.bandeauMuted);
  y = b3 + 50;
  var debutCartes = y;

  /* --- carte principale --- */
  if(c.principal){
    carte(function(){
      var p = c.principal;
      titreCarte(p.lab);
      var m = fmtF(p.montant);
      var tG = ajuster(m, 800, 100, WI, 40);
      var bg = y + Math.round(tG * 0.9);
      txt(m, XI, bg, 800, tG, p.montant < 0 ? K.rouge : K.texte, "left", {x: XI, w: WI}, true);
      y = bg + 14;
      if(p.sous){ var bs = y + 32; txt(p.sous, XI, bs, 600, 32, K.muted); y = bs + 6; }
      if(c.lignes.length){
        y += 22; rect(XI, y, WI, 2, 0, K.bord); y += 2;
        c.lignes.forEach(ligneChiffre);
      }
    });
  }

  /* --- par enveloppe --- */
  if(c.enveloppes){
    carte(function(){
      var e = c.enveloppes;
      titreCarte(e.titre);
      var xn = XI + 84;
      e.lignes.forEach(function(r){
        var haut = y + 8;
        ops.push({t: "rond", x: XI + 30, y: haut + 34, r: 30, fill: K.icoFond});
        txt(r.icone, XI + 30, haut + 46, 400, 32, K.texte, "center");
        var avecB = r.budget > 0;
        var sp = avecB ? fmt(r.depense) : fmtF(r.depense), bp = avecB ? " / " + fmtF(r.budget) : "";
        var tA = 34, tB = 30, maxA = WI - 84 - 24 - 90;
        while(larg(sp, 800, tA) + (bp ? larg(bp, 600, tB) : 0) > maxA && tA > 18){ tA -= 2; tB -= 2; }
        var wA = larg(sp, 800, tA), wB = bp ? larg(bp, 600, tB) : 0;
        var base = haut + 46;
        var nom = couper(r.nom, 600, 34, WI - 84 - 24 - wA - wB);
        var zoneW = WI - 84 - 24 - larg(nom, 600, 34);
        txt(nom, xn, base, 600, 34, K.texte);
        if(bp) txt(bp, XD, base, 600, tB, K.muted, "right", {x: XD - wB, w: wB}, true);
        txt(sp, XD - wB, base, 800, tA, K.texte, "right", {x: XD - zoneW, w: zoneW - wB}, true);
        y = haut + 68;
        if(avecB){
          var lt = XD - xn;
          rect(xn, y, lt, 10, 5, K.piste);
          var f = r.depense > 0 ? Math.max(10, Math.round(lt * Math.min(1, r.depense / r.budget))) : 0;
          if(f) rect(xn, y, f, 10, 5, couleurGroupeImage(r.groupe));
          y += 18;
        }
      });
      if(e.autres){ var ba = y + 40; txt(texteAutresImage(e.autres), XI, ba, 600, 30, K.muted); y = ba + 6; }
    });
  }

  /* --- prêts et dettes --- */
  if(c.prets){
    carte(function(){
      titreCarte(c.prets.titre);
      c.prets.parts.forEach(function(p){ ligneChiffre({lab: p.lab, montant: p.montant}); });
      if(c.prets.texte){ var bt = y + 42; txt(c.prets.texte, XI, bt, 600, 34, K.texte); y = bt + 10; }
    });
  }

  /* --- pied --- */
  var tPied = ajuster(c.pied, 500, 26, W, 18);
  var bp2 = y + 18 + 26;
  txt(c.pied, L / 2, bp2, 500, tPied, K.muted, "center");
  y = bp2 + 52;
  ops.unshift({t: "rect", x: 0, y: 0, w: L, h: debutCartes + 96, r: 44, fill: K.bandeau, bord: null, basSeul: true});
  return {largeur: L, hauteur: Math.ceil(y), ops: ops};
}

/* chemin à coins arrondis (sans roundRect, pour les anciens navigateurs) ; basSeul : coins du bas seulement */
function cheminArrondi(ctx, x, y, w, h, r, basSeul){
  r = Math.max(0, Math.min(r || 0, w / 2, h / 2));
  var rh = basSeul ? 0 : r;
  ctx.beginPath();
  ctx.moveTo(x + rh, y);
  ctx.lineTo(x + w - rh, y);
  if(rh) ctx.arcTo(x + w, y, x + w, y + rh, rh);
  ctx.lineTo(x + w, y + h - r);
  if(r) ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  if(r) ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + rh);
  if(rh) ctx.arcTo(x, y, x + rh, y, rh);
  ctx.closePath();
}
function dessinerPlanImage(plan, cv){
  cv = cv || document.createElement("canvas");
  cv.width = plan.largeur; cv.height = plan.hauteur;
  var ctx = null;
  try{ ctx = cv.getContext("2d"); }catch(e){ ctx = null; }
  if(!ctx) return cv;
  ctx.fillStyle = IMAGE_COULEURS.fond;
  ctx.fillRect(0, 0, cv.width, cv.height);
  plan.ops.forEach(function(o){
    if(o.t === "rect"){
      ctx.fillStyle = o.fill;
      if(o.r){
        cheminArrondi(ctx, o.x, o.y, o.w, o.h, o.r, o.basSeul);
        ctx.fill();
        if(o.bord){ ctx.strokeStyle = o.bord; ctx.lineWidth = 2; ctx.stroke(); }
      }else ctx.fillRect(o.x, o.y, o.w, o.h);
    }else if(o.t === "rond"){
      ctx.fillStyle = o.fill;
      ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2); ctx.fill();
    }else if(o.t === "texte"){
      ctx.font = o.police; ctx.fillStyle = o.couleur; ctx.textAlign = o.align; ctx.textBaseline = "alphabetic";
      ctx.fillText(o.texte, o.x, o.y);
    }
  });
  return cv;
}
var ctxMesureImage = null;
function mesurerTexteImage(t, police){
  if(!ctxMesureImage){ try{ ctxMesureImage = document.createElement("canvas").getContext("2d"); }catch(e){ ctxMesureImage = null; } }
  if(!ctxMesureImage) return String(t).length * (parseFloat(String(police).split(" ")[1]) || 16) * 0.56;
  ctxMesureImage.font = police;
  return ctxMesureImage.measureText(String(t)).width;
}
function imagePourPeriode(mode, jour){
  var contenu = contenuImage(mode, jour);
  var plan = planImage(contenu, mesurerTexteImage);
  return {contenu: contenu, plan: plan, canvas: dessinerPlanImage(plan)};
}
/* le téléphone sait-il partager un fichier ? (navigator.canShare avec un fichier) */
function partageFichierPossible(){
  try{
    if(typeof navigator.share !== "function" || typeof navigator.canShare !== "function" || typeof File !== "function") return false;
    return !!navigator.canShare({files: [new File([new Uint8Array(8)], "mondjai.png", {type: "image/png"})]});
  }catch(e){ return false; }
}
function obtenirBlobImage(courant, fin){
  if(courant.blob){ fin(courant.blob); return; }
  try{
    courant.canvas.toBlob(function(b){ courant.blob = b || null; fin(courant.blob); }, "image/png");
  }catch(e){ fin(null); }
}
/* même schéma que la sauvegarde JSON : Blob + lien download */
function telechargerImage(courant){
  obtenirBlobImage(courant, function(blob){
    var ok = false;
    try{
      if(blob){
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = courant.contenu.fichier;
        document.body.appendChild(a);
        a.click();
        setTimeout(function(){
          if(a.parentNode) a.parentNode.removeChild(a);
          URL.revokeObjectURL(url);
        }, 1500);
        ok = true;
      }
    }catch(e){ ok = false; }
    if(ok) toast("Image prête ✓");
    else alert("L'image n'a pas pu être créée sur cet appareil. Réessayez depuis le navigateur Chrome.");
  });
}
function partagerImage(courant){
  obtenirBlobImage(courant, function(blob){
    var f = null;
    try{ if(blob) f = new File([blob], courant.contenu.fichier, {type: "image/png"}); }catch(e){ f = null; }
    if(!f){ toast("Partage indisponible : téléchargez l'image"); return; }
    function echec(e){ if(!(e && e.name === "AbortError")) toast("Partage indisponible : téléchargez l'image"); }
    try{
      var p = navigator.share({files: [f]});
      if(p && typeof p.then === "function") p.then(null, echec);   /* annulation : aucun message */
    }catch(e){ echec(e); }
  });
}
/* Feuille « 🖼️ Image » : Jour · Semaine · Mois (Mois par défaut = le cycle en cours) ;
   ‹ › pour Jour et Semaine, aux bornes de Mon état › Dépenses ; aperçu ; Télécharger ; Partager. */
var imageUI = {mode: "mois", jour: null};
function ouvrirImage(){
  imageUI.mode = "mois";
  imageUI.jour = clampJour(aujourdhui());
  var f = creerFeuille("🖼️ Image");
  f.sh.setAttribute("data-test", "feuille-image");
  var zone = el("div");
  f.body.appendChild(zone);
  function aller_(mode, jour){
    imageUI.mode = mode;
    if(jour) imageUI.jour = clampJour(jour);
    dessiner();
  }
  function dessiner(){
    zone.innerHTML = "";
    var sel = selecteurPeriode([["jour", "Jour"], ["semaine", "Semaine"], ["mois", "Mois"]], imageUI.mode, imageUI,
      function(m){ aller_(m, null); });
    sel.setAttribute("data-test", "image-periode");
    zone.appendChild(sel);
    var j = imageUI.jour, bas = borneBasse(), haut = borneHaute();
    if(imageUI.mode === "jour"){
      zone.appendChild(navigationPeriode(majusculeInitiale(jourLong(j)), "",
        j > bas ? function(){ aller_("jour", ajouterJours(j, -1)); } : null,
        j < haut ? function(){ aller_("jour", ajouterJours(j, 1)); } : null));
    }else if(imageUI.mode === "semaine"){
      var l = lundiDe(j);
      zone.appendChild(navigationPeriode("Semaine du " + jourMois(l) + " au " + jourMois(dimancheDe(l)), "",
        l > lundiDe(bas) ? function(){ aller_("semaine", ajouterJours(l, -7)); } : null,
        l < lundiDe(haut) ? function(){ aller_("semaine", ajouterJours(l, 7)); } : null));
    }
    var res = imagePourPeriode(imageUI.mode, j);
    var courant = {contenu: res.contenu, canvas: res.canvas, plan: res.plan, blob: null};
    var cv = res.canvas;
    cv.className = "img-apercu";
    cv.setAttribute("role", "img");
    cv.setAttribute("aria-label", textesImage(res.contenu).join(". "));
    cv.setAttribute("data-test", "image-apercu");
    cv.setAttribute("data-hauteur", String(res.plan.hauteur));
    zone.appendChild(cv);
    var note = el("p", "tiny muted img-note", "L'image ne montre que des totaux.");
    note.setAttribute("data-test", "image-note");
    zone.appendChild(note);
    obtenirBlobImage(courant, function(){});   /* préparée tout de suite : le partage reste dans le geste */
    var pile = el("div", "pile-btns");
    var bT = el("button", "btn btn-primary", "⬇️ Télécharger l'image");
    bT.type = "button";
    bT.setAttribute("data-test", "image-telecharger");
    bT.addEventListener("click", function(){ telechargerImage(courant); });
    pile.appendChild(bT);
    if(partageFichierPossible()){
      var bP = el("button", "btn", "Partager");
      bP.type = "button";
      bP.setAttribute("data-test", "image-partager");
      bP.addEventListener("click", function(){ partagerImage(courant); });
      pile.appendChild(bP);
    }
    zone.appendChild(pile);
  }
  dessiner();
}

   On réécrit tout de suite l'état migré : même si l'utilisateur
   ne touche à rien, ses données anciennes sont déjà au format
   des cycles, sans qu'il ait rien vu ni rien perdu. */
appliquerTheme();
sauver();
